# One line per Access-Request answered from the connector's cache instead of
# PacketFence (server pf-remote post-auth, when control:Tmp-String-1 is
# "cache-first"). Greppable in radiusd-auth.log: "cache-first HIT".
linelog linelog_cache_first {
	# /dev/stdout, not "stdout": the latter is no special value for
	# rlm_linelog and the line never reaches the radiusd-auth.log pipeline.
	filename = /dev/stdout
	escape_filenames = no
	permissions = 0600
	syslog_facility = local1
	format = "[mac:%{Calling-Station-Id}] cache-first HIT nas %{NAS-IP-Address} ssid %{%{Called-Station-SSID}:-wired} age %{control:Tmp-Integer-0}s: returned VLAN %{reply:Tunnel-Private-Group-ID}"
}
