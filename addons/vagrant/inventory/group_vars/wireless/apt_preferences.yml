---
apt_preferences__list:
  - filename: 'packetfence-ppa.pref'
    package: 'packetfence*'
    # Templated from the target host rather than hardcoded: the PPA publishes
    # one suite per codename (see ci/scripts/generate-pages.sh), so a literal
    # here silently stops matching the moment the base OS moves.
    pin: 'release a={{ ansible_distribution_release }}-gitlab,n={{ ansible_distribution_release }},c=main,b=amd64'
    priority: '900'
    reason: 'always install packetfence packages from packetfence-ppa repository'
