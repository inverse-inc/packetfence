- hosts: pfservers
  name: install pf on standalone
  become: True
  collections:
    - inverse_inc.packetfence

  # The default route (and ansible_default_ipv4) can still be down when this
  # play gathers facts — e.g. right after the OS-upgrade reboot — leaving
  # ansible_default_ipv4 empty so templates reading .interface fail.
  pre_tasks:
    - name: wait for the default route to be up
      ansible.builtin.command: timeout 120 bash -c 'until ip -4 route list default | grep -q .; do sleep 2; done'
      changed_when: false
    - name: refresh network facts now the default route is up
      ansible.builtin.setup:
        gather_subset:
          - network

    # devel and maintenance/X.Y pipelines push their images under a pipeline tag until the
    # tests pass (deploy_containers); manage-images.sh pulls that tag when this file exists.
    - name: Select this pipeline's container images
      ansible.builtin.set_fact:
        pf_ci_image_tag: "{{ lookup('pipe', playbook_dir ~ '/../../../ci/lib/common/pipeline-image-tag.sh') }}"

    - name: Write the pipeline image tag for manage-images.sh
      ansible.builtin.copy:
        dest: /etc/packetfence-ci-image-tag
        content: "{{ pf_ci_image_tag }}\n"
        mode: '0644'
      when: pf_ci_image_tag | length > 0

    - name: Use the package's image tag outside those pipelines
      ansible.builtin.file:
        path: /etc/packetfence-ci-image-tag
        state: absent
      when: pf_ci_image_tag | length == 0

  # search roles in collections
  roles:

    - role: packetfence_common
      tags: common

    - role: packetfence_install
      tags: install

  ###
  # Specific tasks related to Vagrant management
  ###
  # We use another interface than the default as management
  # it's possible to do this until current SSH session has not been cut  
  tasks:
    - import_tasks: tasks/vagrant_iptables.yml
      tags: iptables

    # packetfence-test need to be installed
    - import_tasks: tasks/install_venom_local_vars.yml
      tags: venom_vars
