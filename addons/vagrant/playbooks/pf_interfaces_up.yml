---
- name: Bring up PacketFence private network interfaces with their configurator IPs
  hosts: pfservers
  become: True
  gather_facts: False

  vars:
    # ifindex/net_idx mirror t/venom/vars/all.yml configurator.interfaces.*.index
    # IPs derive like venom_local_vars.yml: subnet's 2nd usable host.
    pf_private_ifaces:
      - { ifindex: 4, net_idx: 1, role: reg }
      - { ifindex: 5, net_idx: 2, role: iso }
      - { ifindex: 6, net_idx: 3, role: inline }

  tasks:
    - name: Compute IP/netmask plan for each PF private NIC
      ansible.builtin.set_fact:
        pf_private_iface_plan: "{{ pf_private_iface_plan | default([]) + [item | combine({
            'subnet': subnet,
            'ip': (subnet | ansible.netcommon.next_nth_usable(2) | ansible.netcommon.ipaddr('address')),
            'cidr': (subnet | ansible.netcommon.ipaddr('prefix'))
          })] }}"
      loop: "{{ pf_private_ifaces }}"
      vars:
        subnet: "{{ users_vars[dict_name]['networks'][item.net_idx]['subnet'] }}"

    - name: Bring up each PF private NIC and assign its configurator IP
      ansible.builtin.shell: |
        set -o pipefail
        iface=$(ip -o link show | awk -F': ' -v i="{{ item.ifindex }}" '$1 == i {print $2}' | awk '{print $1}')
        if [ -z "${iface}" ]; then
          echo "WARN: no interface at index {{ item.ifindex }} (role {{ item.role }})"
          exit 0
        fi
        ip link set dev "${iface}" up
        ip -4 addr show dev "${iface}" | grep -q '{{ item.ip }}/' \
          || ip addr add {{ item.ip }}/{{ item.cidr }} dev "${iface}"
      args:
        executable: /bin/bash
      loop: "{{ pf_private_iface_plan }}"
      changed_when: false
