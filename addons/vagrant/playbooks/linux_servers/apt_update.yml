- hosts: linux_servers
  name: Update the apt cache
  become: True
  gather_facts: False

  pre_tasks:
  - name: Gather min only
    ansible.builtin.setup:
      gather_subset:
        - "!all"

  - name: AD Pretasks
    block:
    - name: AD => Populate service facts
      ansible.builtin.service_facts:

    - name: AD => Ensure samba4ad service is in a running state
      ansible.builtin.service:
        name: samba-ad-dc
        state: started
      register: sambaDetails
      until: sambaDetails.status.ActiveState == "active"
      retries: 15
      delay: 20
      when:
      - "'samba-ad-dc.service' in services"
    when:
    - inventory_hostname == 'ad'

  tasks:
    - name: Configure APT retries and IPv4 forcing
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/80-custom
        owner: root
        group: root
        mode: '0644'
        content: |
          Acquire::Retries "5";
          Acquire::ForceIPv4 "true";
      when: ansible_os_family == 'Debian'

    - name: Update APT repository cache
      apt:  # noqa no-handler
        update_cache: True
      register: apt_update
      retries: 3
      delay: 5
      until: apt_update is succeeded

