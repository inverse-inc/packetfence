---
- hosts: service_virtualswitch
  name: Configure VirtualSwitch VM
  become: True
  gather_facts: True

  tasks:
    - name: Configure APT retries and IPv4 forcing
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/80-custom
        owner: root
        group: root
        mode: '0644'
        content: |
          Acquire::Retries "5";
          Acquire::ForceIPv4 "true";
      when: ansible_facts['os_family'] == "Debian"

    - name: Download virtualswitch package (Debian)
      ansible.builtin.get_url:
        url: "{{ lookup('env', 'CI_VIRTUALSWITCH_BASE_URL') | default('https://support.inverse.ca/~jgoimard/virtualswitch', true) }}/virtualswitch_{{ lookup('env', 'CI_VIRTUALSWITCH_DEB_VERSION') | default('2.5.2-1', true) }}_amd64.deb"
        dest: "/tmp/virtualswitch.deb"
        url_username: "{{ lookup('env', 'CI_VIRTUALSWITCH_USER') }}"
        url_password: "{{ lookup('env', 'CI_VIRTUALSWITCH_PASSWORD') }}"
        mode: '0644'
        force_basic_auth: yes
      when: ansible_facts['os_family'] == "Debian"

    - name: Install virtualswitch package (Debian)
      ansible.builtin.apt:
        deb: "/tmp/virtualswitch.deb"
        state: present
      when: ansible_facts['os_family'] == "Debian"

    - name: Download virtualswitch package (RHEL)
      ansible.builtin.get_url:
        url: "{{ lookup('env', 'CI_VIRTUALSWITCH_BASE_URL') | default('https://support.inverse.ca/~jgoimard/virtualswitch', true) }}/virtualswitch-{{ lookup('env', 'CI_VIRTUALSWITCH_RPM_VERSION') | default('2.5.2-1.el8', true) }}.x86_64.rpm"
        dest: "/tmp/virtualswitch.rpm"
        url_username: "{{ lookup('env', 'CI_VIRTUALSWITCH_USER') }}"
        url_password: "{{ lookup('env', 'CI_VIRTUALSWITCH_PASSWORD') }}"
        mode: '0644'
        force_basic_auth: yes
      when: ansible_facts['os_family'] == "RedHat"

    - name: Install virtualswitch package (RHEL)
      ansible.builtin.yum:
        name: "/tmp/virtualswitch.rpm"
        state: present
        disable_gpg_check: yes
      when: ansible_facts['os_family'] == "RedHat"

    - name: Create virtualswitch config directory
      ansible.builtin.file:
        path: /etc/virtualswitch
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Deploy virtualswitch configuration
      ansible.builtin.template:
        src: templates/virtualswitch_config.yaml.j2
        dest: /etc/virtualswitch/config.yaml
        owner: root
        group: root
        mode: '0644'

    - name: Enable and start virtualswitch service
      ansible.builtin.systemd:
        name: virtualswitch
        enabled: yes
        state: started
