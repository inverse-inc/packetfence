- hosts: pfservers, service_venom, nodes
  name: Get Venom logs on all VM
  become: True
  gather_facts: False
  # a VM that died mid-run must not stop us collecting from the others
  ignore_unreachable: True
  tags: logs

  vars:
    # result_dir = full path to 'results' directory at root of PF sources tree
    result_dir: '{{ lookup("env", "RESULT_DIR") }}'

  pre_tasks:
  - name: Gather min and network only
    ansible.builtin.setup:
      gather_subset:
        - "!all"
        - "network"

  tasks:
    # Stop writers before sanitization. A stop failure must prevent archiving.
    - name: Check for recovery resource sampler
      ansible.builtin.stat:
        path: /etc/systemd/system/pf-test-resource-sampler.service
      register: resource_sampler_unit

    - name: Stop and disable recovery resource sampler
      ansible.builtin.systemd:
        name: pf-test-resource-sampler.service
        state: stopped
        enabled: false
      when: resource_sampler_unit.stat.exists

    - name: Remove recovery resource sampler installation
      ansible.builtin.file:
        path: '{{ item }}'
        state: absent
      loop:
        - /etc/systemd/system/pf-test-resource-sampler.service
        - /usr/local/sbin/pf-test-resource-sampler.py
      when: resource_sampler_unit.stat.exists

    - name: Reload systemd after sampler removal
      ansible.builtin.systemd:
        daemon_reload: true
      when: resource_sampler_unit.stat.exists

    # Written inside the Venom results dir so sanitization and archiving pick
    # them up; also makes that dir exist when the run failed before Venom, so
    # an archive is produced (and uploaded) even then.
    - name: Collect system diagnostics
      ansible.builtin.script:
        cmd: 'files/collect-diagnostics.sh {{ venom_dir }}/results/diagnostics-{{ inventory_hostname }}'
      failed_when: false

    - name: Sanitize logs
      shell: '{{ venom_dir }}/utils/sanitize-venom-logs.sh'
      args:
        executable: '/bin/bash'
      no_log: True
      # to make Psono variables available
      environment: '{{ inventory__group_environment | d({}) }}'

    - name: Check if source file exists
      stat:
        path: '{{ venom_dir }}/results-{{ ansible_fqdn }}.tar.gz'
      register: venom_zip_file_stat

    # Store archive into result_dir/results/results-$(hostname).tar.gz
    - name: Get logs on runner
      fetch:
        src: '{{ venom_dir }}/results-{{ ansible_fqdn }}.tar.gz'
        dest: '{{ result_dir }}/'
        flat: True
      failed_when: false
      when: venom_zip_file_stat.stat.exists

    # sanitize-venom-logs.sh runs under no_log, so its own log is the only way
    # to see why an archive is missing
    - name: Get sanitization log on runner
      fetch:
        src: '{{ venom_dir }}/sanitize-venom-logs.log'
        dest: '{{ result_dir }}/sanitize-{{ inventory_hostname }}.log'
        flat: True
      failed_when: false
