---
- name: Install MailHog
  hosts: pfservers
  become: True
  gather_facts: False

  collections:
    - inverse_inc.utils

  pre_tasks:
  - name: Gather min and network only
    ansible.builtin.setup:
      gather_subset:
        - "!all"
        - "network"

  roles:
    - role: mailhog
      tags: mailhog
