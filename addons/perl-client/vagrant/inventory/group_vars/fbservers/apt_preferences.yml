---
apt_preferences__list:
  - filename: 'fingerbank-local.pref'
    package: 'fingerbank'
    # Templated from the target host: the PPA publishes one suite per
    # codename, so a literal stops matching when the base OS moves.
    pin: 'release a={{ ansible_distribution_release }}-gitlab,n={{ ansible_distribution_release }},c=main,b=amd64'
    priority: '900'
    reason: 'always install fingerbank package from fingerbank-local repository'
