# Inverse fork of FreeRADIUS, branch feature/PacketFence_3.2.10 (VERSION 3.2.11).
# Packaging comes from the fork's own debian/ (3.0 native, 4:3.2.11+git),
# which containers/radiusd pins.
UPSTREAM_VERSION=3.2.11+git
SOURCE_GIT=https://github.com/inverse-inc/freeradius-server.git
SOURCE_REF=fb385b9196213b2d2346fcd2b188d4639ef2aa78

# debian/control is generated from debian/control.in (what upstream's "make deb"
# does); debian/rules includes quilt.make, so quilt is needed before that
prepare_source() {
    DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends quilt
    make -f debian/rules debian/control
}
