########################################
# DEPLOY JOBS
########################################
deploy_branches_pulp:
  extends:
    - .deploy_branches_pulp_job
  rules:
    # Its packages pull this pipeline's images: none built, nothing kept.
    - if: '$BUILD_IMG_CONTAINER == "no" || $CI_COMMIT_MESSAGE =~ /build_img_container=no/'
      when: never
    - !reference [.deploy_branches_rules, rules]
  environment:
    name: pf-branches

# Service images are pushed only as <slug>-p<pipeline>. maintenance/X.Y: give them maintenance-X-Y on GitHub
# (manifests copied, nothing rebuilt, ci/lib/upload/promote-images.py), then push them to packages.packetfence.com
# under that tag as ci-docker (ci/pulp/container-push.sh). A feature branch with DEPLOY_PKG=yes keeps the pipeline
# tag its branches/X.Y/<pipeline>/ packages pull and pushes it there too; the packaging side prunes them with those
# packages. Same conditions as the package deploys; when tests run, the deploy stage keeps both behind them. A release
# tag keeps its images on GitHub.
deploy_containers:
  stage: deploy
  image: $PF_PPA_IMAGE
  # One Pulp container writer at a time, across branches.
  resource_group: pulp-packetfence-containers
  dependencies: []
  environment:
    name: containers/$CI_COMMIT_REF_SLUG
  script:
    - |
      pipeline_tag=$(sh ci/lib/common/pipeline-image-tag.sh)
      test -n "$pipeline_tag" || { echo 'This pipeline has no pipeline-tagged images' >&2; exit 1; }
      if [ -n "$PROMOTE_TAGS" ]; then
        python3 ci/lib/upload/promote-images.py --source "$pipeline_tag" --tags "$PROMOTE_TAGS" --apply
      fi
      bash ci/pulp/container-push.sh "$pipeline_tag" "${PROMOTE_TAGS:-$pipeline_tag}"
  tags:
    - docker
  rules:
    - if: '$BUILD_IMG_CONTAINER == "no" || $CI_COMMIT_MESSAGE =~ /build_img_container=no/'
      when: never
    - if: '$DEPLOY_PKG == "no" || $DEPLOY_PKG == "false"'
      when: never
    - if: '$CI_COMMIT_REF_NAME =~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_TAG == null && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule")'
      variables:
        PROMOTE_TAGS: $CI_COMMIT_REF_SLUG
    - if: '$CI_COMMIT_REF_NAME != "devel" && $CI_COMMIT_REF_NAME !~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_REF_NAME !~ /^cloud-nac\// && $CI_COMMIT_TAG == null && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule") && ($DEPLOY_PKG == "yes" || $DEPLOY_PKG == "true" || $CI_COMMIT_MESSAGE =~ /deploy_pkg=(yes|true)/)'
      variables:
        PROMOTE_TAGS: ''

deploy_maintenance_pulp:
  extends:
    - .deploy_pulp_job
  environment:
    name: maintenance
  rules:
    # No images built, no packages: a server would install them against the previous build's containers.
    - if: '$BUILD_IMG_CONTAINER == "no" || $CI_COMMIT_MESSAGE =~ /build_img_container=no/'
      when: never
    - !reference [.deploy_maintenance_rules, rules]

deploy_maintenance_pkg_friendly_names:
  extends:
    - .deploy_pkg_friendly_names
    - .deploy_maintenance_rules


# The built guides -> doc/X.Y.0 in the packaging Pulp (X.Y from conf/pf-release), after the tests: release tags
# and maintenance/X.Y pipelines that build the docs; see ci/pulp/publish-docs.sh.
.deploy_docs_pulp_job:
  stage: deploy
  image: $PF_PPA_IMAGE
  resource_group: pulp-packetfence-docs
  script:
    - bash ci/pulp/publish-docs.sh
  artifacts:
    access: developer
    when: always
    expire_in: 7 days
    paths: [pulp-docs.json]
  tags:
    - docker

deploy_docs_pulp_release:
  extends: .deploy_docs_pulp_job
  dependencies:
    - build_artifacts_doc_release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

deploy_docs_pulp_maintenance:
  extends: .deploy_docs_pulp_job
  dependencies:
    - build_artifacts_doc_devel_and_branches
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_TAG == null && $CI_PIPELINE_SOURCE == "web" && ( $BUILD_ARTIFACTS_DOC == "yes" || $CI_COMMIT_MESSAGE =~ /build_artifacts_doc=yes/ )'

########################################
# BUILD_PF_IMG JOBS
########################################
### build_pf_img_zen jobs
build_pf_img_zen_devel_branches_and_maintenance:
  extends:
    - .build_pf_img_zen_job
    - .build_pf_img_zen_devel_branches_and_maintenance_rules
  script:
    - timeout ${PIPELINE_TIMEOUT_SCRIPT} make -e -C ${ZENDIR} zen-deb12

build_pf_img_zen_release:
  extends:
    - .build_pf_img_zen_job
  script:
    - timeout ${PIPELINE_TIMEOUT_SCRIPT} make -e -C ${ZENDIR} zen-deb12
  # workaround for https://forum.gitlab.com/t/specify-when-at-job-level-with-a-job-that-has-rules/4769
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
      allow_failure: true

