---
################################################################################
# COMMON PARAMETERS
################################################################################
before_script:
  - unset http_proxy ; unset https_proxy
  - env | grep ^CI_

################################################################################
# STAGES
################################################################################
# build_images covers BOTH the pfbuild base images (consumed via `image:` by
# the build_artifacts stage) AND the service container images (built by Kaniko,
# pushed to GHCR). Intra-stage ordering is enforced by `needs:`, not by stage
# boundaries.
stages:
  - check
  - build_images
  - build_artifacts
  - sign
  - publish
  - test
  - deploy
  - build_pf_img

################################################################################
# VARIABLES
################################################################################
variables:
  # synced with Pipeline timeout in GitLab UI
  PIPELINE_TIMEOUT_SCRIPT: 160m
  PIPELINE_TIMEOUT_CLEANUP: 10m
  BUILD_PFAPPSERVER_VUE: "yes"
  PFBUILD_RHEL_IMG: ghcr.io/inverse-inc/packetfence/pfbuild-centos-8
  PFBUILD_DEB_IMG: ghcr.io/inverse-inc/packetfence/pfbuild-debian-bookworm
  KANIKO_DEBUG_IMG: ghcr.io/inverse-inc/packetfence/kaniko-executor:debug
  KANIKOBUILD_IMG: ghcr.io/inverse-inc/packetfence/kaniko-build
  KNK_REGISTRY: ghcr.io
  KNK_REGISTRY_URL: ${KNK_REGISTRY}/inverse-inc/packetfence
  PFBUILD_DEFAULT_DEV_TAG: latest
  CIDIR: ci
  CILIBDIR: ci/lib
  CHECKDIR: ${CILIBDIR}/check
  BUILDDIR: ${CILIBDIR}/build
  RELEASEDIR: ${CILIBDIR}/release
  TESTCIDIR: ${CILIBDIR}/test
  PACKERDIR: $CIDIR/packer
  ZENDIR: $CIDIR/packer/zen
  ISODIR: $CIDIR/debian-installer
  USB_ISODIR: $CIDIR/usb-bootable-iso
  VAGRANT_IMG_DIR: $CIDIR/packer/vagrant_img
  TESTDIR: t/venom
  CONTAINER_DIR: containers
  UPLOAD_DIR: $CILIBDIR/upload
  SF_ZEN_REPO_URL: https://sourceforge.net/projects/packetfence/files/PacketFence%20ZEN
  # env variables
  ANSIBLE_FORCE_COLOR: 1
  ANSIBLE_STDOUT_CALLBACK: yaml
  VAGRANT_FORCE_COLOR: "true"
  # Selective test execution
  # Run only tests matching this pattern (grep -E regex). Empty = all tests.
  # Examples: configurator, mac_auth, configurator|pfappserver, .*_el8
  TEST_ONLY: ""


################################################################################
# TEMPLATES
################################################################################

########################################
# RULES
########################################
# === CONTEXT DERIVATION ===
# Single source of truth for $CONTEXT, $IMAGE_TAG, and per-context image-build /
# deploy variable overrides. Rule order is load-bearing (most specific first):
#   1. $CI_COMMIT_TAG                → release     (IMAGE_TAG = tag)
#   2. cloud-nac/X.Y branch          → cloud-nac   (IMAGE_TAG = slug-pipelineid)
#   3. maintenance/X.Y branch        → maintenance (IMAGE_TAG = slug)
#   4. devel branch                  → devel       (IMAGE_TAG = latest)
#   5. (default — any other branch)  → branches    (IMAGE_TAG = slug)
#
# Composed into concrete jobs via `!reference [.context_rules, rules]`
# (GitLab ≥14.3) so they can mix context arms with per-job feature gates.
.context_rules:
  rules:
    - if: '$CI_COMMIT_TAG'
      variables:
        CONTEXT: release
        IMAGE_TAG: $CI_COMMIT_TAG
        # Release pfbuild-base builds switch to stable Ansible groups.
        ANSIBLE_CENTOS_GROUP: common_centos
        ANSIBLE_CENTOS8_GROUP: stable_centos8
        ANSIBLE_DEBIAN_GROUP: common_debian
        ANSIBLE_RUBYGEMS_GROUP: stable_rubygems
        DEPLOY_ENV_NAME: pf-stable
        DEB_DEPLOY_DIR: debian
    - if: '$CI_COMMIT_REF_NAME =~ /^cloud-nac\/[[:digit:]]+\.[[:digit:]]+$/'
      variables:
        CONTEXT: cloud-nac
        IMAGE_TAG: ${CI_COMMIT_REF_SLUG}-${CI_PIPELINE_ID}
        # Cloud-nac pipelines do NOT build packages and do NOT deploy.
        # Two-tag for pfbuild-base build_img_docker:. Two-tag for pfbuild-base build_img_docker:
        DOCKER_TAGS_EXTRA: ${CI_COMMIT_REF_SLUG},${CI_COMMIT_REF_SLUG}-${CI_PIPELINE_ID}
    - if: '$CI_COMMIT_REF_NAME =~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/'
      variables:
        CONTEXT: maintenance
        IMAGE_TAG: $CI_COMMIT_REF_SLUG
        DEPLOY_ENV_NAME: maintenance
        DEB_DEPLOY_DIR: debian
    - if: '$CI_COMMIT_REF_NAME == "devel"'
      variables:
        CONTEXT: devel
        IMAGE_TAG: latest
        # Emit both tags (slug + latest) for devel-context container pushes.
        IMAGE_TAGS_DEVEL: "${CI_COMMIT_REF_SLUG},latest"
        DOCKER_TAGS_DEVEL: "latest,devel,maintenance-99-9"
        DEPLOY_ENV_NAME: pf-devel
        DEB_DEPLOY_DIR: debian
        PF_CI_LIB_DEB_DEST_NAME: packetfence-ci-lib_devel.deb
    - when: always
      variables:
        CONTEXT: branches
        IMAGE_TAG: $CI_COMMIT_REF_SLUG
        DEPLOY_ENV_NAME: pf-branches
        DEB_DEPLOY_DIR: debian-branches
        RPM_DEPLOY_DIR: branches/x86_64
        PKG_DEST_NAME: packetfence-release-branches.el8.noarch.rpm
        PF_EXPORT_RPM_DEST_NAME: packetfence-export-branches.el8.noarch.rpm
        PF_EXPORT_DEB_DEST_NAME: packetfence-export_branches.deb
        PF_CI_LIB_DEB_DEST_NAME: packetfence-ci-lib_branches.deb

# === RELEASE-ONLY RULES (used by _pristine test jobs) ===
# run only jobs on release tag (vX.Y.Z) (push and web)
.release_only_rules:
  rules:
    - if: '$CI_COMMIT_TAG'

# === FEATURE-GATE RULE FRAGMENTS ===
# Each gate is a single rules list capturing a BUILD_*=no (or =yes positive)
# short-circuit. Concrete jobs compose them via `!reference [.gated_by_X, rules]`
# together with `!reference [.context_rules, rules]`.

.gated_by_build_artifacts_pkg:
  # Replaces clause shared by .maintenance_only_rules,
  # .build_artifacts_pkg_devel_rules, .build_artifacts_pkg_branches_rules,
  # .devel_release_branches_and_maintenance_rules (lines 128-166 of
  # pre-consolidation .gitlab-ci.yml).
  rules:
    - if: '$BUILD_ARTIFACTS_PKG == "no"'
      when: never

.gated_by_build_img_container:
  # Replaces clause shared by .build_img_container_{devel,branches_and_maintenance,cloud_nac}_rules
  # (lines 169-194 of pre-consolidation .gitlab-ci.yml).
  rules:
    - if: '$BUILD_IMG_CONTAINER == "no"'
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /build_img_container=no/'
      when: never

.gated_by_build_img_docker:
  # Replaces NEGATIVE-gate clauses shared by
  # .build_img_docker_{branches_and_maintenance,cloud_nac}_rules
  # (lines 202-214). The devel POSITIVE trigger lives in the concrete
  # job's inline rules.
  rules:
    - if: '$BUILD_IMG_DOCKER == "no"'
      when: never

.gated_by_build_img_vagrant:
  # Replaces POSITIVE trigger in .build_img_vagrant_devel_and_branches_rules
  # (lines 220-223 of pre-consolidation .gitlab-ci.yml).
  rules:
    - if: '$BUILD_IMG_VAGRANT != "yes" && $CI_COMMIT_MESSAGE !~ /build_img_vagrant=yes/'
      when: never

.gated_by_publish_ppa:
  # Replaces .publish_ppa_rules (lines 225-231) VERBATIM (A3-RESOLVED:
  # preserve all 5 disjuncts).
  rules:
    - if: '$PUBLISH_PPA == "yes" || $CI_COMMIT_MESSAGE =~ /publish_ppa=yes/'
    - if: '$CI_COMMIT_TAG'
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ( $TEST == "yes" || $CI_COMMIT_MESSAGE =~ /test=yes/ )'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && ( $TEST == "yes" || $CI_COMMIT_MESSAGE =~ /test=yes/ )'
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($BUILD_PF_IMG_USB_ISO == "yes" || $CI_COMMIT_MESSAGE =~ /build_pf_img_usb_iso=yes/)'

.gated_by_test_yes:
  rules:
    - if: '$TEST != "yes" && $CI_COMMIT_MESSAGE !~ /test=yes/'
      when: never

.gated_by_build_pf_img_zen:
  # Replaces POSITIVE trigger in
  # .build_pf_img_zen_devel_branches_and_maintenance_rules (lines 270-274).
  rules:
    - if: '$BUILD_PF_IMG_ZEN != "yes" && $CI_COMMIT_MESSAGE !~ /build_pf_img_zen=yes/'
      when: never

.gated_by_build_pf_img_iso:
  # Replaces POSITIVE trigger in
  # .build_pf_img_iso_devel_branches_and_maintenance_rules (lines 279-283).
  rules:
    - if: '$BUILD_PF_IMG_ISO != "yes" && $CI_COMMIT_MESSAGE !~ /build_pf_img_iso=yes/'
      when: never

.gated_by_build_pf_img_usb_iso:
  # Replaces .build_pf_img_usb_iso_any_branch_rules (lines 286-288).
  rules:
    - if: '$BUILD_PF_IMG_USB_ISO != "yes" && $CI_COMMIT_MESSAGE !~ /build_pf_img_usb_iso=yes/'
      when: never

.gated_by_build_artifacts_website:
  # Replaces POSITIVE trigger in
  # .build_artifacts_website_devel_and_branches_rules (lines 293-296).
  rules:
    - if: '$BUILD_ARTIFACTS_WEBSITE != "yes" && $CI_COMMIT_MESSAGE !~ /build_artifacts_website=yes/'
      when: never

.gated_by_build_artifacts_material:
  # Replaces POSITIVE trigger in
  # .build_artifacts_material_devel_and_branches_rules (lines 301-304).
  rules:
    - if: '$BUILD_ARTIFACTS_MATERIAL != "yes" && $CI_COMMIT_MESSAGE !~ /build_artifacts_material=yes/'
      when: never

.gated_by_build_artifacts_doc:
  # Replaces POSITIVE trigger in
  # .build_artifacts_doc_devel_and_branches_rules (lines 310-314).
  rules:
    - if: '$BUILD_ARTIFACTS_DOC != "yes" && $CI_COMMIT_MESSAGE !~ /build_artifacts_doc=yes/'
      when: never

.gated_by_deploy_pkg:
  # Replaces clause shared by .deploy_{devel,branches,maintenance}_rules
  # (lines 318-342 of pre-consolidation .gitlab-ci.yml).
  rules:
    - if: '$DEPLOY_PKG == "no"'
      when: never

# === SHARED CONTAINER-BUILD RULES ===
# 5 of the 6 container-build concrete jobs (kaniko, pfdeb, img, rad_based,
# rad_extend) share the same per-context filter + IMAGE_TAGS override
# pattern. pfdeb_based_* use parallel-matrix anchors and have simpler rules.
.build_img_container_rules:
  # Composed by `!reference [.build_img_container_rules, rules]` into each
  # consumer's `rules:` block, after `!reference [.gated_by_build_img_container, rules]`.
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /^cloud-nac\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_TAG == null && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
      variables:
        IMAGE_TAGS: ${CI_COMMIT_REF_SLUG}-${CI_PIPELINE_ID}
    - if: '$CI_COMMIT_REF_NAME =~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_TAG == null && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
      variables:
        IMAGE_TAGS: ${CI_COMMIT_REF_SLUG}
    - if: '$CI_COMMIT_REF_NAME != "devel" && $CI_COMMIT_REF_NAME !~ /^cloud-nac\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_REF_NAME !~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_TAG == null && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
      variables:
        IMAGE_TAGS: ${CI_COMMIT_REF_SLUG}
    - if: '$CI_COMMIT_TAG'
      variables:
        IMAGE_TAGS: ${CI_COMMIT_TAG}
    - if: '$CI_COMMIT_REF_NAME == "devel"'

# Same as .build_img_container_rules but with no `release` arm — used by
# pfdeb_based_full (release uses a SEPARATE concrete job pfdeb_based_release_trim
# because the parallel-matrix list differs).
.build_img_container_rules_no_release:
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_TAG == null && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
      variables:
        IMAGE_TAGS: ${CI_COMMIT_REF_SLUG}
    - if: '$CI_COMMIT_REF_NAME != "devel" && $CI_COMMIT_REF_NAME !~ /^cloud-nac\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_REF_NAME !~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_TAG == null && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
      variables:
        IMAGE_TAGS: ${CI_COMMIT_REF_SLUG}
    - if: '$CI_COMMIT_REF_NAME == "devel"'

# Same as .build_img_container_rules but without IMAGE_TAGS overrides
# (concrete jobs that override DOCKER_TAGS instead — build_img_docker_*).
.build_img_docker_rules:
  rules:
    - if: '$CI_COMMIT_TAG'
      variables:
        DOCKER_TAGS: ${CI_COMMIT_TAG}
        ANSIBLE_CENTOS_GROUP: common_centos
        ANSIBLE_CENTOS8_GROUP: stable_centos8
        ANSIBLE_DEBIAN_GROUP: common_debian
        ANSIBLE_RUBYGEMS_GROUP: stable_rubygems
    - if: '$CI_COMMIT_REF_NAME =~ /^cloud-nac\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_TAG == null && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
      variables:
        DOCKER_TAGS: ${CI_COMMIT_REF_SLUG},${CI_COMMIT_REF_SLUG}-${CI_PIPELINE_ID}
    - if: '$CI_COMMIT_REF_NAME =~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_TAG == null && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
      variables:
        DOCKER_TAGS: ${CI_COMMIT_REF_SLUG}
    - if: '$CI_COMMIT_REF_NAME != "devel" && $CI_COMMIT_REF_NAME !~ /^cloud-nac\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_REF_NAME !~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_TAG == null && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
      variables:
        DOCKER_TAGS: ${CI_COMMIT_REF_SLUG}

# Shared rules for devel-or-branches-or-release jobs (no maintenance):
# build_artifacts_website, build_artifacts_material, deploy_website_artifacts.
.devel_or_branches_or_release_rules:
  rules:
    - if: '$CI_COMMIT_REF_NAME == "devel"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_REF_NAME != "devel" && $CI_COMMIT_REF_NAME !~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_TAG == null && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'

# Shared rules for deploy_* (rpm, deb, pkg_friendly_names) — runs on
# devel push/web/schedule, release tag, branches via web/api/schedule,
# maintenance via web/api/schedule. Used together with .gated_by_deploy_pkg.
.deploy_pkg_rules:
  rules:
    - if: '$CI_COMMIT_REF_NAME == "devel"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_REF_NAME =~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_TAG == null && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "schedule")'
    - if: '$CI_COMMIT_REF_NAME != "devel" && $CI_COMMIT_REF_NAME !~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_TAG == null && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "schedule")'

# === TEST-STAGE RULES ===
# .test_rules merges the former .test_devel_and_maintenance_rules and
# .test_branches_only_rules into a single template. For feature-branch runs
# (not devel, not maintenance, no tag) it emits VAGRANT_COMMON_DOTFILE_PATH
# as a rule variable so the job uses the devel-compatible Vagrant common state.
# NOTE: TEST_ONLY filtering is done in .test_script_job via shell script
# because GitLab CI doesn't expand variables inside regex patterns.
.test_rules:
  rules:
    # Run on devel branch (push, web, not schedule)
    - if: '$CI_COMMIT_REF_NAME == "devel" && $CI_PIPELINE_SOURCE != "schedule" && ( $TEST == "yes" || $CI_COMMIT_MESSAGE =~ /test=yes/ )'
    # Run on maintenance branches (web/api only)
    - if: '$CI_COMMIT_REF_NAME =~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_TAG == null && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ( $TEST == "yes" || $CI_COMMIT_MESSAGE =~ /test=yes/ )'
    # Run on devel/maintenance with schedule
    - if: '( $CI_COMMIT_REF_NAME == "devel" || $CI_COMMIT_REF_NAME =~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/) && $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_TAG == null && ( $TEST == "yes" || $CI_COMMIT_MESSAGE =~ /test=yes/ )'
    # Run on feature branches (web/api) — emit VAGRANT_COMMON_DOTFILE_PATH override
    - if: '$CI_COMMIT_REF_NAME != "devel" && $CI_COMMIT_REF_NAME !~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_TAG == null && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ( $TEST == "yes" || $CI_COMMIT_MESSAGE =~ /test=yes/ )'
      variables:
        VAGRANT_COMMON_DOTFILE_PATH: /var/local/gitlab-runner/vagrant/vagrant-common-devel
    # Run on feature branches via schedule — emit VAGRANT_COMMON_DOTFILE_PATH override
    - if: '$CI_COMMIT_REF_NAME != "devel" && $CI_COMMIT_REF_NAME !~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_TAG == null && $CI_PIPELINE_SOURCE == "schedule" && ( $TEST == "yes" || $CI_COMMIT_MESSAGE =~ /test=yes/ )'
      variables:
        VAGRANT_COMMON_DOTFILE_PATH: /var/local/gitlab-runner/vagrant/vagrant-common-devel

########################################
# JOBS TEMPLATES
########################################
.check_job:
  stage: check
  dependencies: []
  script:
    - ${CHECKDIR}/run-pipeline-if-necessary.sh
  tags:
    - docker

.build_img_docker_job:
  # Unchanged. Per-context DOCKER_TAGS / ANSIBLE_* overrides are emitted by
  # .context_rules and consumed by the concrete jobs via $-interpolation.
  stage: build_images
  script:
    - timeout ${PIPELINE_TIMEOUT_SCRIPT} make -e -C ${PACKERDIR} build_img_docker_pfbuild
  tags:
    - shell

.build_img_container_job:
  # Replaces: .build_img_container_job_dev (lines 362-369),
  #           .build_img_container_job_br_maint (lines 371-378),
  #           .build_img_container_job_cloud_nac (lines 380-387),
  #           .build_img_container_job_rel (lines 389-396)
  # of pre-consolidation .gitlab-ci.yml. $IMAGE_TAG comes from .context_rules.
  stage: build_images
  dependencies: []
  image: ${KANIKOBUILD_IMG}:${IMAGE_TAG}
  script:
    - /bin/kanikobuild
  tags:
    - docker

.build_img_container_kanikobuild_job:
  stage: build_images
  dependencies: []
  image:
    name: ${KANIKO_DEBUG_IMG}
    entrypoint: [""]
  script:
    - ${CONTAINER_DIR}/kanikobuild
  tags:
    - docker

.build_img_vagrant_devel_and_branches_job:
  stage: build_images
  variables:
    RESULT_DIR: /var/local/gitlab-runner/vagrant_img
    BOX_DESC: ${CI_PIPELINE_URL}
  script:
    - timeout ${PIPELINE_TIMEOUT_SCRIPT} make -e -C ${VAGRANT_IMG_DIR} ${BOX_NAME}
  # implicit timeout = 5 minutes, see https://gitlab.com/gitlab-org/gitlab-runner/-/issues/2716
  after_script:
    - make -e -C ${VAGRANT_IMG_DIR} clean
  tags:
    - shell
    - inverse.ca

.build_artifacts_pkg_job:
  stage: build_artifacts
  artifacts:
    expire_in: 1 day
    paths:
      - result/*
  tags:
    - docker

.build_artifacts_website_job:
  stage: build_artifacts
  dependencies: []
  script:
    - make -e website
  artifacts:
    expire_in: 1 day
    paths:
      - website/*
  tags:
    - docker

.build_artifacts_material_job:
  stage: build_artifacts
  dependencies: []
  variables:
    # Git credentials (GIT_USER_NAME, GIT_USER_PASSWORD, GIT_USER_MAIL) set in generate-material.sh from Psono
    GIT_REPO: github.com/akainverse/website-pfcom
    SRC_FILE: result/switches.json
    DST_FILE: data/switches.json
    # Git credentials fetched from Psono (secret IDs hardcoded in script)
    # PSONO_WEBSITE_PFCOM_API_KEY_ID: provided through CI/CD variables
    # PSONO_WEBSITE_PFCOM_API_SECRET_KEY: provided through CI/CD variables
  script:
    - ${BUILDDIR}/generate-material.sh
  artifacts:
    expire_in: 1 day
    paths:
      - result/switches.json
  tags:
    - shell

.build_artifacts_doc_job:
  stage: build_artifacts
  dependencies: []
  script:
    - make -C html/pfappserver/root/ vendor
    - make -C html/pfappserver/root/ light-dist
    - make html
    - make pdf
  artifacts:
    expire_in: 1 day
    paths:
      - docs/*.html
      - docs/*.pdf
      - docs/images/*
      - docs/styles/*.min.css
  tags:
    - docker

.publish_job:
  stage: publish
  environment:
    name: PPA
    url: http://inverse.ca/downloads/PacketFence/gitlab/${CI_PIPELINE_ID}
  script:
    - ci-pages-ppa
    - ci-pages-home
    - ci-pages-tree
    - ./${UPLOAD_DIR}/deploy-artifacts.sh ppa
  variables:
    DEPLOY_USER: reposync
    DEPLOY_HOST: web.inverse.ca
    DEPLOY_PORT: 444
    PPA_ID: ${CI_PIPELINE_ID}
  tags:
    - shell

.test_job:
  stage: test
  dependencies: []
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - results/*
  tags:
    - test-shell-v7

.deploy_deb_job:
  # Replaces: .deploy_deb_job (lines 511-522) AND
  #           .deploy_maintenance_deb_job (lines 524-535, byte-identical, S6).
  stage: deploy
  dependencies:
    - sign_packages
  variables:
    DEPLOY_USER: reposync
    DEPLOY_HOST: web.inverse.ca
    DEPLOY_PORT: 444
  script:
    - ./${UPLOAD_DIR}/deploy-artifacts.sh deb
  tags:
    - shell

.deploy_rpm_job:
  # Replaces: .deploy_rpm_job (lines 537-549) AND
  #           .deploy_rpm_maintenance_job (lines 551-563, byte-identical, S6).
  stage: deploy
  dependencies:
    - sign_packages
  variables:
    DEPLOY_USER: reposync
    DEPLOY_HOST: web.inverse.ca
    DEPLOY_SRPMS: "no"
    DEPLOY_PORT: 444
  script:
    - ./${UPLOAD_DIR}/deploy-artifacts.sh rpm
  tags:
    - shell

.deploy_pkg_friendly_names:
  stage: deploy
  dependencies:
    - sign_packages
  variables:
