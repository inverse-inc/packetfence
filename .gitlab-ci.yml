########################################
# DEPLOY JOBS
########################################
### RPM jobs
deploy_rpm:
  extends:
    - .deploy_rpm_job
  environment:
    name: $DEPLOY_ENV_NAME
  rules:
    - !reference [.gated_by_deploy_pkg, rules]
    - !reference [.deploy_pkg_rules, rules]

### Debian jobs
deploy_deb:
  extends:
    - .deploy_deb_job
  environment:
    name: $DEPLOY_ENV_NAME
  rules:
    - !reference [.gated_by_deploy_pkg, rules]
    - !reference [.deploy_pkg_rules, rules]

### Common jobs (Deb and RPM) — friendly names
deploy_pkg_friendly_names:
  # Maintenance arm is filtered out by inline rule below; it has its own job.
  extends:
    - .deploy_pkg_friendly_names
  environment:
    name: $DEPLOY_ENV_NAME
  rules:
    - !reference [.gated_by_deploy_pkg, rules]
    - if: '$CI_COMMIT_REF_NAME =~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/'
      when: never
    - !reference [.deploy_pkg_rules, rules]

deploy_maintenance_pkg_friendly_names:
  # Kept SEPARATE: maintenance friendly-names job has NO `environment:` block
  # (latent bug preserved bit-identically). Folding into deploy_pkg_friendly_names
  # would require either fixing the bug or a conditional environment:.
  extends:
    - .deploy_pkg_friendly_names
  rules:
    - !reference [.gated_by_deploy_pkg, rules]
    - if: '$CI_COMMIT_REF_NAME =~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_TAG == null && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "schedule")'

# website artifacts
deploy_website_artifacts:
  extends:
    - .deploy_website_artifacts_job
  rules:
    - !reference [.gated_by_build_artifacts_website, rules]
    - !reference [.devel_or_branches_or_release_rules, rules]

########################################
# BUILD_PF_IMG JOBS
########################################
### build_pf_img_zen jobs
build_pf_img_zen:
  extends:
    - .build_pf_img_zen_job
  script:
    - timeout ${PIPELINE_TIMEOUT_SCRIPT} make -e -C ${ZENDIR} zen-deb12
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_REF_NAME == "devel" && ( $BUILD_PF_IMG_ZEN == "yes" || $CI_COMMIT_MESSAGE =~ /build_pf_img_zen=yes/ )'
    - if: '$CI_COMMIT_REF_NAME =~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_TAG == null && ( $BUILD_PF_IMG_ZEN == "yes" || $CI_COMMIT_MESSAGE =~ /build_pf_img_zen=yes/ ) && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
    - if: '$CI_COMMIT_REF_NAME != "devel" && $CI_COMMIT_REF_NAME !~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_TAG == null && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ( $BUILD_PF_IMG_ZEN == "yes" || $CI_COMMIT_MESSAGE =~ /build_pf_img_zen=yes/ )'

### build_pf_img_iso jobs
build_pf_img_iso:
  extends:
    - .build_pf_img_iso_job
  environment:
    url: ${RCLONE_LINODE_URL}/packetfence-iso/${ENV_URL_REF}
  script:
    - timeout ${PIPELINE_TIMEOUT_SCRIPT} make -e -C ${ISODIR} iso
  rules:
    - if: '$CI_COMMIT_TAG'
      variables:
        PF_VERSION: ${CI_COMMIT_TAG}
        ENV_URL_REF: ${CI_COMMIT_TAG}
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_REF_NAME == "devel" && ( $BUILD_PF_IMG_ISO == "yes" || $CI_COMMIT_MESSAGE =~ /build_pf_img_iso=yes/ )'
      variables:
        ENV_URL_REF: ${CI_COMMIT_REF_SLUG}
    - if: '$CI_COMMIT_REF_NAME =~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_TAG == null && ( $BUILD_PF_IMG_ISO == "yes" || $CI_COMMIT_MESSAGE =~ /build_pf_img_iso=yes/ ) && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
      variables:
        ENV_URL_REF: ${CI_COMMIT_REF_SLUG}
    - if: '$CI_COMMIT_REF_NAME != "devel" && $CI_COMMIT_REF_NAME !~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_TAG == null && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ( $BUILD_PF_IMG_ISO == "yes" || $CI_COMMIT_MESSAGE =~ /build_pf_img_iso=yes/ )'
      variables:
        ENV_URL_REF: ${CI_COMMIT_REF_SLUG}

### build_pf_img_usb_iso jobs
build_pf_img_usb_iso:
  extends:
    - .build_pf_img_usb_iso_job
  needs:
    - job: publish_ppa
  variables:
    PF_VERSION: ${CI_COMMIT_REF_SLUG}
    PF_REPO_TYPE: gitlab/${CI_PIPELINE_ID}
  environment:
    url: ${RCLONE_LINODE_URL}/packetfence-iso/${CI_COMMIT_REF_SLUG}-usb
  script:
    - timeout ${PIPELINE_TIMEOUT_SCRIPT} make -e -C ${USB_ISODIR} upload
  rules:
    - !reference [.gated_by_build_pf_img_usb_iso, rules]
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($BUILD_PF_IMG_USB_ISO == "yes" || $CI_COMMIT_MESSAGE =~ /build_pf_img_usb_iso=yes/)'

### build_pf_img_vagrant jobs
build_pf_img_vagrant_release_debian_bookworm:
  extends:
    - .build_pf_img_vagrant_release_job
  variables:
    BOX_NAME: pfdeb12stable
  # workaround for https://forum.gitlab.com/t/specify-when-at-job-level-with-a-job-that-has-rules/4769
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
      allow_failure: true
