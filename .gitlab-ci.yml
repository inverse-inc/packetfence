  extends:
    - .build_pf_img_vagrant_release_job
  variables:
    BOX_NAME: pfdeb12stable
  needs:
    - job: deploy_packages
      parallel:
        matrix:
          - DEPLOY_TYPE: deb
      artifacts: false
    - job: ci_related
      parallel:
        matrix:
          - IMAGE_NAME: "vagrant-build"
      artifacts: false
      optional: true
  # workaround for https://forum.gitlab.com/t/specify-when-at-job-level-with-a-job-that-has-rules/4769
