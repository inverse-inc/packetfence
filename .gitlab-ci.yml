# Release tags: stop before any build unless the packaging side prepared Pulp for this version.
check_pulp_release:
  extends:
    - .check_job
  image: python:3-alpine
  script:
    - apk add --no-cache bash >/dev/null
    - pip install --quiet requests pynacl
    - bash ci/pulp/check-release.sh
  rules:
    - if: '$CI_COMMIT_TAG'

run_pipeline_if_necessary:
  image: ${PFBUILD_DEB_IMG}:${PFBUILD_DEFAULT_DEV_TAG}
  extends:
