########################################
# DEPLOY JOBS
########################################
deploy_packages:
  extends:
    - .deploy_packages_job
  environment:
    name: $DEPLOY_ENV_NAME
  parallel:
    matrix:
      - DEPLOY_TYPE:
          - rpm
          - deb
          - packetfence-release
          - packetfence-export
          - packetfence-upgrade
          - packetfence-ci-lib
  rules:
    - !reference [.gated_by_deploy_pkg, rules]
    - !reference [.deploy_pkg_rules, rules]

# website artifacts
deploy_website_artifacts:
  extends:
    - .deploy_website_artifacts_job
  rules:
    - if: '$CI_COMMIT_TAG'
      variables:
        IMAGE_TAG: $CI_COMMIT_TAG
    - !reference [.gated_by_build_artifacts_website, rules]
    - !reference [.devel_or_branches_or_release_rules, rules]

########################################
# BUILD_PF_IMG JOBS
########################################
build_pf_img_zen:
  extends:
    - .build_pf_img_job
  environment:
    name: linode
    url: ${RCLONE_LINODE_URL}/packetfence-zen/${CI_COMMIT_REF_SLUG}
  variables:
    BUILD_DIR: ci/zen
    BUILD_TARGET: zen-deb12
    CLEAN_TARGET: clean_all
    # zen_builder pushes the slug tag in every context; tag pipelines
    # override IMAGE_TAG below (release tags are pushed unslugified).
    ZEN_BUILDER_IMAGE: ${KNK_REGISTRY_URL}/zen-builder:${IMAGE_TAG}
  tags:
    - shell-v7
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
      allow_failure: true
      variables:
        IMAGE_TAG: $CI_COMMIT_TAG
    - if: '$CI_COMMIT_REF_NAME == "devel" && ($BUILD_PF_IMG_ZEN == "yes" || $CI_COMMIT_MESSAGE =~ /build_pf_img_zen=yes/)'
    - if: '$CI_COMMIT_REF_NAME =~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_TAG == null && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($BUILD_PF_IMG_ZEN == "yes" || $CI_COMMIT_MESSAGE =~ /build_pf_img_zen=yes/)'
    - if: '$CI_COMMIT_REF_NAME != "devel" && $CI_COMMIT_REF_NAME !~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_TAG == null && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($BUILD_PF_IMG_ZEN == "yes" || $CI_COMMIT_MESSAGE =~ /build_pf_img_zen=yes/)'

build_pf_img_cd_iso:
  extends:
    - .build_pf_img_job
  environment:
    name: linode
    url: ${RCLONE_LINODE_URL}/packetfence-iso/${CI_COMMIT_REF_SLUG}
  variables:
    BUILD_DIR: ci/cd-iso
    BUILD_TARGET: cd-iso
    CLEAN_TARGET: clean
  rules:
    - if: '$CI_COMMIT_TAG'
      variables:
        PF_VERSION: ${CI_COMMIT_TAG}
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_REF_NAME == "devel" && ($BUILD_PF_IMG_CD_ISO == "yes" || $CI_COMMIT_MESSAGE =~ /build_pf_img_cd_iso=yes/)'
    - if: '$CI_COMMIT_REF_NAME =~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_TAG == null && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($BUILD_PF_IMG_CD_ISO == "yes" || $CI_COMMIT_MESSAGE =~ /build_pf_img_cd_iso=yes/)'
    - if: '$CI_COMMIT_REF_NAME != "devel" && $CI_COMMIT_REF_NAME !~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_TAG == null && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($BUILD_PF_IMG_CD_ISO == "yes" || $CI_COMMIT_MESSAGE =~ /build_pf_img_cd_iso=yes/)'

build_pf_img_dvd_usb_iso:
  extends:
    - .build_pf_img_job
  needs:
    - job: publish_ppa
      optional: true
  environment:
    name: linode
    url: ${RCLONE_LINODE_URL}/packetfence-iso/${CI_COMMIT_REF_SLUG}
  variables:
    PF_VERSION: ${CI_COMMIT_REF_NAME}
    PF_REPO_TYPE: gitlab/${CI_PIPELINE_ID}
    BUILD_DIR: ci/dvd-usb-iso
    BUILD_TARGET: upload
    CLEAN_TARGET: clean
  rules:
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($BUILD_PF_IMG_DVD_USB_ISO == "yes" || $CI_COMMIT_MESSAGE =~ /build_pf_img_dvd_usb_iso=yes/)'

### build_pf_img_vagrant jobs
# Devel box: packages already deployed to the public inverse.ca repo.
build_pf_img_vagrant_devel_debian_bookworm:
  extends:
    - .build_pf_img_vagrant_job
  variables:
    BOX_NAME: pfdeb12dev
  needs:
    - job: deploy_packages
      parallel:
        matrix:
          - DEPLOY_TYPE: deb
      artifacts: false
    - job: ci_related
      parallel:
        matrix:
          - IMAGE_NAME: "vagrant-build"
      artifacts: false
      optional: true
  rules:
    - !reference [.gated_by_build_pf_img_vagrant, rules]
    - if: '$CI_COMMIT_REF_NAME == "devel"'

# Maintenance branches: stable box namespace, shared with tag releases.
build_pf_img_vagrant_maintenance_debian_bookworm:
  extends:
    - .build_pf_img_vagrant_job
  variables:
    BOX_NAME: pfdeb12stable
  needs:
    - job: deploy_packages
      parallel:
        matrix:
          - DEPLOY_TYPE: deb
      artifacts: false
    - job: ci_related
      parallel:
        matrix:
          - IMAGE_NAME: "vagrant-build"
      artifacts: false
      optional: true
  rules:
    - !reference [.gated_by_build_pf_img_vagrant, rules]
    - if: '$CI_COMMIT_REF_NAME =~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_TAG == null && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'

# Feature branches: packages come from the pipeline PPA (publish_ppa); all
# feature branches share the same Linode prefix, the pipeline ID (BOX_VERSION)
# distinguishes builds and lets a user pin a specific pipeline's box.
build_pf_img_vagrant_branch_debian_bookworm:
  extends:
    - .build_pf_img_vagrant_job
  script:
    - export PF_MINOR_RELEASE="$(perl -ne 'print $1 if (m/.*?(\d+\.\d+)/)' conf/pf-release)"
    - export BOX_VERSION="${PF_MINOR_RELEASE}-ci-${CI_PIPELINE_ID}"
    - export BOX_NAME="pfdeb12branch"
    - export BOX_DESC="PacketFence ${PF_MINOR_RELEASE} - ${CI_COMMIT_REF_SLUG} - ${BOX_VERSION}"
    - export CI_PAGES_URL="http://inverse.ca/downloads/PacketFence/gitlab/${CI_PIPELINE_ID}"
    - timeout ${PIPELINE_TIMEOUT_SCRIPT} make -e -C ${VAGRANT_IMG_DIR}
        BOX_NAME="${BOX_NAME}" BOX_VERSION="${BOX_VERSION}"
        pfdebian12dev_generic
  needs:
    - job: publish_ppa
      artifacts: false
    - job: ci_related
      parallel:
        matrix:
          - IMAGE_NAME: "vagrant-build"
      artifacts: false
      optional: true
  rules:
    - !reference [.gated_by_build_pf_img_vagrant, rules]
    - if: '$CI_COMMIT_REF_NAME != "devel" && $CI_COMMIT_REF_NAME !~ /^maintenance\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_TAG == null && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'

