  # inlined.
  image: ${PFBUILD_DEB_IMG}:${PFBUILD_DEFAULT_DEV_TAG}
  extends:
    - .check_job
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_TAG == null'

# Catches YAML regressions before any other stage runs. allow_failure: false
# because lint errors here break every downstream job — fail fast is the point.
# TODO: upgrade to `glab ci lint --strict` once the auth path is decided.
lint_ci_yaml:
  stage: check
  image: cytopia/yamllint:latest
  dependencies: []
  rules:
    - when: always
  script:
    - >
      yamllint
      -d '{extends: relaxed, rules: {line-length: disable, truthy: disable}}'
      .gitlab-ci.yml
  allow_failure: false
  tags:
    - docker

########################################
# BUILD_IMG_CONTAINER JOBS (Kaniko / pfdebian / service images / fingerbank / radius)
########################################
# All concrete jobs derive $IMAGE_TAG from .context_rules and compose
# !reference [.context_rules, rules] with a feature-gate fragment.

kaniko:
  # Replaces: kaniko_dev (L809), kaniko_br_maint (L911), kaniko_cloud_nac (L1013),
  # kaniko_rel (L1112) of pre-consolidation .gitlab-ci.yml.
  extends:
    - .build_img_container_kanikobuild_job
  variables:
    IMAGE_NAME: "kaniko-build"
    # On devel two-tag (slug + latest); elsewhere overridden by .build_img_container_rules arm.
    IMAGE_TAGS: ${IMAGE_TAGS_DEVEL}
  rules:
    - !reference [.gated_by_build_img_container, rules]
    - !reference [.build_img_container_rules, rules]

pfdeb:
  # Replaces: pfdeb_dev (L817), pfdeb_br_maint (L919), pfdeb_cloud_nac (L1021),
  # pfdeb_rel (L1120).
  extends:
    - .build_img_container_job
  needs: ["kaniko"]
  variables:
    IMAGE_NAME: "pfdebian"
    IMAGE_TAGS: ${IMAGE_TAGS_DEVEL}
  rules:
    - !reference [.gated_by_build_img_container, rules]
    - !reference [.build_img_container_rules, rules]

# pfdeb_based: parallel-matrix lists cannot be selected by $CONTEXT at lint
# time (matrix is resolved before rules). Keep 3 concrete jobs, each
# referencing a distinct YAML anchor for its service list.

pfdeb_based_full:
  # Replaces pfdeb_based_dev + pfdeb_based_br_maint (uses full service list).
  extends:
    - .build_img_container_job
  needs: ["pfdeb"]
  variables:
    IMAGE_TAGS: ${IMAGE_TAGS_DEVEL}
  parallel:
    matrix:
      - IMAGE_NAME: *service_images_full
  rules:
    - !reference [.gated_by_build_img_container, rules]
    - !reference [.build_img_container_rules_no_release, rules]

pfdeb_based_cloud_nac_trim:
  # Replaces pfdeb_based_cloud_nac (uses cloud-nac trimmed service list).
  extends:
    - .build_img_container_job
  needs: ["pfdeb"]
  variables:
    IMAGE_TAGS: ${CI_COMMIT_REF_SLUG}-${CI_PIPELINE_ID}
    IMAGE_TAG: ${CI_COMMIT_REF_SLUG}-${CI_PIPELINE_ID}
  parallel:
    matrix:
      - IMAGE_NAME: *service_images_cloud_nac_trim
  rules:
    - !reference [.gated_by_build_img_container, rules]
    - if: '$CI_COMMIT_REF_NAME =~ /^cloud-nac\/[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_TAG == null && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'

pfdeb_based_release_trim:
  # Replaces pfdeb_based_rel (uses release trimmed service list).
  extends:
    - .build_img_container_job
  needs: ["pfdeb"]
  variables:
    IMAGE_TAGS: ${CI_COMMIT_TAG}
    IMAGE_TAG: ${CI_COMMIT_TAG}
  parallel:
    matrix:
      - IMAGE_NAME: *service_images_release_trim
  rules:
    - if: '$CI_COMMIT_TAG'

img:
