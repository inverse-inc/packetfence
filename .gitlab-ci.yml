    - .build_pf_img_iso_devel_branches_and_maintenance_rules
  environment:
    url: ${SF_ISO_REPO_URL}/${CI_COMMIT_REF_SLUG}
  script:
    - timeout ${PIPELINE_TIMEOUT_SCRIPT} make -e -C ${ISODIR} iso

