info:
  contact:
    name: PacketFence
    url: https://packetfence.org
  description: A JSON HTTP API to access and manage PacketFence resources.
  license:
    name: GNU General Public License v2.0
  title: PacketFence API
  version: 1.2.0
openapi: 3.1.0
paths:
  /api/v1.2/dynamic_report/{id}:
    get:
      description: Get a single report
      operationId: GetReportById
      parameters:
      - description: Report ID
        in: path
        name: id
        required: true
        type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - properties:
                    item:
                      $ref: '#/components/schemas/DynamicReport'
                      type: object
                  type: object
          description: Successful response
        '404':
          description: Report not found
        '500':
          description: Internal server error
      tags:
      - DynamicReport
    options:
      description: Options for a single report
      operationId: OptionsReportById
      parameters:
      - description: Report ID
        in: path
        name: id
        required: true
        type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
