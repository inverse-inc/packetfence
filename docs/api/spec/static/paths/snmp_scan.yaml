/discovernetworkdevice/discover:
  post:
    tags:
      - SnmpScan
    summary: Use SNMP requests to try to find switches and routers at given addresses.
    description: Depending on the number of addresses to scan and the number of threads used, the task can take some times.
    operationId: snmpScan
    requestBody:
      $ref: "#/components/requestBodies/SnmpScanBody"
    responses:
      "200":
        $ref: "#/components/responses/Async"
      "400":
        $ref: "#/components/responses/BadRequest"
/discovernetworkdevice/discover/{id}/cancel:
  post:
    tags:
      - SnmpScan
    summary: Cancel the scan
    description: Cancel the scan with id
    operationId: snmpScanCancelWithId
  parameters:
  - name: id
    description: The id of the async task return by /discovernetworkdevice/discover
    in: path
    required: true
    schema:
      type: string
  responses:
      "200":
        $ref: "#/components/responses/Async"
      "400":
        $ref: "#/components/responses/BadRequest"
