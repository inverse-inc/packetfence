/api/v1/config/provisionings/test_jq:
  description: pf::UnifiedApi::Controller::Config::Provisionings
  post:
    description: Evaluate a jq query against a sample JSON payload, optionally against a node. Used to test the jq query of a generic_http provisioner.
    operationId: api.v1.Config::Provisionings.test_jq
    parameters: []
    responses:
      '200':
        description: Request successful.
        content:
          application/json:
            schema:
              properties:
                passes:
                  description: Whether or not the jq query returns a truthy value.
                  type: boolean
                results:
                  description: The raw results of the jq query.
                  type: array
                  items: {}
                mac:
                  description: The MAC address the query was given as $mac, null when none was requested.
                  type: string
                  nullable: true
                node:
                  description: The node the query was given as $node, null when none was requested or when no node matched the MAC address.
                  type: object
                  nullable: true
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '422':
        $ref: '#/components/responses/UnprocessableEntity'
    requestBody:
      content:
        application/json:
          schema:
            properties:
              jq_query:
                description: The jq query to evaluate.
                type: string
              json:
                description: The sample JSON payload to evaluate the query against.
                type: string
              mac:
                description: Optional MAC address of the node to test the query against. The node is looked up in the database and the query is given it as $mac and $node.
                type: string
              node:
                description: Optional node attributes to test the query against, given to the query as $node. Stands in for the lookup of `mac`.
                type: object
            required:
              - jq_query
              - json
    tags:
      - Config/Provisionings
