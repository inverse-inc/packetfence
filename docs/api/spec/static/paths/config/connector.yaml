  put:
    description: Update the configuration of the cache.
    operationId: api.v1.Config.Connectors.Cache.ConfigUpdate
    parameters:
      - description: "`PRIMARY KEY`"
        in: path
        name: connector_id
        required: true
        schema:
          type: string
    requestBody:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConnectorCacheConfigUpdate"
    responses:
      "200":
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorCacheConfig"
      "400":
