/config/connector/{connector_id}/cache/ping:
  get:
    description: Ping a connector to test availability.
    operationId: api.v1.Config.Connectors.Cache.Ping
    parameters:
      - description: "`PRIMARY KEY`"
        in: path
        name: connector_id
        required: true
        schema:
          type: string
    responses:
      "200":
        content:
          text/plain:
            schema:
              type: string
              example: "pong"
      "400":
        $ref: "#/components/responses/BadRequestText"
      "404":
        $ref: "#/components/responses/NotFoundText"
      "500":
        $ref: "#/components/responses/InternalServerErrorText"
    tags:
      - Config/Connectors/Cache
/config/connector/{connector_id}/cache/optimize-db:
  post:
    description: Delete expired database entries (credential + radius attributes), then optimize the database.
    operationId: api.v1.Config.Connectors.Cache.OptimizeDb
    parameters:
      - description: "`PRIMARY KEY`"
        in: path
        name: connector_id
        required: true
        schema:
          type: string
    responses:
      "200":
        $ref: "#/components/responses/SuccessText"
      "400":
        $ref: "#/components/responses/BadRequestText"
      "404":
        $ref: "#/components/responses/NotFoundText"
      "500":
        $ref: "#/components/responses/InternalServerErrorText"
    tags:
      - Config/Connectors/Cache
/config/connector/{connector_id}/cache/clean:
  post:
    description: Clean all database entries and ratelimit keys.
    operationId: api.v1.Config.Connectors.Cache.Clean
    parameters:
      - description: "`PRIMARY KEY`"
        in: path
        name: connector_id
        required: true
        schema:
          type: string
    responses:
      "200":
        $ref: "#/components/responses/SuccessText"
      "400":
        $ref: "#/components/responses/BadRequestText"
      "404":
        $ref: "#/components/responses/NotFoundText"
      "500":
        $ref: "#/components/responses/InternalServerErrorText"
    tags:
      - Config/Connectors/Cache
/config/connector/{connector_id}/cache/restart:
  post:
    description: Gracefully stop then restart the cache (a few ms of downtime max).
    operationId: api.v1.Config.Connectors.Cache.Restart
    parameters:
      - description: "`PRIMARY KEY`"
        in: path
        name: connector_id
        required: true
        schema:
          type: string
    responses:
      "200":
        $ref: "#/components/responses/SuccessText"
      "400":
        $ref: "#/components/responses/BadRequestText"
      "404":
        $ref: "#/components/responses/NotFoundText"
      "500":
        $ref: "#/components/responses/InternalServerErrorText"
    tags:
      - Config/Connectors/Cache
/config/connector/{connector_id}/cache/stats:
  get:
    description: Get some metrics about RAM, disk database... usage.
    operationId: api.v1.Config.Connectors.Cache.StatsGet
    parameters:
      - description: "`PRIMARY KEY`"
        in: path
        name: connector_id
        required: true
        schema:
          type: string
    responses:
      "200":
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorCacheStats"
      "400":
        $ref: "#/components/responses/BadRequestText"
      "404":
        $ref: "#/components/responses/NotFoundText"
      "500":
        $ref: "#/components/responses/InternalServerErrorText"
    tags:
      - Config/Connectors/Cache
/config/connector/{connector_id}/cache/config:
  get:
    description: Get the configuration of the cache.
    operationId: api.v1.Config.Connectors.Cache.ConfigGet
    parameters:
      - description: "`PRIMARY KEY`"
        in: path
        name: connector_id
        required: true
        schema:
          type: string
