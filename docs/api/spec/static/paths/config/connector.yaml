    operationId: api.v1.Config.Connectors.search
    parameters: []
    requestBody:
      content:
        application/json:
          example:
            cursor: 0
            limit: 25
          schema:
            allOf:
              - $ref: "#/components/schemas/Search"
              - properties:
                  cursor:
                    type: string
                  fields:
                    items:
                      type: string
                    type: array
                  limit:
                    maximum: 1000
                    minimum: 1
                    type: integer
                  sort:
                    items:
                      type: string
                    type: array
                required:
                  - fields
                  - sort
      description: Search for items.
    responses:
