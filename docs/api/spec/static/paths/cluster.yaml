/api/v1/cluster/config:
  get:
    summary: Cluster configuration.
    responses:
      '200':
        description: Request successful. Response contains the cluster configuration.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterConfig"
      '401':
        $ref: '#/components/responses/Unauthorized'
    tags:
      - Cluster

/api/v1/cluster/servers:
  get:
    summary: Cluster members.
    responses:
      '200':
        description: Request successful. Response contains the cluster members.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterServers"
      '401':
        $ref: '#/components/responses/Unauthorized'
    tags:
      - Cluster

/api/v1/cluster/vips:
  get:
    summary: Cluster virtual IPs and the server(s) currently holding them.
    description: Queries every enabled member of every cluster zone in real time, in parallel and with a timeout per member. A virtual IP with more than one owner indicates a split brain, and one without owner is not held by any member (or unknown when a member of its zone could not be queried).
    responses:
      '200':
        description: Request successful.
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      zone:
                        type: string
                        description: The cluster zone of the virtual IP.
                      vip:
                        type: string
                        description: The virtual IP address.
                      interface:
                        type: string
                        description: The interface of the virtual IP.
                      management:
                        type: boolean
                        description: Whether or not this is the management virtual IP.
                      owners:
                        type: array
                        description: The hostname of the server(s) currently holding the virtual IP.
                        items:
                          type: string
                      since:
                        type: integer
                        nullable: true
                        description: Epoch of the last transition to master of the current owner (as reported by keepalived).
                      status:
                        type: string
                        enum: [ok, split_brain, none, unknown]
                        description: ok (one owner), split_brain (several owners), none (no owner) or unknown (no owner among the members that answered while a member of the same zone could not be queried).
                servers:
                  type: array
                  items:
                    type: object
                    properties:
                      host:
                        type: string
                      management_ip:
                        type: string
                      zone:
                        type: string
                      error:
                        type: string
                        description: Set when the server could not be queried.
                      vips:
                        type: array
                        items:
                          $ref: "#/components/schemas/ClusterVipLocal"
      '401':
        $ref: '#/components/responses/Unauthorized'
    tags:
      - Cluster

/api/v1/cluster/vips/local:
  get:
    summary: Cluster virtual IPs as seen by the server answering the request.
    responses:
      '200':
        description: Request successful.
        content:
          application/json:
            schema:
              type: object
              properties:
                item:
                  type: object
                  properties:
                    host:
                      type: string
                    zone:
                      type: string
                      description: The cluster zone of the server. Only the virtual IPs of this zone are listed.
                    vips:
                      type: array
                      items:
                        $ref: "#/components/schemas/ClusterVipLocal"
      '401':
        $ref: '#/components/responses/Unauthorized'
    tags:
      - Cluster
