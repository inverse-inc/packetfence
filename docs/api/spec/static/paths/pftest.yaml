/api/v1/pftest/authentication:
  post:
    summary: Run `pftest authentication` on the local node.
    description: |
      Runs the same probe as the CLI helper `pftest authentication
      <user> <password> [<sources>...]`. Empty password is accepted and
      turns the call into a reach test against each source. The full
      captured stdout/stderr is returned verbatim; ANSI escapes are
      stripped from `output` and preserved in `output_raw`.

      The endpoint is auditable; the `password` field is redacted from
      the admin API audit log entry by the standard `fields_to_mask`
      mechanism.

      Requires the `PFTEST_CREATE` admin-role action (all `/pftest/*`
      endpoints do). Authentication runs are rate-limited per tested
      user (one run per node per 10s window) — exceeding it returns 429.
    requestBody:
      $ref: "#/components/requestBodies/PftestAuthentication"
    responses:
      '200':
        $ref: "#/components/responses/PftestRun"
      '401':
        $ref: "#/components/responses/Unauthorized"
      '422':
        $ref: "#/components/responses/UnprocessableEntity"
      '429':
        description: Rate limited — too many authentication tests for this user; retry after the window.
    tags:
      - pftest

/api/v1/pftest/profile_filter:
  post:
    summary: Run `pftest profile_filter` on the local node.
    description: |
      Resolves which connection profile would match the given MAC under
      the supplied attribute set. `params` keys must match
      `[A-Za-z0-9_-]+`; malformed keys are dropped server-side.
    requestBody:
      $ref: "#/components/requestBodies/PftestProfileFilter"
    responses:
      '200':
        $ref: "#/components/responses/PftestRun"
      '401':
        $ref: "#/components/responses/Unauthorized"
      '422':
        $ref: "#/components/responses/UnprocessableEntity"
    tags:
      - pftest

/api/v1/pftest/cluster/authentication:
  post:
    summary: Cluster-aware variant of /pftest/authentication.
    description: |
      Returns a per-host item list. By default only the local node runs
      the probe; with `cluster: true` in the body every enabled cluster
      node does (opt-in — N nodes mean N real authentication attempts,
      which can trip account-lockout policies). Peer calls run in
      parallel with a 25–30s per-peer timeout. Authentication runs are
      rate-limited per tested user; exceeding the window returns 429.
    requestBody:
      $ref: "#/components/requestBodies/PftestAuthentication"
    responses:
      '200':
        $ref: "#/components/responses/PftestClusterRun"
      '401':
        $ref: "#/components/responses/Unauthorized"
      '422':
        $ref: "#/components/responses/UnprocessableEntity"
      '429':
        description: Rate limited — too many authentication tests for this user; retry after the window.
    tags:
      - pftest

/api/v1/pftest/cluster/profile_filter:
  post:
    summary: Cluster-aware variant of /pftest/profile_filter.
    description: |
      Returns a per-host item list. By default only the local node runs
      the probe; with `cluster: true` every enabled cluster node does.
    requestBody:
      $ref: "#/components/requestBodies/PftestProfileFilter"
    responses:
      '200':
        $ref: "#/components/responses/PftestClusterRun"
      '401':
        $ref: "#/components/responses/Unauthorized"
      '422':
        $ref: "#/components/responses/UnprocessableEntity"
    tags:
      - pftest
