ClusterConfig:
  type: object
  properties:
    item:
      type: object
      properties:
        CLUSTER:
          $ref: '#/components/schemas/ClusterServer'
        additionalProperties:
          $ref: '#/components/schemas/ClusterServer'
    status:
      $ref: "#/components/schemas/Status"

ClusterServers:
  type: object
  properties:
    items:
      items:
        $ref: '#/components/schemas/ClusterServer'
      type: array
    status:
      $ref: "#/components/schemas/Status"

ClusterServer:
  type: object
  properties:
    host:
      type: string
    management_ip:
      type: string
    additionalProperties:
      description: |
        Key is dynamic (example: `interface eth0`)
      type: object
      properties:
        ip:
          type: string

ClusterVipLocal:
  type: object
  properties:
    vip:
      type: string
      description: The virtual IP address.
    interface:
      type: string
      description: The interface of the virtual IP.
    management:
      type: boolean
      description: Whether or not this is the management virtual IP.
    owner:
      type: boolean
      description: Whether or not this server currently holds the virtual IP.
    state:
      type: string
      nullable: true
      description: The last VRRP state reported by keepalived on this server (master or slave).
    since:
      type: integer
      nullable: true
      description: Epoch of the last VRRP state transition reported by keepalived on this server.
