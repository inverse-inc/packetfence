ConfigCertificate:
  properties:
    lets_encrypt:
      description: Whether or not Let's Encrypt is enabled for the certificate resource
      type: boolean
      enum:
        - false
        - true
    certificate:
      description: The server certficate for the resource in x509 PEM encoded format. It can be followed by its intermediate certificates (full chain), which are used when intermediate_cas is absent or empty.
      type: string
    private_key:
      description: The RSA server key for the resource in PEM encoded format
      type: string
    ca:
      description: The CA certficate for the resource (if applicable)
      type: string
    intermediate_cas:
      description: The list of intermediate certificate authorities for the server certificate. When absent, the intermediates are the ones following the server certificate in the certificate field, otherwise they are fetched through the Authority Information Access of the certificate. When empty, the intermediates following the server certificate are used, otherwise no intermediate is used.
      type: array
      items:
        type: string
  type: object

ConfigCertificateInfo:
  properties:
    certificate:
      description: The server certficate for the resource
      $ref: '#/components/schemas/ConfigCertificateDetails'
    ca:
      description: The CA certficate for the resource (if applicable)
      $ref: '#/components/schemas/ConfigCertificateDetails'
    intermediate_cas:
      description: The list of certificate authorities for the server certificate
      type: array
      items:
        $ref: '#/components/schemas/ConfigCertificateDetails'
    chain_is_valid:
      description: Information about whether or not the certificate chain is valid
      $ref: '#/components/schemas/ConfigCertificateReturnValue'
    cert_key_match:
      description: Information about whether or not the certificate and private key match
      $ref: '#/components/schemas/ConfigCertificateReturnValue'
  type: object

ConfigCertificateReturnValue:
  properties:
    success:
      type: boolean
      description: "Whether or not the operation has succeeded"
    result:
      type: string
      description: "The value (usually error or success message)"


ConfigCertificateDetails:
  properties:
    common_name:
      type: string
      description: "The common name of the certificate"
    subject:
      type: string
      description: "The subject of the certificate"
    issuer:
      type: string
      description: "The issuer of the certificate"
    serial:
      type: string
      description: "The serial of the certificate"
    not_before:
      type: string
      description: "The start date at which the certificate can be used"
    not_after:
      type: string
      description: "The date until which the certificate can be used"

ConfigCertificateCSR:
  properties:
    country:
      description: The country for the certificate
      type: string
    state:
      description: The state for the certificate
      type: string
    locality:
      description: The locality for the certificate
      type: string
    organization_name:
      description: The organization name for the certificate
      type: string
    common_name:
      description: The common name for the certificate
      type: string
  type: object

ConfigCertificatePkiImport:
  properties:
    mode:
      description: "cert to export an existing PacketFence PKI certificate with its private key, csr to have a PacketFence PKI template sign a CSR built from private_key"
      type: string
      enum:
        - cert
        - csr
    cert_id:
      description: The PacketFence PKI certificate id (mode cert)
      type: string
    profile_id:
      description: The PacketFence PKI template id (mode csr)
      type: string
    private_key:
      description: The RSA private key in PEM format the CSR is built from (mode csr)
      type: string
    country:
      description: The country for the certificate (mode csr)
      type: string
    state:
      description: The state for the certificate (mode csr)
      type: string
    locality:
      description: The locality for the certificate (mode csr)
      type: string
    organization_name:
      description: The organization name for the certificate (mode csr)
      type: string
    common_name:
      description: The common name for the certificate (mode csr)
      type: string
    subject_alt_names:
      description: Comma-delimited list of DNS Subject Alternative Names (mode csr)
      type: string
  required:
    - mode
  type: object

ConfigCertificatePkiImportReturnValue:
  properties:
    certificate:
      description: The certificate in PEM format
      type: string
    private_key:
      description: The private key in PEM format
      type: string
    intermediate_cas:
      description: The intermediate certificates in PEM format
      type: array
      items:
        type: string
    ca:
      description: The issuing CA certificate in PEM format
      type: string
    warnings:
      description: Non blocking issues, e.g. a template without the server authentication extended key usage
      type: array
      items:
        type: string
  type: object

ConfigCertificateLetsEncrypt:
  properties:
    common_name:
      description: The common name for the certificate
      type: string
  type: object
