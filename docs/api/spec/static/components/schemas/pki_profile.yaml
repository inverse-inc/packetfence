PkiProfile:
  type: object
  properties:
    ca_id:
      type: string
    ca_name:
      type: string
    days_before_renewal:
      type: string
    days_before_renewal_mail:
      type: string
    digest:
      $ref: '#/components/schemas/PkiDigest'
    extended_key_usage:
      $ref: '#/components/schemas/PkiExtendedKeyUsages'
    key_size:
      type: string
    key_type:
      $ref: '#/components/schemas/PkiKeyType'
    key_usage:
      $ref: '#/components/schemas/PkiKeyUsage'
    name:
      type: string
    mail:
      type: string
    renewal_mail_subject:
      type: string
    revoked_valid_until:
      type: string
    scep_days_before_renewal:
      type: string
    renewal_mail:
      type: string
    renewal_mail_days:
      type: string
      description: |
        Optional comma-separated list of thresholds, in days before the
        certificate expires, at which the renewal email is sent (once per
        threshold). When empty, `days_before_renewal_mail` is used.
      example: 14,7,1
    renewal_mail_from:
      type: string
    renewal_mail_header:
      type: string
    renewal_mail_footer:
      type: string
    validity:
      type: string
    acme_enabled:
      type: integer
      description: Enable ACME (RFC 8555) enrollment on the profile. The ACME directory is `/api/v1/pki/acme/{profile name}/directory`.
      enum:
        - 0
        - 1
      default: 0
    acme_allowed_identifiers:
      type: string
      description: |
        Comma-separated identifier types an ACME order may contain (`dns`,
        `ip`, `permanent-identifier`). An empty list rejects every order.
        `permanent-identifier` also needs an attestation format.
      example: dns,ip
    acme_eab_required:
      type: integer
      description: |
        Require External Account Binding on new ACME accounts (see
        `/api/v1/pki/profile/{profile_id}/acme/eab`).
      enum:
        - 0
        - 1
      default: 1
    acme_attestation_formats:
      type: string
      description: |
        Comma-separated attestation formats accepted by the
        device-attest-01 challenge. Only `apple` is implemented. Empty
        disables device-attest-01.
      example: apple
    acme_attestation_roots:
      type: string
      description: |
        Optional PEM bundle of trusted attestation root CAs, replacing the
        built-in Apple Enterprise Attestation Root CA.
    acme_account_expiry:
      type: string
      description: Lifetime of a new ACME account, in days (0 for no expiry).
      default: '365'
    acme_order_expiry:
      type: string
      description: Lifetime of an ACME order, in days.
      default: '7'
    acme_authz_expiry:
      type: string
      description: Lifetime of an ACME authorization, in hours.
      default: '24'
    est_enabled:
      type: integer
      description: |
        Enable EST (RFC 7030) enrollment on the profile, at
        `/.well-known/est/{profile name}/`. Enrollment is refused while
        `est_password` is not set.
      enum:
        - 0
        - 1
      default: 0
    est_username:
      type: string
      description: HTTP Basic user name EST clients must present. Empty accepts any user name.
    est_password:
      type: string
      format: password
      writeOnly: true
      description: |
        HTTP Basic password EST clients must present. Write-only: it is
        never returned by the API. On update, leaving it out keeps the
        stored password.

PkiProfileForm:
  allOf:
    - $ref: '#/components/schemas/PkiProfile'
    - required:
      - name
      - mail
      - validity
      - key_type
      - key_size
      - digest

PkiProfilesList:
  type: object
  allOf:
    - $ref: '#/components/schemas/Iterable'
    - $ref: '#/components/schemas/Gorm'
    - properties:
        contentType:
          type: string
        error:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/PkiProfile'
        password:
          type: string
        raw:
          type: string
        serial:
          type: string
        status:
          $ref: '#/components/schemas/Status'

PkiProfilesSearch:
  allOf:
    - $ref: '#/components/schemas/Iterable'
    - $ref: '#/components/schemas/Gorm'
    - type: object
      properties:
        items:
          description: Profiles.
          type: array
          items:
            $ref: '#/components/schemas/PkiProfile'

PkiProfilesQuery:
  type: object
  oneOf:
    - $ref: '#/components/schemas/PkiProfilesQueryNested'
    - $ref: '#/components/schemas/PkiProfilesQueryField'
  discriminator:
    propertyName: op
    mapping:
      and: '#/components/schemas/PkiProfilesQueryNested'
      or: '#/components/schemas/PkiProfilesQueryNested'
      contains: '#/components/schemas/PkiProfilesQueryField'
      not_contains: '#/components/schemas/PkiProfilesQueryField'
      match: '#/components/schemas/PkiProfilesQueryField'
      not_match: '#/components/schemas/PkiProfilesQueryField'
      between: '#/components/schemas/PkiProfilesQueryField'
      not_between: '#/components/schemas/PkiProfilesQueryField'
      is: '#/components/schemas/PkiProfilesQueryField'
      is_not: '#/components/schemas/PkiProfilesQueryField'
  example:
    op: and
    values:
      - field: id
        op: contains
        value: ""

PkiProfilesQueryNested:
  type: object
  properties:
    op:
      description: Search operator.
      type: string
      enum:
        - and
        - or
    values:
      description: Nested child search criteria.
      type: array
      items:
        $ref: '#/components/schemas/PkiProfilesQuery'

PkiProfilesQueryField:
  type: object
  properties:
    op:
      description: Search operator.
      type: string
      enum:
        - contains
        - not_contains
        - match
        - not_match
        - between
        - not_between
        - is
        - is_not
    field:
      $ref: '#/components/schemas/PkiProfilesField'
    value:
      description: Search criteria.
      type: string

PkiProfilesField:
  type: string
  example: id
  enum:
    - id
    - ca_id
    - ca_name
    - days_before_renewal
    - days_before_renewal_mail
    - digest
    - extended_key_usage
    - key_size
    - key_type
    - key_usage
    - name
    - mail
    - renewal_mail_subject
    - revoked_valid_until
    - scep_days_before_renewal
    - renewal_mail
    - renewal_mail_days
    - validity
    - acme_enabled
    - acme_allowed_identifiers
    - acme_eab_required
    - acme_attestation_formats
    - acme_account_expiry
    - acme_order_expiry
    - acme_authz_expiry
    - est_enabled
    - est_username

PkiProfilesSort:
  type: array
  items:
    type: string
    example: id ASC
    enum:
      - id ASC
      - id DESC
      - ca_id ASC
      - ca_id DESC
      - ca_name ASC
      - ca_name DESC
      - days_before_renewal ASC
      - days_before_renewal DESC
      - days_before_renewal_mail ASC
      - days_before_renewal_mail DESC
      - digest ASC
      - digest DESC
      - extended_key_usage ASC
      - extended_key_usage DESC
      - key_size ASC
      - key_size DESC
      - key_type ASC
      - key_type DESC
      - key_usage ASC
      - key_usage DESC
      - name ASC
      - name DESC
      - mail ASC
      - mail DESC
      - renewal_mail_subject ASC
      - renewal_mail_subject DESC
      - revoked_valid_until ASC
      - revoked_valid_until DESC
      - scep_days_before_renewal ASC
      - scep_days_before_renewal DESC
      - renewal_mail ASC
      - renewal_mail DESC
      - validity ASC
      - validity DESC
      - acme_enabled ASC
      - acme_enabled DESC
      - est_enabled ASC
      - est_enabled DESC
