LogsMeta:
  type: object
  properties:
    meta:
      type: object
      properties:
        files:
          $ref: "#/components/schemas/Meta"
        filter:
          $ref: "#/components/schemas/MetaItem"
        filter_is_regexp:
          $ref: "#/components/schemas/MetaItem"

LogsCreate:
  type: object
  properties:
    message:
      description: A descriptive message for the user.
      type: string
    session_id:
      description: Log session identifier.
      type: string

LogsTail:
  type: object
  properties:
    events:
      type: array
      items:
        type: object
        properties:
          category:
            type: string
          data:
            type: object
            properties:
              meta:
                description: Parsed log lines
                type: object
                properties:
                  filename:
                    type: string
                  hostname:
                    type: string
                  log_level:
                    type: string
                  log_without_prefix:
                    type: string
                  process:
                    type: string
                  syslog_name:
                    type: string
                  timestamp:
                    type: string
              raw:
                description: Raw log output
                type: string
          timestamp:
            description: Unix epoch timestamp (seconds).
            type: integer

LogsHistoryEvent:
  type: object
  properties:
    data:
      type: object
      properties:
        raw:
          description: Raw log line.
          type: string
        meta:
          type: object
          properties:
            timestamp:
              type: string
            hostname:
              type: string
            process:
              type: string
            syslog_name:
              type: string
            log_level:
              type: string
            filename:
              type: string
            log_without_prefix:
              type: string

LogsHistoryCursor:
  description: |
    Opaque per-file read position. Clients must echo it back unchanged; the
    fields track the byte position inside a specific source (active file or
    rotation) so pagination never drops lines, survives logrotate renames
    and falls back to the timestamp when a rotation was pruned.
  type: object
  properties:
    source:
      description: Rotation index of the source (0 = active file).
      type: integer
    offset:
      description: Uncompressed byte offset of the next unread line.
      type: integer
      format: int64
    sig:
      description: Content signature identifying the source across renames.
      type: string
    sig_len:
      description: Number of prefix bytes the signature covers.
      type: integer
    ts_ms:
      description: Unix ms of the last scanned line (resume fallback).
      type: integer
      format: int64

LogsHistory:
  type: object
  properties:
    events:
      type: array
      items:
        $ref: "#/components/schemas/LogsHistoryEvent"
    cursor:
      description: Per-filename cursor. Opaque — feed it back verbatim to paginate.
      type: object
      additionalProperties:
        $ref: "#/components/schemas/LogsHistoryCursor"
    truncated:
      description: |
        True when a scan bound (wall-clock budget, byte ceiling or event cap)
        stopped the read before the window was exhausted. Resubmit with the
        returned cursor to continue; an empty truncated page only means the
        budget expired before a match was found.
      type: boolean
