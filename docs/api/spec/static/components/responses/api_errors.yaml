APINotFound:
  description: Resource not found
  content:
    application/json:
      schema:
        allOf:
          - $ref: "#/components/schemas/ApiResponseError"
          - type: object
            properties:
              status:
                type: integer
                default: 404

APIBadRequest:
  description: Bad request
  content:
    application/json:
      schema:
        allOf:
          - $ref: "#/components/schemas/ApiResponseError"
          - type: object
            properties:
              status:
                type: integer
                default: 403

APIInternalServerError:
  description: Check server logs for more details
  content:
    application/json:
      schema:
        allOf:
          - $ref: "#/components/schemas/ApiResponseError"
          - type: object
            properties:
              status:
                type: integer
                default: 500
