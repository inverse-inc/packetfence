PkiNull:
  description: Request successful.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiNull"

PkiCa:
  description: Request successful. The response contains the PKI Certificate Authority.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiCasList"

PkiCasList:
  description: Request successful. The response contains PKI Certificate Authorities.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiCasList"

PkiCaCreate:
  description: Request successful. The PKI Certificate Authority has been created.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiCasList"

PkiCasSearch:
  description: Request successful. The response contains the search results.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiCasSearch"

PkiProfile:
  description: Request successful. The response contains the PKI Profile.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiProfilesList"

PkiProfilesList:
  description: Request successful. The response contains the PKI Profiles.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiProfilesList"

PkiProfileCreate:
  description: Request successful. The PKI Profile has been created.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiProfilesList"

PkiProfileDelete:
  description: Request successful. The PKI Profile has been deleted.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiProfilesList"

PkiProfileSignCsr:
  description: Request successful. The PKI Profile CSR has been signed.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiProfilesList"

PkiProfileUpdate:
  description: Request successful. The PKI Profile has been updated.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiProfilesList"

PkiProfilesSearch:
  description: Request successful. The response contains the search results.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiProfilesSearch"

PkiCert:
  description: Request successful. The response contains the PKI Certificate.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiCertsList"

PkiCertsList:
  description: Request successful. The response contains the PKI Certificates.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiCertsList"

PkiCertCreate:
  description: Request successful. The PKI Certificate has been created.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiCertsList"

PkiCertDownload:
  description: Request successful. The response contains the PKI PKCS-12 Certificate.
  content:
    application/json:
      schema:
        type: string
        format: binary
  headers:
    Content-Disposition:
      schema:
        type: string
        description: Binary PKCS-12 Certficate.
        example: attachment; filename="certificate.p12"

PkiCertEmail:
  description: Request successful. The PKI Certificate has been emailed.
  content:
    application/json:
      schema:
        type: object
        properties:
          password:
            type: string
            description: The password of the PKCS-12 file.
          password_mailed:
            type: boolean
            description: Whether the password was in the mail (the `p12_mail_password` setting of the template). When it wasn't, the administrator has to give it to the user.
          status:
            type: integer

PkiCertRevoke:
  description: Request successful. The PKI Certificate has been revoked.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiNull"

PkiCertsSearch:
  description: Request successful. The response contains the search results.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiCertsSearch"

PkiRevokedCert:
  description: Request successful. The response contains the PKI Revoked Certificate.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiRevokedCertsList"

PkiRevokedCertsList:
  description: Request successful. The response contains the PKI Revoked Certificates.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiRevokedCertsList"

PkiRevokedCertsSearch:
  description: Request successful. The response contains the search results.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiRevokedCertsSearch"

PkiScepServer:
  description: Request successful. The response contains the PKI SCEP Server.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiScepServersList"

PkiScepServersList:
  description: Request successful. The response contains PKI SCEP Servers.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiScepServersList"

PkiScepServerCreate:
  description: Request successful. The PKI SCEP Server has been created.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiScepServersList"

PkiScepServersSearch:
  description: Request successful. The response contains the search results.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiScepServersSearch"

PkiHsm:
  description: Request successful. The response contains the PKI HSM (without its PIN).
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiHsmsList"

PkiHsmsList:
  description: Request successful. The response contains the PKI HSMs (without their PIN).
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiHsmsList"

PkiHsmCreate:
  description: Request successful. The token was opened with the given settings and the PKI HSM has been created.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiHsmsList"

PkiHsmsSearch:
  description: Request successful. The response contains the search results.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiHsmsSearch"

PkiHsmDelete:
  description: Request successful. The PKI HSM has been deleted.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiNull"

PkiHsmInUse:
  description: The PKI HSM holds the key of at least one Certificate Authority and can't be deleted.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiErrors"

PkiError:
  description: Request failed.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiErrors"

PkiAcmeEabList:
  description: Request successful. The response contains the EAB keys of the profile, without their HMAC key.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiAcmeEabList"

PkiAcmeEabCreate:
  description: The EAB key has been created. This is the only answer that contains its HMAC key.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiAcmeEab"

PkiAcmeMobileConfig:
  description: |
    Request successful. The response is an unsigned Apple configuration
    profile with one ACME certificate payload (com.apple.security.acme)
    pointing to the ACME directory of the profile. Sign and deploy it
    with your MDM.
  headers:
    Content-Disposition:
      schema:
        type: string
      example: attachment; filename="pfpki-acme-default.mobileconfig"
  content:
    application/x-apple-aspen-config:
      schema:
        type: string
        description: XML property list.

PkiProcessCloudRevocations:
  description: Request successful. `total_count` is the number of cloud-side revocations applied.
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/PkiNull"
