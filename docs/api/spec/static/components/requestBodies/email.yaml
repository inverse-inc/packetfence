EmailPreview:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - template
        properties:
          template:
            type: string
            description: Email template from *html/captive-portal/templates/emails/emails-[template].html*.
          args:
            type: object
            description: Key-value map of template values. With `with_aup` set to true, `aup` is set to the acceptable use policy of the default connection profile (*aup_text.html*).
          locale:
            type: string
            description: Language of the email (ex. fr, fr-CA, pt_BR), matched against the supported locales. Defaults to the Accept-Language header of the request, then to the default language.
        example:
          template: guest_local_account_creation
          args:
            pid: admin
            password: OneAkamai

EmailSend:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - template
          - to
          - subject
        properties:
          template:
            type: string
            description: Email template from *html/captive-portal/templates/emails/emails-[template].html*.
          args:
            type: object
            description: Key-value map of template values. With `with_aup` set to true, `aup` is set to the acceptable use policy of the default connection profile (*aup_text.html*).
          to:
            type: string
            description: Email address recipient.
          subject:
            type: string
            description: Email subject.
          locale:
            type: string
            description: Language of the email (ex. fr, fr-CA, pt_BR), matched against the supported locales. Defaults to the Accept-Language header of the request, then to the default language.
        example:
          template: guest_local_account_creation
          args:
            pid: admin
            password: OneAkamai
          to: noone@example.com
          subject: Lonely Nigerian Prince

EmailMailer:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - message
          - subject
        properties:
          message:
            type: string
            description: Email message body.
          subject:
            type: string
            description: Email subject.
        example:
          message: Please send bitcoins!
          subject: Lonely Nigerian Prince