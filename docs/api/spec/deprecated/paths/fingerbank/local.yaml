# The local Fingerbank entries were removed in PacketFence 16.0: only the
# Upstream data can be read, through the all and upstream scopes
/api/v1/fingerbank/local/devices:
  post:
    deprecated: true
    summary: Create local device.
    description: 'Deprecated: local Fingerbank entries were removed in PacketFence 16.0. This endpoint no longer exists and returns 404.'
    requestBody:
      $ref: '#/components/requestBodies/FingerbankDevice'
    responses:
      '200':
        $ref: '#/components/responses/Created'
      '401':
        $ref: '#/components/responses/Unauthorized'
    tags:
      - Fingerbank

/api/v1/fingerbank/local/device/{device_id}:
  parameters:
  - name: device_id
    in: path
    required: true
    schema:
