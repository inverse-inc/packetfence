# Debian base release used by the ISO builders (ci/cd-iso, ci/dvd-usb-iso).
#
# DEBIAN_VERSION       point release; interpolated into the ISO filename and the
#                      cdimage download path.
# DEBIAN_CODENAME      apt suite name; used for the PacketFence repo suite, the
#                      debootstrap suite and the generated on-ISO Release file.
# DEBIAN_SNAPSHOT_DATE snapshot.debian.org timestamp used as the apt mirror when
#                      building the offline repo. Must be at or after the
#                      DEBIAN_VERSION release date, or the snapshot predates the
#                      point release it is meant to mirror. 13.6.0 shipped
#                      2026-07-11.
DEBIAN_VERSION=13.6.0
DEBIAN_CODENAME=trixie
DEBIAN_SNAPSHOT_DATE=20260823T235959Z

# SHA256 of the images fetched from cdimage.debian.org for DEBIAN_VERSION.
# From https://cdimage.debian.org/cdimage/release/${DEBIAN_VERSION}/amd64/iso-{cd,dvd}/SHA256SUMS
DEBIAN_NETINST_SHA256=65273beed27b2df543b68b65630ba525cfbad8df2b12035732b2dff87d6664e7
DEBIAN_DVD1_SHA256=e97736b7f49af22497c8df95e381ea5025faf3575af4b7ca6d5f40971265364e
