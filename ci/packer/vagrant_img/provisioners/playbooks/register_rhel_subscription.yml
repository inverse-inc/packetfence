- hosts: pfservers
  name: Register RHEL subscription
  become: True
  gather_facts: False
  tags: register

  pre_tasks:
  - name: Gather min only
    ansible.builtin.setup:
      gather_subset:
        - "!all"

  tasks:
    # psonoci reads PSONO_CI_* from the controller env (forwarded into the
    # build container); environment: injects them into the guest command.
    - name: Get RHEL username using psonoci
      ansible.builtin.command:
        cmd: 'psonoci secret get {{ rhel_sub_psono_secret_id }} username'
      environment: "{{ psono_ci_env }}"
      when:
        - ansible_os_family == 'RedHat'
        - rhel_sub_psono_secret_id | length > 0
      no_log: True
      register: reg_rhel_sub_register_username
      retries: 3
      delay: 10
      until: reg_rhel_sub_register_username is successful

    - name: Get RHEL password using psonoci
      ansible.builtin.command:
        cmd: 'psonoci secret get {{ rhel_sub_psono_secret_id }} password'
      environment: "{{ psono_ci_env }}"
      when:
        - ansible_os_family == 'RedHat'
        - rhel_sub_psono_secret_id | length > 0
      no_log: True
      register: reg_rhel_sub_register_password
      retries: 3
      delay: 10
      until: reg_rhel_sub_register_password is successful

    - name: Register RHEL subscription
      community.general.redhat_subscription:
        state: present
        username: '{{ reg_rhel_sub_register_username.stdout }}'
        password: '{{ reg_rhel_sub_register_password.stdout }}'
        auto_attach: true
      when:
        - ansible_os_family == 'RedHat'
        - rhel_sub_psono_secret_id | length > 0
      no_log: True
      register: reg_rhel_sub_register_el
      retries: 3
      delay: 10
      until: reg_rhel_sub_register_el is successful
