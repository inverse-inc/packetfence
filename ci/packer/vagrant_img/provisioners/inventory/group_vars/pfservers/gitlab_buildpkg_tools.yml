# PacketFence package host (packaging Pulp) for dependencies and the signing key.
pf_repo_origin: '{{ lookup("env", "PF_PACKAGE_ORIGIN") | default("https://packages.packetfence.com", true) }}'

# get current PacketFence minor release (X.Y)
pf_minor_release: '{{ lookup("env", "PF_MINOR_RELEASE") | default("99.9", true) }}'

# disabled adding PPA key and repo in the pipeline
gitlab_buildpkg_tools__ppa_enabled: False

# Debian
gitlab_buildpkg_tools__deb_keys:
  - '{{ pf_repo_origin }}/downloads/GPG_PUBLIC_KEY'
  - 'https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key'

gitlab_buildpkg_tools__deb_deps_repos:
  - name: packetfence
    baseurl: '{{ pf_repo_origin }}/downloads/PacketFence/debian/{{ pf_minor_release }} {{ ansible_distribution_release }} {{ ansible_distribution_release }}'
  - name: nodejs
    baseurl: 'https://deb.nodesource.com/node_20.x nodistro main'

gitlab_buildpkg_tools__deb_pkgs:
  - nodejs
