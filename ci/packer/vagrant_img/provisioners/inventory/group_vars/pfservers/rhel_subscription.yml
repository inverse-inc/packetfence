---
# Psono secret holding the RHEL subscription user/password (CI gitlab-runner).
# Same secret used by the venom test path (addons/vagrant/inventory/hosts).
rhel_sub_psono_secret_id: 'e9d98894-bd22-4f32-8b59-653aceb72ec4'

# Credentials for psonoci, looked up from the runner env forwarded into the
# build container. PSONO_CI_API_* are defined as GitLab CI/CD variables.
psono_ci_env:
  PSONO_CI_SERVER_URL: '{{ lookup("env", "PSONO_CI_SERVER_URL") | default("https://psono.inverse.ca/server", true) }}'
  PSONO_CI_API_KEY_ID: '{{ lookup("env", "PSONO_CI_API_KEY_ID") }}'
  PSONO_CI_API_SECRET_KEY_HEX: '{{ lookup("env", "PSONO_CI_API_SECRET_KEY_HEX") }}'
