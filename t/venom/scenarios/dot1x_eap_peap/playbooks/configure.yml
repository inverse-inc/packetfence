---
- hosts: pfservers
  name: configure Packetfence VM
  become: True

  vars:
    debianPackages:
      - curl
      - python3-pip
      - virtualenv
      - jq

  tasks:
    - name: Install packages
      package:
        name: "{{ debianPackages }}"
        state: present

    - name: Install xmltodict python package
      shell: | 
        set -e -o pipefail
        pip install xmltodict --break-system-packages
      args:
        executable: /usr/bin/bash
