---
- hosts: pfservers
  name: configure Packetfence VM
  become: True

  tasks:
    - name: Install qemu-system-x86
      apt:
        name: qemu-system-x86
        state: present

    # not loaded by default; the bridge-nf-call sysctls only exist with it
    - name: Load br_netfilter module
      community.general.modprobe:
        name: br_netfilter
        state: present

    # without this bridged inline DHCP/traffic is punted to iptables and dropped
    - name: Disable Netfilter on bridge
      ansible.posix.sysctl:
        name: "{{ item }}"
        state: 'present'
        value: '0'
        reload: yes
      loop:
        - net.bridge.bridge-nf-call-ip6tables
        - net.bridge.bridge-nf-call-iptables
        - net.bridge.bridge-nf-call-arptables
