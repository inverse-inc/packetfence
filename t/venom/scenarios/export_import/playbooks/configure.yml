---
- hosts: pfdeb9stable
  name: Configure VM to run tests
  become: True
  gather_facts: True
  collections:
    - debops.debops
    - debops.roles01
    - debops.roles02
    - debops.roles03  

  pre_tasks:
    - name: Force cache update to get correct Ansible distribution release
      apt:
        update_cache: yes

    - name: Refresh Ansible facts after cache update
      setup:

  roles:
    - role: inverse_inc.gitlab_buildpkg_tools
    - role: apt_preferences

  # This pipeline's build, from its PPA (gitlab_buildpkg_tools), not a file another pipeline published.
  tasks:
    - name: Install packetfence-export package
      apt:
        name: packetfence-export
        state: present
