---
# Boot a powered-off node via libvirt and wait for it to answer SSH again.
- import_tasks: read_uuid.yml

- name: "Boot {{ inventory_hostname }} (virsh start)"
  ansible.builtin.command: "virsh -c qemu:///system start --domain {{ domain_uuid }}"
  delegate_to: localhost
  register: _start
  changed_when: true
  failed_when:
    - _start.rc != 0
    - "'already active' not in (_start.stderr | default(''))"

- name: "Wait for SSH to come back on {{ inventory_hostname }}"
  ansible.builtin.wait_for_connection:
    timeout: 420
    delay: 10

# Returning at SSH also made the callers' serial:1 meaningless: all three nodes
# ended up booting their PF stacks concurrently. Skipped wherever the boot
# cannot complete while this play runs: the DB blocks on galera quorum, so it
# never reaches packetfence.target with the cluster down (A2/B2) or with no
# bootstrapped peer up yet (D4/D5). Those callers settle after quorum instead.
- import_tasks: wait_boot_settled.yml
  when: boot_wait_settled | default(true) | bool
