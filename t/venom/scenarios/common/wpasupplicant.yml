---
# tasks
- name: ensure wpasupplicant installed
  apt:
    name: wpasupplicant
    state: present
    update_cache: no

- name: Stopped wpasupplicant daemon
  service:
    name: wpa_supplicant
    state: stopped

- name: Disabled wpasupplicant daemon
  service:
    name: wpa_supplicant
    enabled: False
