---
# tasks
- name: ensure wpa_supplicant installed on EL systems
  yum:
    name: wpa_supplicant
    state: present
    update_cache: no
  when: ansible_facts['os_family'] == 'RedHat'

- name: ensure wpasupplicant installed on Deb systems
  apt:
    name: wpasupplicant
    state: present
    update_cache: no
  when: ansible_facts['os_family'] == 'Debian'

- name: Stopped wpasupplicant daemon
  service:
    name: wpa_supplicant
    state: stopped

- name: Disabled wpasupplicant daemon
  service:
    name: wpa_supplicant
    enabled: False
