# Restore configurator-passed PF state from the pretest's exportable backup
# instead of re-running the configurator suite. The CI guard lives here so a
# scenario only needs: - import_playbook: ../common/restore_pf_export.yml
- import_playbook: ../../../../addons/vagrant/playbooks/restore_pf_export.yml
  when: lookup("env", "CI") == 'true'
