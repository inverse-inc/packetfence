---
# 802.1X Wired Computer-Auth tests using VirtualSwitch
# Validates EAP-PEAP authentication with AD integration
#
# Preconditions:
# - VLAN configured on the switch
# - RADIUS configured on the switch
# - PF configured to handle 802.1x
# - Active Directory source with ServicePrincipalName configured in PF
# - PF server joined to the domain
# - Supplicant configured on the testing device (simulated by VirtualSwitch)

- import_playbook: ../common/dev.yml
  when: lookup("env", "CI") != 'true'

- import_playbook: playbooks/configure.yml

# Restore configurator-passed PF state from the pretest exportable backup
# (replaces running the configurator suite as part of this scenario).
- import_playbook: ../common/restore_pf_export.yml


- import_playbook: playbooks/run_tests.yml
