---
- hosts: pfservers
  name: Render seed templates
  become: True

  vars:
    seed_dir: "{{ venom_dir }}/test_suites/configurator_bypass/seeds"

  tasks:
    - name: Create rendered seeds directory
      file:
        path: "{{ seed_dir }}/.rendered"
        state: directory
        mode: '0755'

    - name: Render pf.conf template
      template:
        src: "{{ seed_dir }}/pf.conf.tt"
        dest: "{{ seed_dir }}/.rendered/pf.conf"
        backup: yes

    - name: Render pfconfig.conf template
      template:
        src: "{{ seed_dir }}/pfconfig.conf.tt"
        dest: "{{ seed_dir }}/.rendered/pfconfig.conf"
        backup: yes

    - name: Render networks.conf template
      template:
        src: "{{ seed_dir }}/networks.conf.tt"
        dest: "{{ seed_dir }}/.rendered/networks.conf"
        backup: yes

    - name: Render pfqueue.conf template
      template:
        src: "{{ seed_dir }}/pfqueue.conf.tt"
        dest: "{{ seed_dir }}/.rendered/pfqueue.conf"
        backup: yes

    - name: Create placeholder for fingerbank-upstream.conf
      file:
        path: "{{ seed_dir }}/.rendered/fingerbank-upstream.conf"
        state: touch
      # Note: This file will be rendered at runtime by Venom step 30
      # because the API key is fetched dynamically from psonoci

    - name: Render resolv.conf template
      template:
        src: "{{ seed_dir }}/resolv.conf.tt"
        dest: "{{ seed_dir }}/.rendered/resolv.conf"
        backup: yes

    - name: Render my.cnf template
      template:
        src: "{{ seed_dir }}/my.cnf.tt"
        dest: "{{ seed_dir }}/.rendered/my.cnf"
        backup: yes
