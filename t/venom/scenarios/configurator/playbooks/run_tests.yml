---
- hosts: pfservers
  name: Run unit tests
  become: True

  vars:
    test_suites:
      - configurator

  tasks:
    - name: Check if network-scripts directory exists
      stat:
        path: /etc/sysconfig/network-scripts/
      register: network_scripts_dir

    - name: Find all interface config files
      find:
        paths: /etc/sysconfig/network-scripts/
        patterns: "ifcfg-*"
        excludes: "ifcfg-lo,ifcfg-eth0"
      register: network_configs
      when: network_scripts_dir.stat.exists

    - name: Standardize network config
      replace:
        path: "/etc/sysconfig/network-scripts/{{ item.path | basename }}"
        regexp: '^(NM_CONTROLLED|ZONE)=.*$'
        replace: ''
      with_items: "{{ network_configs.files }}"
      when: network_scripts_dir.stat.exists

    - name: Ensure proper network configuration
      blockinfile:
        path: "/etc/sysconfig/network-scripts/{{ item.path | basename }}"
        block: |
          NM_CONTROLLED=no
          ZONE={{ (item.path | basename).replace('ifcfg-', '') }}
        marker: "# {mark} ANSIBLE MANAGED NETWORK CONFIG"
        insertafter: "^DEVICE="
        backup: yes
      with_items: "{{ network_configs.files }}"
      when: network_scripts_dir.stat.exists

    - name: Restart network services
      service:
        name: network
        state: restarted
      when: ansible_os_family == 'RedHat' and ansible_distribution_major_version|int < 8

    - name: Run Venom testsuites
      command: '{{ venom_dir }}/venom-wrapper.sh {{ venom_dir }}/test_suites/{{ item }}'
      args:
        chdir: '{{ venom_dir }}'
      loop: '{{ test_suites }}'
      vars:
        venom_wrapper_args:
          # temp, overcome Venom issue:
          # - when running test suite one by one, previous logs and results are overriden
          # Venom will create one directory per test suite to store results
          VENOM_COMMON_FLAGS: '--output-dir={{ venom_dir }}/results/{{ item }}'

      # add inventory__group_environment to Ansible environment
      # useful to make env vars available for Venom
      environment: '{{ inventory__group_environment | d({})
                       | combine(venom_wrapper_args | d({})) }}'


