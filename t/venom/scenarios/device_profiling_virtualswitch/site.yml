- import_playbook: playbooks/configure.yml

# Restore configurator-passed PF state from the pretest exportable backup
# (replaces running the configurator suite as part of this scenario).
- import_playbook: ../common/restore_pf_export.yml


- import_playbook: playbooks/run_tests.yml
