---
- hosts: pfservers
  name: Run syslog CEF tests
  become: True

  vars:
    test_suites:
      - configurator
      - global_config_virtualswitch
      - syslog_cef/setup_event_logger
      - syslog_cef/setup_syslog_fwd
      - wired_mac_auth_virtualswitch
      - syslog_cef/verify_cef_on_remote
      - syslog_cef/verify_syslog_fwd
      - syslog_cef/cleanup
      - wired_mac_auth_virtualswitch/teardown
      - global_config_virtualswitch/teardown

  tasks:
    - name: Run Venom testsuites
      command: '{{ venom_dir }}/venom-wrapper.sh {{ venom_dir }}/test_suites/{{ item }}'
      args:
        chdir: '{{ venom_dir }}'
      loop: '{{ test_suites }}'
      when: not (item == 'configurator' and lookup('env', 'SKIP_CONFIGURATOR_BAKED') == 'yes')
      vars:
        venom_wrapper_args:
          VENOM_COMMON_FLAGS: '--output-dir={{ venom_dir }}/results/{{ item }}'

      environment: '{{ inventory__group_environment | d({})
                       | combine(venom_wrapper_args | d({})) }}'
