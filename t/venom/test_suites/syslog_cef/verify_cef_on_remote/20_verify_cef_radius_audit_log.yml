name: CEF message for radius_audit_log received on linux01
testcases:

- name: grep_cef_radius
  steps:
  - type: ssh
    host: '{{.linux01_mgmt_ip}}'
    user: '{{.ssh_user}}'
    command: >
      sudo grep 'CEF:0|Inverse|PacketFence' /var/log/remote/hosts/{{.pfserver_mgmt_ip}}/syslog
      | grep 'radius_audit_log'
    retry: 12
    delay: 5
    assertions:
      - result.code ShouldEqual 0
      - result.systemout ShouldContainSubstring "radius_audit_log"
