name: Create syslog forwarder to linux01
testcases:

- name: create_syslog_forwarder
  steps:
  - type: pf_api_action
    method: POST
    url: 'config/syslog_forwarders'
    status_code: 201
    body: >-
      {
        "id": "{{.syslog_cef.syslog_forwarder_id}}",
        "type": "server",
        "host": "{{.linux01_mgmt_ip}}",
        "port": "{{.syslog_cef.syslog_remote_port}}",
        "proto": "udp",
        "logs": "ALL"
      }
