name: Cluster common setup (all nodes)
testcases:
# docs/cluster/cluster_setup.asciidoc "sysctl.conf": allow services to bind
# on non-local IPs (fast VIP failover) and disable IPv6. Applied live with
# `sysctl -p` — reboot is skipped on purpose for CI stability.
- name: sysctl_nonlocal_bind_and_disable_ipv6
  steps:
  - type: exec
    script: |
      set -e
      # enforce the exact value even if the base image pre-set a different one
      # (drop any existing line for the key, then append the wanted value)
      for kv in 'net.ipv4.ip_nonlocal_bind=1' 'net.ipv6.conf.all.disable_ipv6=1'; do
        sed -i "\#^[[:space:]]*${kv%=*}[[:space:]]*=#d" /etc/sysctl.conf
        echo "${kv%=*} = ${kv#*=}" >> /etc/sysctl.conf
      done
      sysctl -p
    assertions:
      - result.code ShouldEqual 0

# docs/cluster/cluster_setup.asciidoc "Install the database replication tools":
# Mariabackup (+ socat) is required for galera SST. Idempotent on re-runs.
- name: install_db_replication_tools
  steps:
  - type: exec
    script: |
      set -e
      if command -v apt-get >/dev/null 2>&1; then
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get -y install mariadb-backup socat
      else
        yum install -y MariaDB-backup socat --enablerepo=packetfence
      fi
    assertions:
      - result.code ShouldEqual 0
