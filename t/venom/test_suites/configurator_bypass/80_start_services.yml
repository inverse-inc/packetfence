name: Start all PacketFence services
testcases:
- name: start_support_services
  steps:
  - type: exec
    script: |
      set -e
      for service in pfqueue-backend pfqueue-go haproxy-admin packetfence-pfperl-api; do
        echo "Restarting $service..."
        systemctl restart "$service" || exit 1
      done
    assertions:
      - result.code ShouldEqual 0
    retry: 3
    delay: 5

  - type: exec
    script: sleep 5
    assertions:
      - result.code ShouldEqual 0

- name: start_pf_service
  steps:
  - type: exec
    script: /usr/local/pf/bin/pfcmd service pf start
    assertions:
      - result.code ShouldEqual 0
    retry: 3
    delay: 5

  - type: exec
    script: sleep 5
    assertions:
      - result.code ShouldEqual 0
