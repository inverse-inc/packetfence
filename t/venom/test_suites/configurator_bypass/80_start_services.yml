name: Start all PacketFence services
testcases:
- name: start_support_services
  steps:
  - type: exec
    script: |
      systemctl restart pfqueue-backend pfqueue-go haproxy-admin packetfence-pfperl-api
    assertions:
      - result.code ShouldEqual 0

  - type: exec
    script: sleep 5
    assertions:
      - result.code ShouldEqual 0

- name: start_pf_service
  steps:
  - type: exec
    script: /usr/local/pf/bin/pfcmd service pf start
    assertions:
      - result.code ShouldEqual 0

  - type: exec
    script: sleep 5
    assertions:
      - result.code ShouldEqual 0
