name: Seed configuration files (pf.conf, pfconfig.conf, networks.conf, pfqueue.conf)
testcases:
- name: seed_pf_conf
  steps:
  - type: exec
    script: |
      cp {{.venom_dir}}/test_suites/configurator_bypass/seeds/.rendered/pf.conf /usr/local/pf/conf/pf.conf
    assertions:
      - result.code ShouldEqual 0

- name: seed_pfconfig_conf
  steps:
  - type: exec
    script: |
      cp {{.venom_dir}}/test_suites/configurator_bypass/seeds/.rendered/pfconfig.conf /usr/local/pf/conf/pfconfig.conf
    assertions:
      - result.code ShouldEqual 0

- name: seed_networks_conf
  steps:
  - type: exec
    script: |
      cp {{.venom_dir}}/test_suites/configurator_bypass/seeds/.rendered/networks.conf /usr/local/pf/conf/networks.conf
    assertions:
      - result.code ShouldEqual 0

- name: seed_pfqueue_conf
  steps:
  - type: exec
    script: |
      cat {{.venom_dir}}/test_suites/configurator_bypass/seeds/.rendered/pfqueue.conf >> /usr/local/pf/conf/pfqueue.conf
    assertions:
      - result.code ShouldEqual 0
