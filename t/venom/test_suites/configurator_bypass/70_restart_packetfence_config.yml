name: Restart packetfence-config to apply seeded configuration
testcases:
- name: restart_packetfence_config
  steps:
  - type: exec
    script: systemctl restart packetfence-config
    assertions:
      - result.code ShouldEqual 0
    retry: 3
    delay: 2

  - type: exec
    script: sleep 3
    assertions:
      - result.code ShouldEqual 0
