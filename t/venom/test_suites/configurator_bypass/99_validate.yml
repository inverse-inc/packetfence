name: Validate configurator_bypass completed successfully
testcases:
- name: check_configurator_disabled
  steps:
  - type: http
    method: GET
    url: '{{.pfserver_webadmin_url}}/api/v1/configurator/config/interfaces'
    ignore_verify_ssl: true
    headers:
      "Content-Type": "application/json"
    assertions:
      - result.statuscode ShouldEqual 401
      - result.bodyjson.message ShouldContainSubstring 'The configurator is turned off'
    retry: 3
    delay: 5

- name: check_admin_account
  steps:
  - type: http
    method: POST
    url: '{{.pfserver_webadmin_url}}/api/v1/login'
    ignore_verify_ssl: true
    body: >-
      {
        "username": "{{.pfserver_default_admin_user}}",
        "password": "{{.configurator.admin.password}}"
      }
    headers:
      "Content-Type": "application/json"
    assertions:
      - result.statuscode ShouldEqual 200
      - result.bodyjson.token ShouldNotBeEmpty
    vars:
      auth_token:
        from: result.bodyjson.token

- name: check_pf_services_running
  steps:
  - type: exec
    script: /usr/local/pf/bin/pfcmd service pf status | grep -q "is running"
    assertions:
      - result.code ShouldEqual 0
