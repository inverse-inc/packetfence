name: Seed admin password using Perl one-liner
testcases:
- name: set_admin_password
  steps:
  - type: exec
    script: |
      HASH=$(perl -I/usr/local/pf/lib -Mpf::password \
        -e 'print pf::password::default_hash_password($ARGV[0])' '{{.configurator.admin.password}}')
      mysql --socket=/var/lib/mysql/mysql.sock -u {{.configurator.db.users.pf.id}} -p'{{.configurator.db.users.pf.password}}' {{.configurator.db.name}} <<EOF
      UPDATE password SET password='$HASH' WHERE pid='admin';
EOF
    assertions:
      - result.code ShouldEqual 0
