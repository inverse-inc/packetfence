name: Unplug device to trigger Accounting Stop
testcases:

- name: unplug_device
  steps:
  - type: virtualswitch_unplug_device
    api_url: '{{.virtualswitch.api.url}}'
    interface_id: '{{.pfacct_bandwidth_virtualswitch.device.interface.id}}'

- name: wait_for_accounting_stop
  steps:
  - type: sleep
    time_to_sleep: 10
