name: Plug device via virtualswitch REST API with MAB
testcases:

- name: plug_device_with_mab
  steps:
  - type: virtualswitch_plug_device
    api_url: '{{.virtualswitch.api.url}}'
    interface_id: '{{.pfacct_bandwidth_virtualswitch.device.interface.id}}'
    mac_address: '{{.pfacct_bandwidth_virtualswitch.device.mac_address}}'
    auth_method: mab
    profile: '{{.pfacct_bandwidth_virtualswitch.device.profile}}'

- name: wait_for_radius_auth
  steps:
  - type: sleep
    time_to_sleep: 10
