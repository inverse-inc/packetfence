name: First server — create galera replication user
testcases:
# docs/cluster/cluster_setup.asciidoc "Setup on the first server": create the
# replication user (both @'%' and @'localhost'). IF NOT EXISTS keeps it
# idempotent across re-runs. Credentials come from venom_local_vars.yml.
- name: create_pfcluster_user
  steps:
  - type: exec
    script: |
      mysql -u root <<'SQL'
      CREATE USER IF NOT EXISTS '{{.cluster_galera_user}}'@'%' IDENTIFIED BY '{{.cluster_galera_password}}';
      GRANT PROCESS, RELOAD, LOCK TABLES, REPLICATION CLIENT, SUPER ON *.* TO '{{.cluster_galera_user}}'@'%';
      CREATE USER IF NOT EXISTS '{{.cluster_galera_user}}'@'localhost' IDENTIFIED BY '{{.cluster_galera_password}}';
      GRANT PROCESS, RELOAD, LOCK TABLES, REPLICATION CLIENT, SUPER ON *.* TO '{{.cluster_galera_user}}'@'localhost';
      FLUSH PRIVILEGES;
      SQL
    assertions:
      - result.code ShouldEqual 0
