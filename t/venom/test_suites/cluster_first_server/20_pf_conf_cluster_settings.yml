name: First server — pf.conf / pfconfig.conf cluster settings
testcases:
# docs/cluster/cluster_setup.asciidoc "PacketFence Configuration Modification":
# append the cluster blocks to pf.conf. proxysql VIP 100.64.0.1:6033 is the
# DB endpoint; galera + webservices creds come from venom_local_vars.yml.
# NB: the doc's [advanced] configurator=disabled is intentionally omitted —
# the configurator suite already disabled it, and re-adding the key here makes
# Config::IniFiles read advanced.configurator as an ARRAY (duplicate key).
- name: append_pf_conf
  steps:
  - type: exec
    # idempotent: skip if our block is already present (heredoc EOF must stay
    # at column 0 even inside the `if`, so body/terminator are not indented).
    script: |
      if ! grep -q '^galera_replication_username' /usr/local/pf/conf/pf.conf; then
      cat >> /usr/local/pf/conf/pf.conf <<EOF

      [database]
      host={{.proxysql_bind_ip}}
      port={{.proxysql_port}}

      [active_active]
      galera_replication_username={{.cluster_galera_user}}
      galera_replication_password={{.cluster_galera_password}}

      [webservices]
      user={{.cluster_webservices_user}}
      pass={{.cluster_webservices_password}}

      [services]
      galera-autofix=disabled
      EOF
      fi
    assertions:
      - result.code ShouldEqual 0

# Same [mysql] host/port, but set key by key instead of appending the section:
# the configurator already created [mysql] (user/pass/db, no host) through
# pfappserver's Config::Pfconfig, so a `grep -q '^\[mysql\]'` guard skips the
# whole block and pfconfig.conf.defaults keeps supplying host=localhost — which
# checkup rejects as FATAL in a cluster. setval-or-newval is also re-runnable.
- name: set_pfconfig_db_endpoint
  steps:
  - type: exec
    script: |
      perl -MConfig::IniFiles -I/usr/local/pf/lib_perl/lib/perl5/ -e '
        my $c = Config::IniFiles->new(-file => "/usr/local/pf/conf/pfconfig.conf", -allowempty => 1);
        for my $kv (["host", $ARGV[0]], ["port", $ARGV[1]]) {
            $c->setval("mysql", @$kv) or $c->newval("mysql", @$kv);
        }
        $c->RewriteConfig or die "cannot rewrite pfconfig.conf";
      ' '{{.proxysql_bind_ip}}' '{{.proxysql_port}}'
      chown pf:pf /usr/local/pf/conf/pfconfig.conf
    assertions:
      - result.code ShouldEqual 0

# The shared configurator suite configures the vagrant/internet NIC as a
# dhcp-listener, so pf.conf carries an [interface eth0] section. checkup then
# demands a matching [<server> interface eth0] in cluster.conf for CLUSTER and
# every node, and a CLUSTER entry there would put a keepalived VIP on the
# libvirt management network — the runner's own SSH path. The cluster scenarios
# never exercise the dhcp-listener, so drop the section from PF's interface list
# instead; eth0 keeps its vagrant IP and its dhclient either way. pf.conf is a
# synced config store, so doing it here (before cluster/sync) propagates to the
# joiners, which is how they inherited the FATAL in the first place.
- name: remove_dhcp_listener_interface
  steps:
  - type: exec
    script: |
      set -e
      DHCPIF=$(ip -o link show | egrep -v '^1:' | grep '^{{.configurator.interfaces.dhcp_listener.index}}:' | awk -F ': ' '{print $2}' | cut -d'@' -f1 | tr -d ' ')
      perl -I/usr/local/pf/lib -I/usr/local/pf/lib_perl/lib/perl5/ -e '
        use pf::ConfigStore::Interface;
        my $cs = pf::ConfigStore::Interface->new;
        exit 0 unless $cs->hasId($ARGV[0]);
        my (undef, $removed) = $cs->remove($ARGV[0]);
        die "cannot remove interface $ARGV[0]" unless $removed;
        my ($ok, $err) = $cs->commit;
        die "cannot commit pf.conf: $err" unless $ok;
      ' "$DHCPIF"
    assertions:
      - result.code ShouldEqual 0

- name: restart_packetfence_config
  steps:
  - type: exec
    script: 'systemctl restart packetfence-config'
    assertions:
      - result.code ShouldEqual 0

# configreload warns about DB unavailability at this stage (proxysql not up
# yet) — doc says to ignore it, so we tolerate a non-zero exit.
- name: configreload_hard
  steps:
  - type: exec
    script: '/usr/local/pf/bin/pfcmd configreload hard || true'
    assertions:
      - result.code ShouldEqual 0
