name: Create autoreg security event
testcases:
- name: get_login_token
  steps:
  - type: get_login_token

# The Fingerbank data is read-only: look up the ID of the fingerprint in the
# Upstream database
- name: seed_dhcp_fingerprint
  steps:
  - type: http
    method: POST
    url: '{{.pfserver_webadmin_url}}/api/v1/fingerbank/all/dhcp_fingerprints/search'
    ignore_verify_ssl: true
    body: >-
      {
        "query": {"op": "equals", "field": "value", "value": "{{.security_event_autoreg.node.dhcp_fingerprint}}"},
        "fields": ["id", "value"],
        "limit": 1
      }
    headers:
      "Content-Type": "application/json"
      "Authorization": "{{.get_login_token.json.result.token}}"
    assertions:
      - result.statuscode ShouldEqual 200
      - result.bodyjson.items.items0.value ShouldEqual "{{.security_event_autoreg.node.dhcp_fingerprint}}"
    vars:
      id:
        from: result.bodyjson.items.items0.id

- name: create_security_event
  steps:
  - type: http
    method: POST
    url: '{{.pfserver_webadmin_url}}/api/v1/config/security_events'
    ignore_verify_ssl: true
    body: >-
      {
        "id": "{{.security_event_autoreg.event.id}}",
        "access_duration": "{{.security_event_autoreg.event.access_duration}}",
        "actions": ["autoreg", "role"],
        "desc": "{{.security_event_autoreg.event.desc}}",
        "enabled": "Y",
        "target_category": "{{.mac_auth.roles.headless_device.id}}",
        "triggers": [{
          "dhcp_fingerprint": "{{.seed_dhcp_fingerprint.id}}"
        }],
        "whitelisted_roles": []
      }
    headers:
      "Content-Type": "application/json"
      "Authorization": "{{.get_login_token.json.result.token}}"
    assertions:
      - result.statuscode ShouldEqual 201

- name: calculate_unregdate_should_be_after
  steps:
  - type: exec
    script: 'date +"%Y-%m-%dT%H:%M:%S+00:00" -d "5 days" > /tmp/calculate_unregdate_should_be_after.txt'

  
- name: clear_fingerbank_cache
  steps:
  - type: exec
    script: '/usr/local/pf/bin/pfcmd cache fingerbank clear'

