name: Create routed networks for virtualswitch VLANs
testcases:

- name: create_guest_network_vlan1
  steps:
  - type: pf_api_action
    method: POST
    url: 'config/routed_networks'
    status_code: 201
    body: >-
      {
        "id": "{{.virtualswitch.networks.guest.id}}",
        "type": "vlan-registration",
        "netmask": "{{.virtualswitch.networks.guest.netmask}}",
        "gateway": "{{.virtualswitch.networks.guest.gateway}}",
        "next_hop": "{{.virtualswitch.namespace.ip}}",
        "dhcp_start": "{{.virtualswitch.networks.guest.dhcp_start}}",
        "dhcp_end": "{{.virtualswitch.networks.guest.dhcp_end}}",
        "dhcp_default_lease_time": "{{.virtualswitch.networks.guest.dhcp_default_lease_time}}",
        "dhcp_max_lease_time": "{{.virtualswitch.networks.guest.dhcp_max_lease_time}}",
        "dns": "8.8.8.8,{{.pfserver_mgmt_ip}}",
        "pool_backend": "memory",
        "coa": "enabled"
      }

