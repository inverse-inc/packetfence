name: Create device profiling roles (windows, ios, android)
testcases:

- name: create_windows_role
  steps:
  - type: pf_api_action
    method: POST
    url: 'config/roles'
    status_code: 201
    body: >-
      {
        "id": "{{.device_profiling_virtualswitch.roles.windows.id}}",
        "max_nodes_per_pid": 0,
        "notes": "{{.device_profiling_virtualswitch.roles.windows.notes}}"
      }

