name: Delete routed networks for virtualswitch VLANs
testcases:

- name: delete_guest_network_vlan1
  steps:
  - type: pf_api_action
    method: DELETE
    url: 'config/routed_network/{{.virtualswitch.networks.guest.id}}'
    status_code: 200

