name: Stop and disable virtualswitch-namespace service
testcases:

- name: stop_virtualswitch_service
  steps:
  - type: virtualswitch_service
    action: stop
    service_name: virtualswitch-namespace

- name: disable_virtualswitch_service
  steps:
  - type: virtualswitch_service
    action: disable
    service_name: virtualswitch-namespace
