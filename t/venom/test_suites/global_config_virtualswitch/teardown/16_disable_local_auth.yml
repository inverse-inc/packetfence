name: Disable RADIUS local authentication and restore bcrypt password hashing
testcases:

- name: disable_local_auth
  steps:
  - type: pf_api_config_action
    id: "base/radius_configuration"
    method: PATCH
    body: >-
      {
        "local_auth": "disabled"
      }
    status_code: 200

- name: restore_hash_passwords_bcrypt
  steps:
  - type: pf_api_config_action
    id: "base/advanced"
    method: PATCH
    body: >-
      {
        "hash_passwords": "bcrypt"
      }
    status_code: 200

- name: restart_api_frontend_service
  steps:
  - type: pf_api_service_restart_async
    service: api-frontend
    time_to_sleep: 5

- name: restart_radiusd_auth_service
  steps:
  - type: pf_api_service_restart
    service: radiusd-auth
    time_to_sleep: 5
