name: Restart PacketFence services to apply interface configuration
testcases:

- name: restart_radiusd_auth_service
  steps:
  - type: pf_api_service_restart
    service: radiusd-auth
    time_to_sleep: 5

- name: restart_pfdhcp_service
  steps:
  - type: pf_api_service_restart
    service: pfdhcp
    time_to_sleep: 5

- name: restart_pfdhcplistener_service
  steps:
  - type: pf_api_service_restart
    service: pfdhcplistener
    time_to_sleep: 5
