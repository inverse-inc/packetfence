name: Plug device via virtualswitch REST API with MAB (Inheritance3, inherit_vlan disabled on Inheritance2)
testcases:

- name: plug_device_with_mab
  steps:
  - type: virtualswitch_plug_device
    api_url: '{{.virtualswitch.api.url}}'
    interface_id: '{{.vlan_inheritance_virtualswitch.device.interface.id}}'
    mac_address: '{{.vlan_inheritance_virtualswitch.device.mac_address}}'
    auth_method: mab
    profile: '{{.vlan_inheritance_virtualswitch.device.profile}}'

- name: wait_for_radius_auth
  steps:
  - type: sleep
    time_to_sleep: 10
