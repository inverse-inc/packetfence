name: Remove Inheritance2 VLAN from switch group
testcases:

- name: remove_inheritance2_vlan_from_switch_group
  steps:
  - type: pf_api_action
    method: PATCH
    url: 'config/switch_group/{{.virtualswitch_switch_group.id}}'
    status_code: 200
    body: >-
      {
        "{{.vlan_inheritance_virtualswitch.roles.inheritance2.id}}Vlan": ""
      }
