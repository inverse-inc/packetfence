name: Remove Inheritance VLANs from switch group (undo Phase 1+2 changes)
testcases:

- name: remove_inheritance_vlans_from_switch_group
  steps:
  - type: pf_api_action
    method: PATCH
    url: 'config/switch_group/{{.virtualswitch_switch_group.id}}'
    status_code: 200
    body: >-
      {
        "{{.vlan_inheritance_virtualswitch.roles.inheritance1.id}}Vlan": "",
        "{{.vlan_inheritance_virtualswitch.roles.inheritance2.id}}Vlan": ""
      }
