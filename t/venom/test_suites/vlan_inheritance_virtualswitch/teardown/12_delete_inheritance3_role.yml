name: Delete Inheritance3 role (child must be deleted before parent)
testcases:
- name: get_login_token
  steps:
  - type: get_login_token

- name: delete_inheritance3_role
  steps:
  - type: http
    method: DELETE
    url: '{{.pfserver_webadmin_url}}/api/v1/config/role/{{.vlan_inheritance_virtualswitch.roles.inheritance3.id}}'
    ignore_verify_ssl: true
    headers:
      "Authorization": "{{.get_login_token.result.token}}"
      "Content-Type": "application/json"
    assertions:
      - result.statuscode ShouldEqual 200
