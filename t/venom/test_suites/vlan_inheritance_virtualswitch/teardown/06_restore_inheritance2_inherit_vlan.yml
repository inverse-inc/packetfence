name: Restore inherit_vlan=enabled on Inheritance2 role (undo Phase 3 change)
testcases:

- name: restore_inherit_vlan_on_inheritance2
  steps:
  - type: pf_api_action
    method: PATCH
    url: 'config/role/{{.vlan_inheritance_virtualswitch.roles.inheritance2.id}}'
    status_code: 200
    body: >-
      {
        "inherit_vlan": "true"
      }
