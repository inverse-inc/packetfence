name: Verify Inheritance3 gets no VLAN (inheritance chain broken at Inheritance2)
testcases:

- name: check_device_vlan_is_native
  steps:
  - type: virtualswitch_device_status
    api_url: '{{.virtualswitch.api.url}}'
    interface_id: '{{.vlan_inheritance_virtualswitch.device.interface.id}}'
    retry: 5
    delay: 3
    assertions:
      - result.virtualswitch_device_status__port_state ShouldEqual authenticated
      - result.virtualswitch_device_status__vlan_assigned ShouldEqual {{.vlan_inheritance_virtualswitch.vlan.native}}
