name: Create inheritance roles (Inheritance1, Inheritance2, Inheritance3)
testcases:

- name: create_inheritance1_role
  steps:
  - type: pf_api_action
    method: POST
    url: 'config/roles'
    status_code: 201
    body: >-
      {
        "id": "{{.vlan_inheritance_virtualswitch.roles.inheritance1.id}}",
        "max_nodes_per_pid": 0,
        "notes": "{{.vlan_inheritance_virtualswitch.roles.inheritance1.notes}}",
        "inherit_vlan": "disabled"
      }

- name: create_inheritance2_role
  steps:
  - type: pf_api_action
    method: POST
    url: 'config/roles'
    status_code: 201
    body: >-
      {
        "id": "{{.vlan_inheritance_virtualswitch.roles.inheritance2.id}}",
        "max_nodes_per_pid": 0,
        "notes": "{{.vlan_inheritance_virtualswitch.roles.inheritance2.notes}}",
        "inherit_vlan": "enabled",
        "parent_id": "{{.vlan_inheritance_virtualswitch.roles.inheritance1.id}}"
      }

- name: create_inheritance3_role
  steps:
  - type: pf_api_action
    method: POST
    url: 'config/roles'
    status_code: 201
    body: >-
      {
        "id": "{{.vlan_inheritance_virtualswitch.roles.inheritance3.id}}",
        "max_nodes_per_pid": 0,
        "notes": "{{.vlan_inheritance_virtualswitch.roles.inheritance3.notes}}",
        "inherit_vlan": "enabled",
        "parent_id": "{{.vlan_inheritance_virtualswitch.roles.inheritance2.id}}"
      }
