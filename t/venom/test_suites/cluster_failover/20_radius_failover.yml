name: RADIUS failover — mgmt VIP migrates when radiusd-load_balancer dies
testcases:
# The mgmt/radius vrrp_instance tracks radius_load_balancer. Killing it on pf1
# trips the track_script (fall 2 / interval 5) so keepalived drops that
# instance's priority and the mgmt VIP moves to pf2. The reg/iso (portal) VIPs
# track haproxy_portal instead, so they must stay on pf1 — this asserts the
# failover is scoped to the radius-tracked VIP.
- name: baseline_pf1_holds_mgmt_vip
  steps:
  - type: exec
    script: 'ip -o -4 addr show | grep -qw {{.cluster_ip_mgmt}}'
    assertions:
      - result.code ShouldEqual 0

- name: stop_radiusd_load_balancer_on_pf1
  steps:
  - type: exec
    script: '/usr/local/pf/bin/pfcmd service radiusd-load_balancer stop || true'
    assertions:
      - result.code ShouldEqual 0

- name: mgmt_vip_migrates_to_pf2
  steps:
  - type: exec
    script: "ssh pf2 'ip -o -4 addr show | grep -qw {{.cluster_ip_mgmt}}'"
    retry: 12
    delay: 5
    assertions:
      - result.code ShouldEqual 0

- name: mgmt_vip_gone_from_pf1
  steps:
  - type: exec
    script: 'ip -o -4 addr show | grep -qw {{.cluster_ip_mgmt}}'
    assertions:
      - result.code ShouldNotEqual 0

- name: reg_iso_vips_stay_on_pf1
  steps:
  - type: exec
    script: 'ip -o -4 addr show | grep -qw {{.cluster_ip_reg}}'
    assertions:
      - result.code ShouldEqual 0
  - type: exec
    script: 'ip -o -4 addr show | grep -qw {{.cluster_ip_iso}}'
    assertions:
      - result.code ShouldEqual 0

- name: restart_radiusd_load_balancer_on_pf1
  steps:
  - type: exec
    script: '/usr/local/pf/bin/pfcmd service radiusd-load_balancer restart || true'
    assertions:
      - result.code ShouldEqual 0

- name: mgmt_vip_preempts_back_to_pf1
  steps:
  - type: exec
    script: 'ip -o -4 addr show | grep -qw {{.cluster_ip_mgmt}}'
    retry: 24
    delay: 5
    assertions:
      - result.code ShouldEqual 0
