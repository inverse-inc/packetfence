name: Failover preconditions — normalize cluster to pf1-master
testcases:
# Self-heal any state a previously aborted failover run left behind: make sure
# every failover-relevant service is up on all three nodes, then wait until pf1
# (keepalived priority 100) has preempted every VIP back. This makes the whole
# cluster_failover suite safe to re-run.
- name: start_services_on_pf1
  steps:
  - type: exec
    script: |
      for s in keepalived radiusd-load_balancer haproxy-portal httpd.portal pfdhcp pfcron; do
        /usr/local/pf/bin/pfcmd service $s start || true
      done
    assertions:
      - result.code ShouldEqual 0

- name: start_services_on_peers
  steps:
  - type: exec
    script: |
      for n in pf2 pf3; do
        ssh $n 'for s in keepalived radiusd-load_balancer haproxy-portal httpd.portal pfdhcp pfcron; do /usr/local/pf/bin/pfcmd service $s start || true; done'
      done
    assertions:
      - result.code ShouldEqual 0

- name: pf1_holds_mgmt_vip
  steps:
  - type: exec
    script: 'ip -o -4 addr show | grep -qw {{.cluster_ip_mgmt}}'
    retry: 30
    delay: 5
    assertions:
      - result.code ShouldEqual 0

- name: pf1_holds_reg_vip
  steps:
  - type: exec
    script: 'ip -o -4 addr show | grep -qw {{.cluster_ip_reg}}'
    retry: 12
    delay: 5
    assertions:
      - result.code ShouldEqual 0

- name: pf1_holds_iso_vip
  steps:
  - type: exec
    script: 'ip -o -4 addr show | grep -qw {{.cluster_ip_iso}}'
    retry: 12
    delay: 5
    assertions:
      - result.code ShouldEqual 0
