name: httpd.portal failover — portal stays served via peer backends
testcases:
# httpd.portal is NOT keepalived-tracked, so stopping it does not move a VIP.
# haproxy-portal (still on pf1, holding the reg VIP) load-balances the portal
# across every node's httpd_portal backend (:8080, health-checked). With pf1's
# backend down, haproxy marks it down (fastinter 2s) and routes to pf2/pf3, so
# the portal keeps answering on the VIP. A 503 would mean every backend is down;
# 000 would mean the VIP itself is unreachable — both are failures here.
- name: portal_served_before
  steps:
  - type: exec
    script: 'curl -sk --max-time 10 -o /dev/null -w "%{http_code}" https://{{.cluster_ip_reg}}/'
    retry: 6
    delay: 5
    assertions:
      - result.systemout ShouldNotEqual 503
      - result.systemout ShouldNotEqual 000

- name: stop_httpd_portal_on_pf1
  steps:
  - type: exec
    script: '/usr/local/pf/bin/pfcmd service httpd.portal stop || true'
    assertions:
      - result.code ShouldEqual 0

- name: reg_vip_stays_on_pf1
  steps:
  - type: exec
    script: 'ip -o -4 addr show | grep -qw {{.cluster_ip_reg}}'
    assertions:
      - result.code ShouldEqual 0

- name: portal_still_served_via_peers
  steps:
  - type: exec
    script: 'curl -sk --max-time 10 -o /dev/null -w "%{http_code}" https://{{.cluster_ip_reg}}/'
    retry: 12
    delay: 5
    assertions:
      - result.systemout ShouldNotEqual 503
      - result.systemout ShouldNotEqual 000

- name: restart_httpd_portal_on_pf1
  steps:
  - type: exec
    script: '/usr/local/pf/bin/pfcmd service httpd.portal restart || true'
    assertions:
      - result.code ShouldEqual 0

- name: portal_served_after_restore
  steps:
  - type: exec
    script: 'curl -sk --max-time 10 -o /dev/null -w "%{http_code}" https://{{.cluster_ip_reg}}/'
    retry: 12
    delay: 5
    assertions:
      - result.systemout ShouldNotEqual 503
      - result.systemout ShouldNotEqual 000
