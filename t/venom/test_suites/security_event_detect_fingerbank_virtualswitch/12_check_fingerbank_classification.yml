name: Verify Fingerbank classified device as Windows
testcases:

- name: check_device_class
  steps:
  - type: pf_api_node_action
    method: GET
    id: '{{.security_event_detect_fingerbank_virtualswitch.device.mac_address}}'
    status_code: 200
    retry: 12
    delay: 10
    assertions:
      - result.pf_api_node_action_json.item.device_class ShouldNotBeEmpty
      - result.pf_api_node_action_json.item.device_manufacturer ShouldEqual Microsoft
