name: Create security event with MAC trigger and delay_by for delayed enforcement
testcases:
- name: get_login_token
  steps:
  - type: get_login_token

- name: create_security_event
  steps:
  - type: http
    method: POST
    url: '{{.pfserver_webadmin_url}}/api/v1/config/security_events'
    ignore_verify_ssl: true
    body: >-
      {
        "id": "{{.security_event_delayed_virtualswitch.event.id}}",
        "desc": "{{.security_event_delayed_virtualswitch.event.desc}}",
        "enabled": "true",
        "actions": ["reevaluate_access"],
        "vlan": "{{.security_event_delayed_virtualswitch.event.vlan}}",
        "triggers": [{"{{.security_event_delayed_virtualswitch.event.trigger_type}}": "{{.security_event_delayed_virtualswitch.event.trigger_value}}"}],
        "delay_by": {
          "interval": "{{.security_event_delayed_virtualswitch.event.delay_by_interval}}",
          "unit": "{{.security_event_delayed_virtualswitch.event.delay_by_unit}}"
        },
        "max_enable": "{{.security_event_delayed_virtualswitch.event.max_enable}}",
        "auto_enable": "true",
        "priority": 1
      }
    headers:
      "Authorization": "{{.get_login_token.result.token}}"
      "Content-Type": "application/json"
    assertions:
      - result.statuscode ShouldEqual 201
