name: Wait for bandwidth to exceed 500KB threshold
testcases:

- name: wait_for_bandwidth_accumulation
  steps:
  - type: exec
    script: |
      mysql -u{{.configurator.db.users.pf.id}} -p{{.configurator.db.users.pf.password}} {{.configurator.db.name}} -N -e \
        "SELECT COALESCE(SUM(in_bytes),0) + COALESCE(SUM(out_bytes),0) as total_bytes FROM bandwidth_accounting WHERE mac = '{{.security_event_acct_virtualswitch.device.mac_address}}'"
    retry: 15
    delay: 5
    assertions:
      - result.code ShouldEqual 0
      - result.systemout ShouldBeGreaterThan 512000
