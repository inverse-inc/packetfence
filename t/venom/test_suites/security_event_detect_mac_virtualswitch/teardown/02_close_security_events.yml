name: Close any remaining open security events
testcases:
- name: get_login_token
  steps:
  - type: get_login_token

- name: close_remaining_events
  steps:
  - type: http
    method: POST
    url: '{{.pfserver_webadmin_url}}/api/v1/nodes/bulk_close_security_events'
    ignore_verify_ssl: true
    body: >-
      {
        "items": ["{{.security_event_detect_mac_virtualswitch.device.mac_address}}"]
      }
    headers:
      "Authorization": "{{.get_login_token.result.token}}"
      "Content-Type": "application/json"
    assertions:
      - result.statuscode ShouldEqual 200
