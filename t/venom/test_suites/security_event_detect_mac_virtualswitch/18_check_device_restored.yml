name: Verify device on normal VLAN after trigger removed
testcases:

- name: check_device_on_normal_vlan
  steps:
  - type: virtualswitch_device_status
    api_url: '{{.virtualswitch.api.url}}'
    interface_id: '{{.security_event_detect_mac_virtualswitch.device.interface.id}}'
    retry: 15
    delay: 5
    assertions:
      - result.virtualswitch_device_status__port_state ShouldEqual authenticated
      - result.virtualswitch_device_status__vlan_assigned ShouldEqual {{.security_event_detect_mac_virtualswitch.vlan.normal}}
