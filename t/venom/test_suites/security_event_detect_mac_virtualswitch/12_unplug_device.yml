name: Unplug device before removing security event config
testcases:

- name: unplug_device
  steps:
  - type: virtualswitch_unplug_device
    api_url: '{{.virtualswitch.api.url}}'
    interface_id: '{{.security_event_detect_mac_virtualswitch.device.interface.id}}'

- name: wait_for_session_cleanup
  steps:
  - type: sleep
    time_to_sleep: 5
