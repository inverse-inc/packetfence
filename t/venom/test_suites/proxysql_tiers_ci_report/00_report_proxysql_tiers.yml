name: CI-ONLY - report what the ProxySQL tiers carried during the scenario
# CI-ONLY (revert before merge). Informational: prints per-tier traffic and
# connection errors into the venom log. It only fails if ProxySQL is gone.
testcases:
- name: per_tier_traffic
  steps:
  - type: exec
    script: |
      mysql -h 100.64.0.1 -P 6032 -uadministrator -padmin -t -e \
        "SELECT hostgroup, srv_host, status, ConnUsed, ConnFree, ConnOK, ConnERR, MaxConnUsed, Queries
           FROM stats_mysql_connection_pool ORDER BY hostgroup;
         SELECT rule_id, hits FROM stats_mysql_query_rules WHERE rule_id BETWEEN 21 AND 24 ORDER BY rule_id;
         SELECT hostgroup, SUM(count_star) AS queries, MAX(max_time) AS max_us
           FROM stats_mysql_query_digest GROUP BY hostgroup ORDER BY hostgroup;
         SELECT hostgroup, count_star, max_time, substr(digest_text,1,120) AS digest
           FROM stats_mysql_query_digest ORDER BY max_time DESC LIMIT 15;
         SELECT * FROM stats_mysql_errors ORDER BY count_star DESC LIMIT 20;"
    assertions:
      - result.code ShouldEqual 0
