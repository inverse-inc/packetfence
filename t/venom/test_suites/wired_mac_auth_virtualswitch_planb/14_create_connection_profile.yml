name: Create wired MAC auth connection profile
testcases:

- name: create_wired_mac_auth_connection_profile
  steps:
  - type: pf_api_connection_profiles_create
    id: '{{.wired_mac_auth_virtualswitch_planb.profiles.wired.id}}'
    description: '{{.wired_mac_auth_virtualswitch_planb.profiles.wired.description}}'
    status: enabled
    filter_connection_type: '{{.wired_mac_auth_virtualswitch_planb.profiles.wired.filters.connection_type}}'
    unreg_on_acct_stop: '{{.wired_mac_auth_virtualswitch_planb.profiles.wired.unreg_on_acct_stop}}'
