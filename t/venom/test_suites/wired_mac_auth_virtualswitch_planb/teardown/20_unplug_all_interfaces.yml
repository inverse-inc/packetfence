name: Unplug any remaining devices on all interfaces (cleanup)
testcases:

- name: unplug_interface_1
  steps:
  - type: http
    method: POST
    url: '{{.virtualswitch_planb.api.url}}/api/v1/interfaces/1/unplug'
    assertions:
      - result.statuscode ShouldBeIn 200 204 404

