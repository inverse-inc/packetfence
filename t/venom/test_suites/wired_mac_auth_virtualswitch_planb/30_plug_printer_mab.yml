name: Plug printer device via virtualswitch API (hp-printer profile)
testcases:

- name: plug_printer_with_mab
  steps:
  - type: http
    method: POST
    url: '{{.virtualswitch_planb.api.url}}/api/v1/interfaces/{{.virtualswitch_planb.printer.interface.id}}/plug'
    body: >-
      {
        "mac_address": "{{.virtualswitch_planb.printer.mac_address}}",
        "auth_method": "mab",
        "profile": "{{.virtualswitch_planb.printer.profile}}"
      }
    headers:
      Content-Type: application/json
    assertions:
      - result.statuscode ShouldBeIn 200 201

- name: wait_for_printer_radius_auth
  steps:
  - type: sleep
    time_to_sleep: 10
