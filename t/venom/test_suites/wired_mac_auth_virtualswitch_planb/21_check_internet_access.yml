name: Check internet access from virtualswitch01 VM
testcases:

- name: check_internet_access
  steps:
  - type: ssh
    host: '{{.virtualswitch01_mgmt_ip}}'
    user: '{{.ssh_user}}'
    command: 'curl -s -o /dev/null -w "%{http_code}" {{.network_detection_url}}'
    retry: 5
    delay: 2
    assertions:
      - result.code ShouldEqual 0
      - result.systemout ShouldEqual "200"
