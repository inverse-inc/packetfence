name: Create virtualswitch switch group with VLAN mappings
testcases:

- name: create_virtualswitch_switch_group
  steps:
  - type: pf_api_action
    method: POST
    url: 'config/switch_groups'
    status_code: 201
    body: >-
      {
        "id": "{{.virtualswitch_planb_switch_group.id}}",
        "description": "{{.virtualswitch_planb_switch_group.description}}",
        "radiusSecret": "{{.virtualswitch_planb_switch_group.radiusSecret}}",
        "type": "{{.virtualswitch_planb_switch.type}}",
        "{{.wired_mac_auth_virtualswitch_planb.roles.headless_device.id}}Vlan": "{{.wired_mac_auth_virtualswitch_planb.roles.headless_device.vlan_id}}",
        "{{.wired_mac_auth_virtualswitch_planb.roles.printer.id}}Vlan": "{{.wired_mac_auth_virtualswitch_planb.roles.printer.vlan_id}}"
      }
