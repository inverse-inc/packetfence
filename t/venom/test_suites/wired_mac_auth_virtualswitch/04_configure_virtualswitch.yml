name: Configure virtualswitch
testcases:

  - name: deploy_virtualswitch_config
    steps:
    - type: virtualswitch_config_deploy
      config_dir: "/etc/virtualswitch"
      interfaces: "5"
      switch_type: "cisco"
      network_mapping: "10.99.0.0"
      radius_ip: '{{.virtualswitch.radius.ip}}'
      radius_port: '{{.virtualswitch.radius.port}}'
      radius_secret: '{{.virtualswitch.radius.secret}}'
      accounting_interval: "60"
      reauth_interval: "0"
      auth_retry_interval: "30"

  - name: verify_virtualswitch_config_exists
    steps:
    - type: exec
      script: test -f /etc/virtualswitch/config.yaml
      assertions:
        - result.code ShouldEqual 0
