name: Create node with specified MAC and role headless_device
testcases:

- name: get_category_id_of_role
  steps:
  - type: pf_api_action
    method: POST
    url: 'node_categories/search'
    status_code: 200
    body: >-
      {
        "cursor": 0,
        "fields": ["category_id"],
        "limit": 10,
        "query": {
          "op": "and",
          "values": [
            {
              "op": "or",
              "values": [
                {
                  "field": "name",
                  "op": "equals",
                  "value": "{{.wired_mac_auth_virtualswitch.roles.headless_device.id}}"
                }
              ]
            }
          ]
        }
      }
    vars:
      category_id:
        from: result.pf_api_action_.items.items0.category_id

- name: create_node
  steps:
  - type: pf_api_action
    method: POST
    url: 'nodes'
    status_code: 201
    body: >-
      {
        "category_id": "{{.get_category_id_of_role.category_id}}",
        "mac": "{{.virtualswitch.device.mac_address}}",
        "notes": "virtualswitch test node",
        "pid": null,
        "status": "reg",
        "unreg_date": null,
        "unregdate": null
      }
