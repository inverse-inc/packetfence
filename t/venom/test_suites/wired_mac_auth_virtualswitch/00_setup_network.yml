name: Setup virtualswitch network (veth pair)
testcases:

  - name: create_veth_pair_and_configure
    steps:
    - type: virtualswitch_veth_create
      host_interface: '{{.virtualswitch.veth.host}}'
      ns_interface: '{{.virtualswitch.veth.ns}}'
      host_ip: '{{.virtualswitch.registration.ip}}'
      ns_ip: '{{.virtualswitch.namespace.ip}}'
      netmask_cidr: "24"

  - name: verify_veth_pair_connectivity
    steps:
    - type: exec
      script: ping -c 1 -W 2 {{.virtualswitch.namespace.ip}}
      assertions:
        - result.code ShouldEqual 0
