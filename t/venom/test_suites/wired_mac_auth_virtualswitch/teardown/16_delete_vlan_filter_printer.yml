name: Delete printer VLAN filter
testcases:
- name: get_login_token
  steps:
  - type: get_login_token

- name: delete_printer_vlan_filter
  steps:
  - type: http
    method: DELETE
    url: '{{.pfserver_webadmin_url}}/api/v1/config/filter_engines/vlan_filter/{{.wired_mac_auth_virtualswitch.vlan_filter.printer.id}}'
    ignore_verify_ssl: true
    headers:
      "Authorization": "{{.get_login_token.result.token}}"
      "Content-Type": "application/json"
    assertions:
      - result.statuscode ShouldEqual 200
