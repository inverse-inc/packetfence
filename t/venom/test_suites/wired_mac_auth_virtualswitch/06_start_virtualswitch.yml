name: Start virtualswitch-namespace service
testcases:

  - name: start_virtualswitch_namespace_service
    steps:
    - type: virtualswitch_service
      action: start
      service_name: virtualswitch-namespace

  - name: wait_for_virtualswitch_to_start
    steps:
    - type: sleep
      time_to_sleep: 5

  - name: verify_virtualswitch_service_running
    steps:
    - type: virtualswitch_service_status
      service_name: virtualswitch-namespace
      expected_status: active

  - name: verify_virtualswitch_api_responding
    steps:
    - type: virtualswitch_api_status
      api_url: '{{.virtualswitch.api.url}}'
      expected_code: "200"
      retry: 3
      delay: 2
