name: Verify printer node has printer category
testcases:

- name: check_printer_node_category
  steps:
  - type: pf_api_node_action
    method: GET
    id: '{{.virtualswitch.printer.mac_address}}'
    status_code: 200
    assertions:
      - result.pf_api_node_action_json.item.category ShouldEqual {{.wired_mac_auth_virtualswitch.roles.printer.id}}
