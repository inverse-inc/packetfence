name: Create connection profile for 802.1X authentication
testcases:
- name: get_login_token
  steps:
  - type: get_login_token

- name: create_dot1x_connection_profile
  steps:
  - type: http
    method: POST
    url: '{{.pfserver_webadmin_url}}/api/v1/config/connection_profiles'
    ignore_verify_ssl: true
    body: >-
      {
        "advanced_filter": null,
        "description": "{{.dot1x_wired_computer_auth_virtualswitch.profiles.wired.description}}",
        "filter": [
          {
            "type": "connection_type",
            "match": "{{.dot1x_wired_computer_auth_virtualswitch.profiles.wired.filters.connection_type}}"
          }
        ],
        "filter_match_style": "all",
        "id": "{{.dot1x_wired_computer_auth_virtualswitch.profiles.wired.id}}",
        "locale": null,
        "login_attempt_limit": 0,
        "logo": null,
        "preregistration": null,
        "redirecturl": null,
        "reuse_dot1x_credentials": "false",
        "root_module": "default_policy",
        "self_service": null,
        "sources": null,
        "status": "enabled",
        "unreg_on_acct_stop": "{{.dot1x_wired_computer_auth_virtualswitch.profiles.wired.unreg_on_acct_stop}}",
        "vlan_pool_technique": null
      }
    headers:
      "Authorization": "{{.get_login_token.result.token}}"
      "Content-Type": "application/json"
    assertions:
      - result.statuscode ShouldEqual 201
