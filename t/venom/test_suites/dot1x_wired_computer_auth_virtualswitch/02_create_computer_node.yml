name: Create computer node for 802.1X Wired Computer-Auth test
testcases:
- name: get_login_token
  steps:
  - type: get_login_token

- name: create_computer_node
  steps:
  - type: http
    method: POST
    url: '{{.pfserver_webadmin_url}}/api/v1/nodes'
    ignore_verify_ssl: true
    body: >-
      {
        "category_id": null,
        "mac": "{{.virtualswitch.dot1x.computer.mac_address}}",
        "notes": "802.1X Wired Computer-Auth test node",
        "pid": null,
        "status": "reg",
        "unreg_date": null,
        "unregdate": null
      }
    headers:
      "Authorization": "{{.get_login_token.result.token}}"
      "Content-Type": "application/json"
    assertions:
      - result.statuscode ShouldEqual 201
