name: Joiner interface config (registration + isolation OS IPs)
# docs/cluster/cluster_setup.asciidoc "Other servers": each cluster node must
# have its reg/iso IPs configured on its interfaces at the OS level. pf1 gets
# this from the full configurator; the joiners only cluster/sync, so without
# this step their eth reg/iso interfaces stay IP-less and keepalived parks the
# portal VRRP instances in FAULT (portal VIP can never fail over to a backup).
# Same interface PATCHes as configurator/10_run_configurator_step1.yml, reg+iso
# only (mgmt already has its IP from vagrant; PF config arrives later via sync).
testcases:
# The freshly booted joiner's configurator API (haproxy-admin -> pfperl-api)
# takes a while to warm up and returns 504 until it does. Poll it once here so
# the interface PATCHes below run against an already-warm API.
- name: wait_for_configurator_api
  steps:
  - type: http
    method: GET
    url: '{{.pfserver_webadmin_url}}/api/v1/configurator/config/interfaces'
    ignore_verify_ssl: true
    retry: 30
    delay: 10
    assertions:
      - result.statuscode ShouldEqual 200

- name: get_name_of_reg_int
  steps:
  - type: exec
    script: "ip -o link show | egrep -v '^1:' | grep '^{{.configurator.interfaces.reg.index}}:' | awk -F ': ' '{print $2;}'"
    vars:
      reg_interface:
        from: result.systemout

# workaround for Debian Vagrant box: interfaces are down if they don't have an IP
- name: bounce_registration_int
  steps:
  - type: exec
    script: "ip link set dev {{.get_name_of_reg_int.reg_interface}} up"

- name: configure_registration_int
  steps:
  - type: http
    method: PATCH
    url: '{{.pfserver_webadmin_url}}/api/v1/configurator/config/interface/{{.get_name_of_reg_int.reg_interface}}'
    ignore_verify_ssl: true
    body: >-
      {
        "ipaddress": "{{.configurator.interfaces.reg.ip}}",
        "netmask": "{{.configurator.interfaces.reg.netmask}}",
        "type": "vlan-registration",
        "dhcpd_enabled": "{{.configurator.interfaces.reg.dhcpd_enabled}}"
      }
    headers:
      "Content-Type": "application/json"
    # First configurator API call on a freshly booted joiner: haproxy-admin ->
    # pfperl-api backend may not be warm yet and return 504. Retry so it
    # self-heals (idempotent PATCH); matches configurator/00_*. A hard failure
    # here would drop the joiner from the run and leave a size-2 cluster.
    retry: 6
    delay: 10
    assertions:
      - result.statuscode ShouldEqual 200

- name: get_name_of_iso_int
  steps:
  - type: exec
    script: "ip -o link show | egrep -v '^1:' | grep '^{{.configurator.interfaces.iso.index}}:' | awk -F ': ' '{print $2;}'"
    vars:
      iso_interface:
        from: result.systemout

# workaround for Debian Vagrant box: interfaces are down if they don't have an IP
- name: bounce_isolation_int
  steps:
  - type: exec
    script: "ip link set dev {{.get_name_of_iso_int.iso_interface}} up"

- name: configure_isolation_int
  steps:
  - type: http
    method: PATCH
    url: '{{.pfserver_webadmin_url}}/api/v1/configurator/config/interface/{{.get_name_of_iso_int.iso_interface}}'
    ignore_verify_ssl: true
    body: >-
      {
        "ipaddress": "{{.configurator.interfaces.iso.ip}}",
        "netmask": "{{.configurator.interfaces.iso.netmask}}",
        "type": "vlan-isolation",
        "dhcpd_enabled": "{{.configurator.interfaces.iso.dhcpd_enabled}}"
      }
    headers:
      "Content-Type": "application/json"
    retry: 6
    delay: 10
    assertions:
      - result.statuscode ShouldEqual 200

# necessary for EL to apply IP addresses on interfaces not configured before;
# | true so it's a no-op on Debian (no NetworkManager)
- name: restart_network_manager
  steps:
  - type: exec
    script: "systemctl restart NetworkManager | true"
