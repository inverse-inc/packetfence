name: Plug Windows device via virtualswitch API (windows11 profile)
testcases:

- name: plug_windows_with_mab
  steps:
  - type: virtualswitch_plug_device
    api_url: '{{.virtualswitch.api.url}}'
    interface_id: '{{.virtualswitch.windows.interface.id}}'
    mac_address: '{{.virtualswitch.windows.mac_address}}'
    auth_method: mab
    profile: '{{.virtualswitch.windows.profile}}'

- name: wait_for_windows_radius_auth
  retry: 12
  delay: 10
  steps:
  - type: virtualswitch_device_status
    api_url: '{{.virtualswitch.api.url}}'
    interface_id: '{{.virtualswitch.windows.interface.id}}'
    assertions:
      - result.virtualswitch_device_status__port_state ShouldEqual authenticated
