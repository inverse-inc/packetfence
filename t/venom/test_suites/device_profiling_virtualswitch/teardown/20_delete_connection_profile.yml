name: Delete device profiling connection profile
testcases:
- name: get_login_token
  steps:
  - type: get_login_token

- name: delete_connection_profile
  steps:
  - type: http
    method: DELETE
    url: '{{.pfserver_webadmin_url}}/api/v1/config/connection_profile/{{.device_profiling_virtualswitch.profiles.wired.id}}'
    ignore_verify_ssl: true
    headers:
      "Authorization": "{{.get_login_token.result.token}}"
      "Content-Type": "application/json"
    assertions:
      - result.statuscode ShouldBeIn 200 404
