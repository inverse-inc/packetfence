executor: virtualswitch_config_deploy
input:
  config_dir: "/etc/virtualswitch"
  interfaces: "5"
  switch_type: "cisco"
  network_mapping: "10.99.0.0"
  radius_ip: "10.99.99.1"
  radius_port: "1812"
  radius_secret: "testing123"
  accounting_interval: "60"
  reauth_interval: "0"
  auth_retry_interval: "30"
steps:
- type: exec
  script: mkdir -p {{.input.config_dir}}
  assertions:
    - result.code ShouldEqual 0

- type: exec
  script: |
    cat > {{.input.config_dir}}/config.yaml << 'EOFCONFIG'
    interfaces: {{.input.interfaces}}
    switch_type: {{.input.switch_type}}
    network_mapping: "{{.input.network_mapping}}"
    radius:
      ip: {{.input.radius_ip}}
      port: {{.input.radius_port}}
      secret: {{.input.radius_secret}}
      accounting_interval_seconds: {{.input.accounting_interval}}
      reauth_interval_seconds: {{.input.reauth_interval}}
      auth_retry_interval_seconds: {{.input.auth_retry_interval}}
    dhcp:
      enabled: false
    ipfix:
      enabled: false
    scep:
      enabled: false
    wireless:
      ssid: "TestWiFi"
      switch_mac: "aa:bb:cc:dd:ee:ff"
    device_state:
      auto_save: false
    interface_types:
      - id: 1
        type: "ethernet"
      - id: 2
        type: "ethernet"
      - id: 3
        type: "ethernet"
      - id: 4
        type: "ethernet"
      - id: 5
        type: "ethernet"
    vlans:
      - id: 2
        interfaces: [1,2,3,4,5]
      - id: 100
        interfaces: [1,2,3,4,5]
      - id: 200
        interfaces: [1,2,3,4,5]
    EOFCONFIG
  assertions:
    - result.code ShouldEqual 0
output:
  virtualswitch_config_path: "{{.input.config_dir}}/config.yaml"
