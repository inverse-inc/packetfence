executor: virtualswitch_service_status
input:
  service_name: "virtualswitch-namespace"
  expected_status: "active"
steps:
- type: exec
  script: systemctl is-active {{.input.service_name}}
  assertions:
    - result.code ShouldEqual 0
    - result.systemout ShouldEqual {{.input.expected_status}}
output:
  virtualswitch_service_status: "{{.result.systemout}}"
