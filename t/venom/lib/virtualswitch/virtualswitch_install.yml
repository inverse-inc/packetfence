executor: virtualswitch_install
input:
  package_name: "virtualswitch"
steps:
- type: exec
  script: |
    if command -v dnf &> /dev/null; then
      dnf install -y {{.input.package_name}}
    elif command -v apt-get &> /dev/null; then
      apt-get update && apt-get install -y {{.input.package_name}}
    else
      echo "Unsupported package manager"
      exit 1
    fi
  assertions:
    - result.code ShouldEqual 0
