executor: virtualswitch_install
input:
  package_name: "virtualswitch"
  deb_version: ""
steps:
- type: exec
  script: |
    # Get authentication credentials from GitLab CI environment variables
    VIRTUALSWITCH_USER="${CI_VIRTUALSWITCH_USER}"
    VIRTUALSWITCH_PASSWORD="${CI_VIRTUALSWITCH_PASSWORD}"
    BASE_URL="${CI_VIRTUALSWITCH_BASE_URL:-https://support.inverse.ca/~jgoimard/virtualswitch}"
    DEB_VERSION="{{.input.deb_version}}"

    if [ -z "$VIRTUALSWITCH_USER" ] || [ -z "$VIRTUALSWITCH_PASSWORD" ]; then
      echo "ERROR: CI_VIRTUALSWITCH_USER and CI_VIRTUALSWITCH_PASSWORD environment variables must be set"
      exit 1
    fi

    PACKAGE_URL="${BASE_URL}/virtualswitch_${DEB_VERSION}_amd64.deb"
    PACKAGE_FILE="/tmp/virtualswitch.deb"
    echo "Installing $PACKAGE_URL"

    # Install wpasupplicant dependency
    echo "Installing wpasupplicant..."
    apt-get update && apt-get install -y wpasupplicant

    # Download package with authentication
    curl -u "${VIRTUALSWITCH_USER}:${VIRTUALSWITCH_PASSWORD}" -L -o "$PACKAGE_FILE" "$PACKAGE_URL"
    if [ $? -ne 0 ]; then
      echo "ERROR: Failed to download virtualswitch package from $PACKAGE_URL"
      exit 1
    fi

    # Install the package (dpkg -i for local .deb files)
    dpkg -i "$PACKAGE_FILE"
    INSTALL_RESULT=$?

    # Fix any dependency issues
    if [ $INSTALL_RESULT -ne 0 ]; then
      echo "Fixing dependencies..."
      apt-get install -f -y
      INSTALL_RESULT=$?
    fi

    # Clean up
    rm -f "$PACKAGE_FILE"
    exit $INSTALL_RESULT
  assertions:
    - result.code ShouldEqual 0
