executor: virtualswitch_api_status
input:
  api_url: "http://10.255.255.2:8080"
  expected_code: "200"
  retry: 3
  delay: 2
steps:
- type: virtualswitch_api
  api_url: "{{.input.api_url}}"
  method: GET
  endpoint: /api/v1/status
  expected_code: "{{.input.expected_code}}"
  retry: "{{.input.retry}}"
  delay: "{{.input.delay}}"
  vars:
    virtualswitch_json:
      from: result.virtualswitch_responsejson
output:
  virtualswitch_api_status_: "{{.virtualswitch_json}}"
  virtualswitch_api_status__code: "{{.result.virtualswitch_http_code}}"
  virtualswitch_api_status__success: "{{.virtualswitch_json.success}}"
  virtualswitch_api_status__interfaces: "{{.virtualswitch_json.data.interfaces}}"
  virtualswitch_api_status__total: "{{.virtualswitch_json.data.total}}"
