executor: virtualswitch_plug_device
input:
  api_url: "http://10.99.99.254:38080"
  interface_id: "1"
  mac_address: ""
  auth_method: "mab"
  profile: "Linux Workstation"
  expected_code: "200"
steps:
- type: exec
  script: |
    curl -s -w "\n%{http_code}" -X POST {{.input.api_url}}/api/v1/interfaces/{{.input.interface_id}}/plug \
      -H "Content-Type: application/json" \
      -d '{
        "mac_address": "{{.input.mac_address}}",
        "auth_method": "{{.input.auth_method}}",
        "profile": "{{.input.profile}}"
      }'
  assertions:
    - result.code ShouldEqual 0
  vars:
    response_body:
      from: result.systemout
output:
  virtualswitch_plug_response: "{{.response_body}}"
