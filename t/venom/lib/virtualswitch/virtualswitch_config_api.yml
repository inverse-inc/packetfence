executor: virtualswitch_config_api
input:
  api_url: "http://localhost:8080"
  interfaces: "5"
  switch_type: "cisco"
  network_mapping: "10.99.0.0"
  radius_ip: "10.99.99.1"
  radius_port: "1812"
  radius_secret: "testing123"
  radius_accounting_interval: "60"
  radius_reauth_interval: "0"
  radius_auth_retry_interval: "30"
  dhcp_enabled: "false"
  ipfix_enabled: "false"
  scep_enabled: "false"
  wireless_ssid: "TestWiFi"
  wireless_switch_mac: "aa:bb:cc:dd:ee:ff"
  device_state_auto_save: "false"
steps:
- type: http
  method: PUT
  url: '{{.input.api_url}}/api/v1/config'
  headers:
    Content-Type: application/json
  body: >-
    {
      "interfaces": {{.input.interfaces}},
      "switch_type": "{{.input.switch_type}}",
      "network_mapping": "{{.input.network_mapping}}",
      "radius": {
        "ip": "{{.input.radius_ip}}",
        "port": {{.input.radius_port}},
        "secret": "{{.input.radius_secret}}",
        "accounting_interval_seconds": {{.input.radius_accounting_interval}},
        "reauth_interval_seconds": {{.input.radius_reauth_interval}},
        "auth_retry_interval_seconds": {{.input.radius_auth_retry_interval}}
      },
      "dhcp": {
        "enabled": {{.input.dhcp_enabled}}
      },
      "ipfix": {
        "enabled": {{.input.ipfix_enabled}}
      },
      "scep": {
        "enabled": {{.input.scep_enabled}}
      },
      "wireless": {
        "ssid": "{{.input.wireless_ssid}}",
        "switch_mac": "{{.input.wireless_switch_mac}}"
      },
      "device_state": {
        "auto_save": {{.input.device_state_auto_save}}
      },
      "interface_types": [
        {"id": 1, "type": "ethernet"},
        {"id": 2, "type": "ethernet"},
        {"id": 3, "type": "ethernet"},
        {"id": 4, "type": "ethernet"},
        {"id": 5, "type": "ethernet"}
      ],
      "vlans": [
        {"id": 2, "interfaces": [1,2,3,4,5]},
        {"id": 100, "interfaces": [1,2,3,4,5]},
        {"id": 200, "interfaces": [1,2,3,4,5]}
      ]
    }
  assertions:
    - result.statuscode ShouldEqual 200
output:
  virtualswitch_config_response: "{{.result.body}}"
