[ldap_default]
type=LDAP
description=LDAP source created before the parameter existed
host=ldap.example.com
port=389

[ad_enabled]
type=AD
description=Active Directory source using the connector
host=ad.example.com
port=389
use_connector=1

[ad_enabled rule catchall]
action0=set_role=default
match=all
class=authentication

[edir_disabled]
type=EDIR
description=eDirectory source not using the connector
host=edir.example.com
port=389
use_connector=0

[google_ldap]
type=GoogleWorkspaceLDAP
description=Google Workspace LDAP source
host=ldap.google.com
port=636

[radius_enabled]
type=RADIUS
description=RADIUS source using the connector
host=192.0.2.10
port=1812
use_connector=1

[sql]
type=SQL
description=Local database
