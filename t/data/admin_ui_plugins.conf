[demo]
enabled=enabled
description=Demo plugin
upstream=http://127.0.0.1:8080/api/v1/demo
acl=SYSTEM
manifest=<<EOT
{
  "title": "Demo",
  "collections": [
    {
      "id": "items",
      "title": "Demo items",
      "item_title": "Demo item",
      "collection": "config/items",
      "resource": "config/item",
      "columns": [ { "key": "id", "label": "Identifier", "searchable": true, "sortable": true } ],
      "form": { "fields": [ { "key": "id", "label": "Identifier", "identifier": true } ] }
    }
  ]
}
EOT
config_files=connectors.conf:config::Connector

[disabled]
enabled=disabled
description=Disabled plugin
upstream=http://127.0.0.1:8081
