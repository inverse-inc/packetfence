[Node::Report::Test]
type=sql
description=<<EOT
First node
EOT
columns=mac, ip, start_time, pid, detect_date, regdate, status, user_agent, computername, notes, last_arp, last_dhcp, os
sql=<<EOT
  SELECT
    n.mac as mac,
    ip,
    start_time,
    pid,
    detect_date,
    regdate,
    status,
    user_agent,
    computername,
    notes,
    last_arp,
    last_dhcp,
    device_type AS os
  FROM node n LEFT JOIN ip4log i USING ( mac)
  WHERE
  (i.end_time = 0 OR i.end_time > NOW())
    ORDER BY n.mac
    LIMIT 1;
EOT
cursor_type=none
has_limit=disabled

