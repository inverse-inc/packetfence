[Node::Report::Test::Nothing]
type=sql
description=Simple test node report
columns=mac, pid, detect_date, category_id
sql=<<EOT
  SELECT
    mac,
    pid,
    detect_date,
    category_id
  FROM node
  ORDER BY mac
  LIMIT 1;
EOT
cursor_type=none

