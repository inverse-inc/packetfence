<div class="u-padding">
  <div class="o-media o-media--error u-padding u-margin-bottom">
    <div class="o-media__img">[% flashIcon(level='error') %]</div>
    <p class="o-media__body">[% i18n("This device does not meet the compliance requirements of your network.") %]</p>
  </div>

  <p>[% i18n("Make sure this device is enrolled and up to date in the management platform of your organization, then click 'Continue' to check it again.") %]</p>

  <div class="o-layout o-layout--center">
    <div class="o-layout__item u-1/1 u-2/3@tablet u-3/5@desktop">
      <a href="/captive-portal" class="c-btn c-btn--primary u-1/1">
        [% i18n("Continue") %]
      </a>
    </div>
  </div>
</div>
