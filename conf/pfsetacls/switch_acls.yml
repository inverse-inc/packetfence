- name: "Push ACLs on network equipments"
  hosts: switches
  gather_facts: no

[% IF type.match('Aruba::Mobility_Master') %]
  roles:
   - role: arubanetworks.aos_wlan_role

[% END %]

  tasks:

    - name: Parse the IOS acls configuration file
      cisco.ios.ios_acls:
        running_config: "{{ lookup('file', acl_config ) }}"
        state: parsed
      register: acls
      when: ansible_network_os == 'cisco.ios.ios'

    - name: Load new acl into Cisco Switch
      cisco.ios.ios_acls:
        config: "{{ acls.parsed }}"[% IF delete >= 1 %]
        state: deleted[% ELSE %]
        state: replaced[% END %]
      when: ansible_network_os == 'cisco.ios.ios'

    - name: Load new acl into Cisco WLC
      community.network.aireos_config:
        src: "{{ acl_config }}"
      when: ansible_network_os == 'aireos'

    - name: Load new acl into Cisco WLC 2nd pass
      community.network.aireos_config:
        src: "{{ acl_config }}"
      when: ansible_network_os == 'aireos'

    - name: Load new acl in Aruba-CX
      arubanetworks.aoscx.aoscx_config:
        src: "{{ acl_config }}"
      when: ansible_network_os == 'arubanetworks.aoscx.aoscx'

    - name: Parse the Arista acls configuration file
      arista.eos.eos_acls:
        running_config: "{{ lookup('file', acl_config ) }}"
        state: parsed
      register: aristaacls
      when: ansible_network_os == 'arista.eos.eos'

    - name: Load new acl into Arista Switch
      arista.eos.eos_acls:
        config: "{{ aristaacls.parsed }}"[% IF delete >= 1 %]
        state: deleted[% ELSE %]
        state: replaced[% END %]
      when: ansible_network_os == 'arista.eos.eos'

    - name: Load new acl into NEC/Comware switch
      # Comware config push goes through cli_command line-by-line: cli_config's
      # privilege/config-mode logic does not fit Comware (no enable mode, config
      # prompt is [..] not ..#).
      ansible.netcommon.cli_command:
        command: "{{ item }}"
      loop: "{{ ['system-view'] + lookup('file', acl_config).splitlines() }}"
      when: ansible_network_os == 'packetfence.comware.comware'

    - name: Delete acl into Aruba Controller
      community.network.aruba_config:
        src: "{{ acl_deconfig }}"
      when: ansible_network_os == 'aruba'

[% FOREACH role IN acls.keys %]
    - name: Load new acl [% role %] into Aruba Controller
      community.network.aruba_config:
        src: "{{ [% role %]acl_config }}"
      when: ansible_network_os == 'aruba'

[% END %]

[% IF type.match('Aruba::Mobility_Master') %]
[% DEFAULT wsPath = '/mm' %]

    - name: Fetch roles
      aos_api_config:
        method: GET
        api_object: role
        config_path: [% wsPath %]
        filter: [ {'OBJECT': { '$eq': [ 'role.rname' ] } } ]
      register: roles_output

    - name: Extract rname with json_query
      set_fact:
        rname_list: "{{ roles_output.response._data.role | json_query('[].rname') }}"


    - name: Fetch policies
      aos_api_config:
        method: GET
        api_object: acl_sess
        config_path: [% wsPath %]
        filter: [ {'OBJECT': { '$eq': [ 'acl_sess.accname' ] } } ]
      register: policies_output

    - name: Extract accname with json_query
      set_fact:
        accname_list: "{{ policies_output.response._data.acl_sess | json_query('[].accname') }}"


[% FOREACH role IN AccessListEnabled.keys %]
[% cleankey = role.replace('[^a-zA-Z0-9\s]', '', 'g') %]

    - name: Boolean variable if pf-role-[% role %] exists
      set_fact:
        contains_pf_role_[% cleankey %]_delete: "{{ 'pf-role-[% role %]' in rname_list }}"

    - name: Delete unused role pf-role-[% role %] into Aruba Mobility Master
      aos_api_config:
        method: POST
        config_path: [% wsPath %]
        data:
          - role:
              rname: pf-role-[% role %]
              _action: delete
        commit: True
      when: contains_pf_role_[% cleankey %]_delete

    - name: Boolean variable if pf-policy-[% role %] exists
      set_fact:
        contains_pf_policy_[% cleankey %]_delete: "{{ 'pf-policy-[% role %]' in accname_list }}"

    - name: Delete unused acl pf-policy-[% role %] into Aruba Mobility Master
      aos_api_config:
        method: POST
        config_path: [% wsPath %]
        data:
          - acl_sess:
              accname: pf-policy-[% role %]
              _action: delete
        commit: True
      when: contains_pf_policy_[% cleankey %]_delete

[% END %]

[% FOREACH key IN acls_array.keys %]
[% cleankey = key.replace('[^a-zA-Z0-9\s]', '', 'g') %]

    - name: Boolean variable if pf-role-[% key %]
      set_fact:
        contains_pf_role_[% cleankey %]: "{{ 'pf-role-[% key %]' in rname_list }}"

    - name: Delete previous role pf-role-[% key %] into Aruba Mobility Master
      aos_api_config:
        method: POST
        config_path: [% wsPath %]
        data:
          - role:
              rname: pf-role-[% key %]
              _action: delete
        commit: True
      when: contains_pf_role_[% cleankey %]

    - name: Boolean variable if pf-policy-[% key %]
      set_fact:
        contains_pf_policy_[% cleankey %]: "{{ 'pf-policy-[% key %]' in accname_list }}"

    - name: Delete previous acl pf-policy-[% key %] into Aruba Mobility Master
      aos_api_config:
        method: POST
        config_path: [% wsPath %]
        data:
          - acl_sess:
              accname: pf-policy-[% key %]
              _action: delete
        commit: True
      when: contains_pf_policy_[% cleankey %]

[% END %]

[% FOREACH key IN acls_array.keys %]
    - name: Load new acl pf-policy-[% key %] into Aruba Mobility Master
      aos_api_config:
        method: POST
        config_path: [% wsPath %]
        data:
          - acl_sess:
              accname: pf-policy-[% key %]
              acl_sess__desc:
                description: PacketFence managed policy for [% key %]
              acl_sess__v4policy:[% FOREACH acl IN acls_array.$key %]
                - suser: true
                  src: suser
                  dst: [% acl.dst_object %][% IF acl.dst_object == "dnetwork" %]
                  dnetaddr: [% acl.dst_network %]
                  dnetmask: [% acl.dst_netmask %][% ELSIF acl.dst_object == "dhost"%]
                  dipaddr: [% acl.dst_ipaddr %][% ELSE %]
                  dany: true[% END %]
                  service_app: service[% IF acl.action == "permit" %]
                  permit: true
                  action: permit[% ELSE %]
                  deny: true
                  action: deny_opt[% END %][% IF acl.protocol == "ip" %]
                  svc: service-any
                  service-any: true[% ELSE %]
                  proto: [% acl.protocol %]
                  svc: tcp_udp
                  port: range
                  port1: [% acl.dst_port %][% IF acl.range == "true" %]
                  port2: [% acl.dst_port2 %][% END %][% END %][% END %]
        commit: True
      when: ansible_network_os == 'aos'
[% END %]

[% FOREACH key IN acls_array.keys %]
    - name: Load new roles pf-role-[% key %] into Aruba Mobility Master
      aos_api_config:
        method: POST
        config_path: [% wsPath %]
        data:
          - role:
              rname: pf-role-[% key %]
              role__acl:
                - pname: pf-policy-[% key %]
                  acl_type: session
        commit: True
      when: ansible_network_os == 'aos'
[% END %]
[% END %]

[% IF type.match('Meraki::') %]
# Meraki: the ACLs of a role are the Layer 3 firewall rules of a group policy
# named after the role, created or updated through the Dashboard API. The
# access policy of the ports returns the group policy named by Filter-Id.

    - name: Meraki Dashboard API
      ansible.builtin.set_fact:
        meraki_api_url: "{{ meraki_api_url | default('https://api.meraki.com/api/v1') }}"
        meraki_headers:
          X-Cisco-Meraki-API-Key: "{{ meraki_api_key }}"
          Content-Type: application/json
          Accept: application/json

    - name: Find the Meraki network of the switch
      when: meraki_network_id | default('') | length == 0
      block:
        - name: Fetch the organizations
          ansible.builtin.uri:
            url: "{{ meraki_api_url }}/organizations"
            headers: "{{ meraki_headers }}"
            follow_redirects: all
          register: meraki_organizations

        - name: Fetch the switches of the organizations
          ansible.builtin.uri:
            url: "{{ meraki_api_url }}/organizations/{{ item.id }}/devices?productTypes[]=switch"
            headers: "{{ meraki_headers }}"
            follow_redirects: all
          loop: "{{ meraki_organizations.json }}"
          loop_control:
            label: "{{ item.name }}"
          register: meraki_devices

        - name: Keep the network of the switch
          ansible.builtin.set_fact:
            meraki_switch_networks: "{{ meraki_devices.results | map(attribute='json') | flatten | selectattr('lanIp', 'defined') | selectattr('lanIp', 'equalto', meraki_switch_ip) | map(attribute='networkId') | list }}"

        - name: Check that the switch is in the organizations
          ansible.builtin.assert:
            that: meraki_switch_networks | length > 0
            fail_msg: "No Meraki switch has the LAN IP {{ meraki_switch_ip }} in the organizations this API key can read: set the network ID of the switch in its Web Services Path"

        - name: Set the network of the switch
          ansible.builtin.set_fact:
            meraki_network_id: "{{ meraki_switch_networks | first }}"

    - name: Fetch the group policies of the network
      ansible.builtin.uri:
        url: "{{ meraki_api_url }}/networks/{{ meraki_network_id }}/groupPolicies"
        headers: "{{ meraki_headers }}"
        follow_redirects: all
      register: meraki_group_policies

    - name: Index the group policies by name
      ansible.builtin.set_fact:
        meraki_group_policy_ids: "{{ dict(meraki_group_policies.json | map(attribute='name') | zip(meraki_group_policies.json | map(attribute='groupPolicyId'))) }}"

[% FOREACH key IN acls_array.keys %]
[% IF delete >= 1 %]
    - name: Delete the group policy [% key %]
      ansible.builtin.uri:
        method: DELETE
        url: "{{ meraki_api_url }}/networks/{{ meraki_network_id }}/groupPolicies/{{ meraki_group_policy_ids['[% key %]'] }}"
        headers: "{{ meraki_headers }}"
        follow_redirects: all
        status_code: [200, 204]
      changed_when: true
      when: "'[% key %]' in meraki_group_policy_ids"
[% ELSE %]
    - name: Update the group policy [% key %]
      ansible.builtin.uri:
        method: PUT
        url: "{{ meraki_api_url }}/networks/{{ meraki_network_id }}/groupPolicies/{{ meraki_group_policy_ids['[% key %]'] }}"
        headers: "{{ meraki_headers }}"
        follow_redirects: all
        body_format: json
        body:
          name: "[% key %]"
          firewallAndTrafficShaping:
            settings: custom
            l3FirewallRules:
[% FOREACH rule IN acls_array.$key %]
              - comment: "[% rule.comment %]"
                policy: [% rule.policy %]
                protocol: [% rule.protocol %]
                destPort: "[% rule.destPort %]"
                destCidr: "[% rule.destCidr %]"
[% END %]
      changed_when: true
      when: "'[% key %]' in meraki_group_policy_ids"

    - name: Create the group policy [% key %]
      ansible.builtin.uri:
        method: POST
        url: "{{ meraki_api_url }}/networks/{{ meraki_network_id }}/groupPolicies"
        headers: "{{ meraki_headers }}"
        follow_redirects: all
        status_code: [200, 201]
        body_format: json
        body:
          name: "[% key %]"
          scheduling:
            enabled: false
          bandwidth:
            settings: network default
          firewallAndTrafficShaping:
            settings: custom
            trafficShapingRules: []
            l7FirewallRules: []
            l3FirewallRules:
[% FOREACH rule IN acls_array.$key %]
              - comment: "[% rule.comment %]"
                policy: [% rule.policy %]
                protocol: [% rule.protocol %]
                destPort: "[% rule.destPort %]"
                destCidr: "[% rule.destCidr %]"
[% END %]
          vlanTagging:
            settings: network default
          splashAuthSettings: network default
      changed_when: true
      when: "'[% key %]' not in meraki_group_policy_ids"
[% END %]

[% END %]
[% FOREACH role IN AccessListEnabled.keys %]
    - name: Delete the group policy [% role %], the ACLs of the role were disabled on the switch
      ansible.builtin.uri:
        method: DELETE
        url: "{{ meraki_api_url }}/networks/{{ meraki_network_id }}/groupPolicies/{{ meraki_group_policy_ids['[% role %]'] }}"
        headers: "{{ meraki_headers }}"
        follow_redirects: all
        status_code: [200, 204]
      changed_when: true
      when: "'[% role %]' in meraki_group_policy_ids"

[% END %]
[% END %]

[% FOREACH role IN interfaces_delete.keys %]
[% FOREACH interface IN interfaces_delete.$role %]
    - name: remove acl on interface
      cisco.ios.ios_config:
        lines:
          - no ip access-group [% role %] in
        parents: "{{ item }}"
      with_items:
       - interface [% interface %]
[% END %]
[% END %]

[% IF delete == 0 %]
[% FOREACH role IN interfaces.keys %]
[% FOREACH interface IN interfaces.$role %]
    - name: Merge module attributes of given access-groups
      cisco.ios.ios_acl_interfaces:
        config:
          - name: [% interface %]
            access_groups:
              - afi: ipv4
                acls:
                  - name: [% role %]
                    direction: in[% IF delete >= 1 %]
        state: deleted[% ELSE %]
        state: merged[% END %]
      when: ansible_network_os == 'cisco.ios.ios'
[% END %]
[% END %]
[% END %]
