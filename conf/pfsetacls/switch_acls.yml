- name: "Push ACLs on network equipments"
  hosts: switches
  gather_facts: no

[% IF type.match('Aruba::Mobility_Master') %]
  roles:
   - role: arubanetworks.aos_wlan_role

[% END %]

  tasks:

    - name: Parse the IOS acls configuration file
      cisco.ios.ios_acls:
        running_config: "{{ lookup('file', acl_config ) }}"
        state: parsed
      register: acls
      when: ansible_network_os == 'cisco.ios.ios'

    - name: Load new acl into Cisco Switch
      cisco.ios.ios_acls:
        config: "{{ acls.parsed }}"[% IF delete >= 1 %]
        state: deleted[% ELSE %]
        state: replaced[% END %]
      when: ansible_network_os == 'cisco.ios.ios'

    - name: Load new acl into Cisco WLC
      community.network.aireos_config:
        src: "{{ acl_config }}"
      when: ansible_network_os == 'aireos'

    - name: Load new acl into Cisco WLC 2nd pass
      community.network.aireos_config:
        src: "{{ acl_config }}"
      when: ansible_network_os == 'aireos'

    - name: Load new acl in Aruba-CX
      arubanetworks.aoscx.aoscx_config:
        src: "{{ acl_config }}"
      when: ansible_network_os == 'arubanetworks.aoscx.aoscx'

    - name: Parse the Arista acls configuration file
      arista.eos.eos_acls:
        running_config: "{{ lookup('file', acl_config ) }}"
        state: parsed
      register: aristaacls
      when: ansible_network_os == 'arista.eos.eos'

    - name: Load new acl into Arista Switch
      arista.eos.eos_acls:
        config: "{{ aristaacls.parsed }}"[% IF delete >= 1 %]
        state: deleted[% ELSE %]
        state: replaced[% END %]
      when: ansible_network_os == 'arista.eos.eos'

    - name: Delete acl into Aruba Controler
      community.network.aruba_config:
        src: "{{ acl_deconfig }}"
      when: ansible_network_os == 'aruba'

[% FOREACH role IN acls.keys %]
    - name: Load new acl [% role %] into Aruba Controler
      community.network.aruba_config:
        src: "{{ [% role %]acl_config }}"
      when: ansible_network_os == 'aruba'

[% END %]

[% IF type.match('Aruba::Mobility_Master') %]

    - name: Fetch roles
      aos_api_config:
        method: GET
        api_object: role
        config_path: /mm
        filter: [ {'OBJECT': { '$eq': [ 'role.rname' ] } } ]
      register: roless_output

    - name: Extract rname with json_query
      set_fact:
        rname_list: "{{ roless_output.response._data.role | json_query('[].rname') }}"

    - name: Show roles
      debug:
        var: rname_list


    - name: Fetch policies
      aos_api_config:
        method: GET
        api_object: acl_sess
        config_path: /mm
        filter: [ {'OBJECT': { '$eq': [ 'acl_sess.accname' ] } } ]
      register: policies_output

    - name: Extract accname with json_query
      set_fact:
        accname_list: "{{ policies_output.response._data.acl_sess | json_query('[].accname') }}"

    - name: Show policies
      debug:
        var: accname_list


[% FOREACH key IN acls_array.keys %]
[% cleankey = key.replace('[^a-zA-Z0-9\s]', '', 'g') %]

    - name: Boolean variable if pf-role-[% key %]
      set_fact:
        contains_pf_role_[% cleankey %]: "{{ 'pf-role-[% key %]' in rname_list }}"

    - name: Delete previous role into Aruba Mobility Master
      aos_api_config:
        method: POST
        config_path: /mm
        data:
          - role:
              rname: pf-role-[% key %]
              _action: delete
        commit: True
      when: contains_pf_role_[% cleankey %]

    - name: Boolean variable if pf-policy-[% key %]
      set_fact:
        contains_pf_policy_[% cleankey %]: "{{ 'pf-policy-[% key %]' in accname_list }}"

    - name: Delete previous acl into Aruba Mobility Master
      aos_api_config:
        method: POST
        config_path: /mm
        data:
          - acl_sess:
              accname: pf-policy-[% key %]
              _action: delete
        commit: True
      when: contains_pf_policy_[% cleankey %]

[% END %]

    - name: Load new acl into Aruba Mobility Master
      aos_api_config:
        method: POST
        config_path: /mm
        data:
          - acl_sess:
[% FOREACH key IN acls_array.keys %]              accname: pf-policy-[% key %]
              acl_sess__desc:
                description: PacketFence managed policy for [% key %]
              acl_sess__v4policy:[% FOREACH acl IN acls_array.$key %]
                - suser: true
                  src: suser
                  dst: [% acl.dst_object %][% IF acl.dst_object == "dnetwork" %]
                  dnetaddr: [% acl.dst_network %]
                  dnetmask: [% acl.dst_netmask %][% ELSIF acl.dst_object == "dhost"%]
                  dipaddr: [% acl.dst_ipaddr %][% ELSE %]
                  dany: true[% END %]
                  service_app: service[% IF acl.action == "permit" %]
                  permit: true
                  action: permit[% ELSE %]
                  deny: true
                  action: deny_opt[% END %][% IF acl.protocol == "ip" %]
                  svc: service-any
                  service-any: true[% ELSE %]
                  proto: [% acl.protocol %]
                  svc: tcp_udp
                  port: range
                  port1: [% acl.dst_port %][% IF acl.range == "true" %]
                  port2: [% acl.dst_port2 %][% END %][% END %][% END %]
        commit: True
      when: ansible_network_os == 'aos'
[% END %]

    - name: Load new roles into Aruba Mobility Master
      aos_api_config:
        method: POST
        config_path: /mm
        data:
          - role:
[% FOREACH key IN acls_array.keys %]              rname: pf-role-[% key %]
              role__acl:
                - pname: pf-policy-[% key %]
                  acl_type: session
        commit: True
      when: ansible_network_os == 'aos'
[% END %]
[% END %]

[% FOREACH role IN interfaces_delete.keys %]
[% FOREACH interface IN interfaces_delete.$role %]
    - name: remove acl on interface
      cisco.ios.ios_config:
        lines:
          - no ip access-group [% role %] in
        parents: "{{ item }}"
      with_items:
       - interface [% interface %]
[% END %]
[% END %]

[% IF delete == 0 %]
[% FOREACH role IN interfaces.keys %]
[% FOREACH interface IN interfaces.$role %]
    - name: Merge module attributes of given access-groups
      cisco.ios.ios_acl_interfaces:
        config:
          - name: [% interface %]
            access_groups:
              - afi: ipv4
                acls:
                  - name: [% role %]
                    direction: in[% IF delete >= 1 %]
        state: deleted[% ELSE %]
        state: merged[% END %]
      when: ansible_network_os == 'cisco.ios.ios'
[% END %]
[% END %]
[% END %]
