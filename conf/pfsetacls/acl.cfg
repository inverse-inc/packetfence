[% FOREACH key IN acls.keys %]
[% IF type.match('Cisco::Cisco_WLC_AireOS') %]acl delete [% key %][% ELSIF type.match('Arista::AristaSwitch') %]ip access-list [% key %][% ELSIF type.match('Cisco::ASA') or type.match('Cisco::\w+') %]Extended IP access list [% key %][% ELSIF type.match('Aruba::CX') %]config
no access-list ip [% key %]
