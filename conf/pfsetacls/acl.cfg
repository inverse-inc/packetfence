[% ELSIF type.match('Aruba::Controller_200') %]
ip access-list session pf-policy[% key %][% END %]
[% acls.$key %][% IF type.match('Aruba::CX') %]exit
wr mem
end[% END %]
[% IF type.match('Aruba::Controller_200') %]

user-role pf-role-[% key %]
