name: Reusable unit test
on:
  workflow_call:
    inputs:
      _IMAGE_TYPE:
        required: True
        type: string
      _PACKAGE_NAME:
        required: True
        type: string

jobs:
  unit-test-rhel:
    name: unit-test
    if: inputs._IMAGE_TYPE == 'rhel8'
    runs-on: packetfence-perl-package-build
    container:
      # UBI is public on Docker Hub, so no registry credentials are required.
      image: redhat/ubi8:8.8
    steps:
      - name: Download artifactory rhel8
        uses: actions/download-artifact@v4.1.7
        with:
          name: package-rpm8
          path:  /mnt

      - name: Install the package ${{ inputs._PACKAGE_NAME }} rhel8
        run: |
          ls -la /mnt
          PF_RELEASE_PATH=https://raw.githubusercontent.com/inverse-inc/packetfence/devel/conf/pf-release
          PF_MINOR_RELEASE=$(curl -s ${PF_RELEASE_PATH}  | grep -oE '[0-9]+\.[0-9]+')
          yum -y install findutils
          yum -y localinstall http://packetfence.org/downloads/PacketFence/RHEL8/packetfence-release-${PF_MINOR_RELEASE}.el8.noarch.rpm
          set -e && find /mnt -name ${{ inputs._PACKAGE_NAME }}*.rpm -exec bash -c 'yum -y localinstall --enablerepo=packetfence {}' \;
          echo "Next packages ${{ inputs._PACKAGE_NAME }} was installed successfuly: "
          rpm -qa | grep ${{ inputs._PACKAGE_NAME }}

  unit-test-debian:
    name: unit-test
    if: inputs._IMAGE_TYPE == 'debian11' || inputs._IMAGE_TYPE == 'debian12'
    runs-on: packetfence-perl-package-build
    container:
      # The Debian package test uses the private, pre-baked signing image.
      image: ghcr.io/inverse-inc/packetfence/signing-packages:latest
      credentials:
        username: ${{ vars.USER_GITHUB }}
        password: ${{ secrets.TOKEN_GITHUB }}
    steps:
      - name: Download artifactory ${{ inputs._IMAGE_TYPE }}
        uses: actions/download-artifact@v4.1.7
        with:
          name: ${{ env.ARTIFACTORY_NAME }}
          path: /mnt
        env:
          ARTIFACTORY_NAME: ${{ inputs._IMAGE_TYPE == 'debian11' && 'package-deb11' || 'package-deb12' }}

      - name: Install the package ${{ inputs._PACKAGE_NAME }} debian
        run: |
          ls -la /mnt
          PF_RELEASE_PATH=https://raw.githubusercontent.com/inverse-inc/packetfence/devel/conf/pf-release
          PF_MINOR_RELEASE=$(curl -s ${PF_RELEASE_PATH}  | grep -oE '[0-9]+\.[0-9]+')
          wget -q -O - https://inverse.ca/downloads/GPG_PUBLIC_KEY | apt-key add -
          echo "deb http://inverse.ca/downloads/PacketFence/debian/${PF_MINOR_RELEASE} bookworm bookworm" > /etc/apt/sources.list.d/packetfence.list
          apt update
          set -e && find /mnt -name ${{ inputs._PACKAGE_NAME }}*.deb -exec bash -c 'apt install -f -y {}' \;
          echo "Next packages ${{ inputs._PACKAGE_NAME }} was installed successfuly: "
          dpkg -l | grep ${{ inputs._PACKAGE_NAME }}

  unit-test-debian13:
    name: unit-test
    if: inputs._IMAGE_TYPE == 'debian13'
    runs-on: packetfence-perl-package-build
    container:
      # A trixie .deb has to be installed on trixie: signing-packages is still
      # debian:bookworm, so the job above cannot validate Debian 13 packages.
      # The stock Debian image is public, so no registry credentials are needed.
      image: debian:13
    steps:
      - name: Download artifactory ${{ inputs._IMAGE_TYPE }}
        uses: actions/download-artifact@v4.1.7
        with:
          name: package-deb13
          path: /mnt

      - name: Install the package ${{ inputs._PACKAGE_NAME }} debian
        run: |
          ls -la /mnt
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg
          PF_RELEASE_PATH=https://raw.githubusercontent.com/inverse-inc/packetfence/devel/conf/pf-release
          PF_MINOR_RELEASE=$(curl -s ${PF_RELEASE_PATH}  | grep -oE '[0-9]+\.[0-9]+')
          # apt-key is gone in trixie; use a signed-by keyring, the way the
          # pfbuild-trixie and pfdebian-trixie images do.
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://inverse.ca/downloads/GPG_PUBLIC_KEY \
            | gpg --dearmor -o /etc/apt/keyrings/packetfence.gpg
          echo "deb [signed-by=/etc/apt/keyrings/packetfence.gpg] http://inverse.ca/downloads/PacketFence/debian/${PF_MINOR_RELEASE} trixie trixie" \
            > /etc/apt/sources.list.d/packetfence.list
          apt-get update
          set -e && find /mnt -name ${{ inputs._PACKAGE_NAME }}*.deb -exec bash -c 'apt-get install -f -y {}' \;
          echo "Next packages ${{ inputs._PACKAGE_NAME }} was installed successfuly: "
          dpkg -l | grep ${{ inputs._PACKAGE_NAME }}
