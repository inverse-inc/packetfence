name: Reusable publish of a dependency package to the package origin
on:
  workflow_call:
    inputs:
      _IMAGE_TYPE:
        required: True
        type: string
      _BRANCH_NAME:
        required: True
        type: string
      _VOLUME_MOUNT:
        required: True
        type: string
      _PACKAGE_NAME:
        required: True
        type: string

# Into the native repository of this branch's release on the packaging Pulp (ci/pulp/publish-dependency.sh),
# with the ci-packages account like the GitLab deploys. Repository settings it needs: the variable
# PSONO_CI_PULP_PACKAGES_ID (the ci-packages Psono entry, readable by the PSONO_API_KEY_ID key) and,
# optionally, PF_PACKAGE_ORIGIN.
jobs:
  upload-package:
    runs-on: packetfence-perl-package-build
    container:
      # python3-requests-toolbelt and python3-nacl: the Pulp upload and the Psono lookup.
      image: ghcr.io/inverse-inc/packetfence/publish-ppa:latest
      credentials:
        username: ${{ vars.USER_GITHUB }}
        password: ${{ secrets.TOKEN_GITHUB }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifactory ${{ inputs._IMAGE_TYPE }}
        uses: actions/download-artifact@v4.1.7
        with:
          name: ${{ env.ARTIFACTORY_NAME }}
          path:  /mnt
        env:
          ARTIFACTORY_NAME: ${{ inputs._IMAGE_TYPE == 'rhel8' &&  'package-rpm8' || inputs._IMAGE_TYPE == 'debian11' && 'package-deb11' || inputs._IMAGE_TYPE == 'debian12' && 'package-deb12' }}

      - name: Publish the package to the package origin
        shell: bash
        env:
          IMAGE_TYPE: ${{ inputs._IMAGE_TYPE }}
          PACKAGE_NAME: ${{ inputs._PACKAGE_NAME }}
          PACKAGE_SUFFIX: ${{ inputs._IMAGE_TYPE == 'rhel8' && 'rpm' || 'deb' }}
          PF_PACKAGE_ORIGIN: ${{ vars.PF_PACKAGE_ORIGIN || 'https://packages.packetfence.com' }}
          PSONO_CI_API_KEY_ID: ${{ secrets.PSONO_API_KEY_ID }}
          PSONO_CI_API_SECRET_KEY_HEX: ${{ secrets.PSONO_API_KEY_SECRET_KEY }}
          PSONO_CI_PULP_PACKAGES_ID: ${{ vars.PSONO_CI_PULP_PACKAGES_ID }}
        run: |
          shopt -s nullglob
          packages=(/mnt/"$PACKAGE_NAME"*."$PACKAGE_SUFFIX")
          bash ci/pulp/publish-dependency.sh "$IMAGE_TYPE" "${packages[@]}"
